name: AIgregatore ultim'ora
# Ogni 10 minuti: legge i feed delle testate (solo titoli e link) e aggiorna aigregatore/ultimora.json.
# Nessuna intelligenza artificiale, nessun token. Il programma sta in .github/ultimora/.
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ultimora
  cancel-in-progress: false
jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Controlla le testate
        run: python3 .github/ultimora/ultimora.py aigregatore
      - name: Pubblica
        run: |
          git config user.name manliograndi-del
          git config user.email manliograndi-del@users.noreply.github.com
          git add aigregatore/ultimora.json
          git diff --cached --quiet && exit 0
          git commit -q -m "AIgregatore: ultim'ora"
          for i in 1 2 3 4; do git push origin HEAD:main && exit 0; sleep $((i*5)); git pull -q --rebase origin main; done
          exit 1
