ammi, purché guidati da mediatori e nell'interesse di vittima e autore.", "quando": "nell'interesse di vittima e autore (art. 53, lett. c)", "base": "d.lgs. 150/2022, art. 53, c. 1, lett. c)", "dove": "Trentino-Alto Adige; Napoli; Torino; Verona"}, {"s": "programma-restorative-conferencing", "ti": "Restorative / community conferencing", "en": "restorative conferencing; community conferencing; police-led conferencing", "chi": "autore e sostenitori; vittima e sostenitori; facilitatore (un agente di polizia nei modelli Wagga Wagga e Thames Valley)", "come": "Incontro di gruppo con autore, vittima e le persone che li sostengono, guidato da un facilitatore con domande in ordine fisso; si chiude con un accordo scritto.", "quando": "ammonimento di polizia, diversion, minori (estero)", "base": "ECOSOC 2002/12 par. 2; CM/Rec(2018)8 par. 5; in Italia art. 53, lett. b) o c) (attribuzione non dichiarata dalle fonti)", "dove": "Verona (prevista); formazione Caritas"}, {"s": "programma-family-group-conference", "ti": "Family group conference", "en": "family group conference (FGC); family group decision making (FGDM)", "chi": "autore; famiglia allargata (whānau); vittima e sostenitori; coordinatore/facilitatore; in NZ youth advocate e polizia (da verificare sulla s. 251)", "come": "Riunione della famiglia allargata dell'autore, con la vittima e un coordinatore, che decide un piano; nata nella giustizia minorile della Nuova Zelanda nel 1989.", "quando": "giustizia minorile e tutela (NZ); misure cautelari ed esecuzione (TAA)", "base": "NZ: Oranga Tamariki Act 1989, ss. 22, 251 ss.; Italia: art. 53, lett. c) (attribuzione non dichiarata)", "dove": "Trentino-Alto Adige; Torino (nominata); Lazio («group conferencing»)"}, {"s": "programma-cerchi", "ti": "Cerchi (talking, healing, peacemaking circles)", "en": "talking circle; healing circle; peacemaking circle; conflict resolution circle; community circle", "chi": "persone coinvolte; familiari; membri della comunità; a volte operatori e funzionari; uno o due facilitatori (keeper)", "come": "Incontro in cerchio in cui si parla a turno passando un oggetto; partecipano le persone coinvolte e membri della comunità; si usa in comunità, scuola e carcere.", "quando": "comunità, scuola, carcere, rientro dal carcere", "base": "CM/Rec(2018)8 par. 5 e regola 61; in Italia art. 53, lett. c) (Relazione illustrativa)", "dove": "Trentino-Alto Adige; Napoli; Torino; Tempio Pausania; Lecco; scuole"}, {"s": "programma-sentencing-circle", "ti": "Sentencing circle", "en": "sentencing circle; circle sentencing", "chi": "giudice; accusa; difesa; autore; vittima; familiari; comunità", "come": "Cerchio con giudice, accusa, difesa, autore, vittima e comunità che discute la pena; il giudice non è vincolato. Nato in Canada, non praticato in Italia.", "quando": "commisurazione della pena (Canada)", "base": "prassi giurisprudenziale canadese (R. v. Moses, 1992); CM/Rec(2018)8 par. 5", "dove": "non praticato"}, {"s": "programma-community-panel", "ti": "Community justice panels / boards", "en": "community justice panel; reparative board; youth offender panel; referral order panel", "chi": "volontari della comunità formati; autore; genitore se minore di 16 anni (UK); vittima se vuole; consulente del servizio", "come": "Gruppo di cittadini volontari formati che incontra l'autore (spesso giovane o per reati lievi) e concorda con lui riparazioni e impegni; la vittima può partecipare.", "quando": "diversion o pena per minori e reati lievi", "base": "UK: Youth Justice and Criminal Evidence Act 1999; Powers of Criminal Courts (Sentencing) Act 2000; Vermont: reparative probation", "dove": "non praticato"}, {"s": "programma-sicomoro", "ti": "Progetto Sicomoro (Sycamore Tree Project)", "en": "Sycamore Tree Project (STP)", "chi": "detenuti volontari; vittime di altri reati; uno o due facilitatori; rappresentanti della comunità all'ultima sessione", "come": "Corso in carcere in cui un gruppo di detenuti incontra vittime di altri reati per circa otto sessioni; si chiude con un momento pubblico. In Italia lo cura Prison Fellowship Italia.", "quando": "in carcere, dopo la condanna", "base": "nessuna (programma di un'associazione); in Italia in carcere, in rapporto con l'art. 53, lett. a) o c) da verificare", "dove": "Opera (dal 2010); Ivrea (dal 2018); altre carceri"}, {"s": "programma-victim-panel", "ti": "Victim panel (gruppo di vittime e di autori)", "en": "victim panel", "chi": "4-5 vittime al massimo; piccolo gruppo di autori di reati dello stesso tipo; mediatori", "come": "Alcune vittime (al massimo 4 o 5) raccontano gli effetti del reato a un piccolo gruppo di autori di reati simili che non sono i loro offensori, in forma di dialogo o di cerchio.", "quando": "quando non c'è incontro con la propria vittima", "base": "d.lgs. 150/2022, art. 53 (lettera non indicata dalla fonte)", "dove": "Trentino-Alto Adige"}, {"s": "programma-victim-impact-panel", "ti": "Victim impact panel", "en": "victim impact panel (VIP)", "chi": "3-5 vittime volontarie; pubblico di condannati; un facilitatore", "come": "Incontro unico in cui 3-4 vittime raccontano la propria storia a un pubblico di condannati, di solito per guida in stato di ebbrezza; durante gli interventi non c'è dialogo.", "quando": "guida in stato di ebbrezza (USA)", "base": "ordini dei tribunali statunitensi (diversion o parte della pena)", "dove": "non trovato"}, {"s": "programma-gruppi-riparativi-per-autori", "ti": "Gruppi riparativi per autori di reato", "en": "offender groups; victim awareness course (da verificare)", "chi": "gruppo di autori; vittime come testimoni; mediatori o facilitatori", "come": "Percorsi di gruppo per persone che hanno commesso reati: riflettono sulle conseguenze per le vittime, ascoltano testimonianze e progettano un'attività riparativa.", "quando": "carcere, messa alla prova, reati senza vittima specifica", "base": "non indicata dalle fonti; in discussione la riconducibilità all'art. 53, lett. c)", "dove": "Trentino-Alto Adige (Ri.Re., Io ripar(T)o); Torino; Lazio"}, {"s": "programma-mediazione-sociale", "ti": "Mediazione sociale o di comunità", "en": "community mediation", "chi": "cittadini in conflitto; mediatori", "come": "Mediazione di conflitti tra cittadini senza reato (vicinato, quartiere); offerta da alcuni Centri e Comuni, fuori dal d.lgs. 150/2022.", "quando": "conflitti senza reato", "base": "nessuna nel d.lgs. 150/2022", "dove": "Trentino-Alto Adige; Torino"}, {"s": "programma-mediazione-scolastica", "ti": "Mediazione scolastica e pratiche riparative a scuola", "en": "school mediation; peer mediation; restorative practices in schools", "chi": "studenti; docenti; genitori; mediatori o facilitatori; mediatori tra pari", "come": "Cerchi in classe, mediazione tra pari e incontri con un mediatore esterno per i conflitti a scuola, anche al posto delle sanzioni; fuori dal d.lgs. 150/2022.", "quando": "conflitti a scuola, bullismo, sanzioni disciplinari", "base": "nessuna nel d.lgs. 150/2022", "dove": "scuole AGIA (13); Torino (Asai); Lecco; Tempio Pausania; scuole Caritas"}], "paesi": [{"n": "Belgio", "s": "paese-belgio", "area": "Europa", "gr": "Paesi con un servizio nazionale", "t": ["In Belgio la giustizia riparativa per gli adulti ha due basi nel diritto federale. La mediazione penale (art. 216ter del Codice di istruzione criminale, legge del 1994-02-10) è decisa solo dal pubblico ministero: se l'autore rispetta le condizioni accettate, l'azione penale si estingue. La mediazione riparativa, introdotta dalla legge del 2005-06-22, può essere chiesta da chiunque abbia un interesse diretto, in ogni fase del procedimento e dell'esecuzione della pena; è condotta da servizi riconosciuti dal Ministro della giustizia e resta riservata; se le parti comunicano un accordo, il giudice ne fa menzione e può tenerne conto. Il testo delle due leggi è stato letto in un commentario, non sul Moniteur belge. I servizi sono finanziati dalle Comunità. Nella parte di lingua neerlandese opera Moderator, il cui finanziamento passa dal 2026 all'Agentschap Justitie en Handhaving, con 2.363.876,70 euro l'anno. Nella parte francofona opera Médiante, riconosciuta e sovvenzionata dalla Comunità francese, con 13 sedi; il servizio è gratuito. Per i minori ogni Comunità ha un proprio codice: nelle Fiandre il decreto del 2019 obbliga la procura a proporre per iscritto la mediazione riparativa; nella Federazione Vallonia-Bruxelles vale il Codice del 2018-01-18. Le case di giustizia fiamminghe hanno aperto nel 2025 216 nuovi percorsi riparativi («hersteltrajecten»). Numeri annuali di Moderator e Médiante non sono stati trovati. Violenza di genere: nessuna esclusione per tipo di reato nella legge del 2005 secondo la Ricerca 26 (fonte non aperta)."], "anno": "1994", "chi": "misto: servizi associativi riconosciuti dal Ministro, finanziati dalle Comunità (Moderator, Médiante)", "fasi": "mediazione riparativa in ogni fase, anche in esecuzione; mediazione penale solo su iniziativa del PM", "limiti": "nessuna esclusione per reato nella legge 2005 (fonti lette)", "num": "Fiandre 2025: 216 percorsi riparativi nelle case di giustizia", "serv": "Médiante, https://mediante.be/ ; Moderator (sito non trovato)"}, {"n": "Paesi Bassi", "s": "paese-paesi-bassi", "area": "Europa", "gr": "Paesi con un servizio nazionale", "t": ["Nei Paesi Bassi la base è nel Codice di procedura penale. L'art. 51h, introdotto dalla legge del 2009-11-06 e in vigore dal 2011-01-01, chiede al pubblico ministero di fare in modo che la polizia informi presto vittima e indagato della possibilità di mediazione, e obbliga il giudice a tenere conto dell'accordo raggiunto quando decide la pena. La legge del 2017-03-08, che recepisce la direttiva 2012/29/UE, ha definito il «herstelrecht» (giustizia riparativa) nell'art. 51a e ha esteso l'art. 51h ai servizi di giustizia riparativa. La Hoge Raad (2024-10-15) ha confermato l'obbligo del giudice. Ci sono due servizi, gratuiti e volontari. Perspectief Herstelbemiddeling, finanziato dal Ministero della giustizia e della sicurezza, accompagna il contatto tra vittima e autore in ogni momento, anche anni dopo il fatto. La Mediation in Strafzaken si svolge negli uffici di mediazione dei tribunali e delle corti d'appello: il rinvio lo decidono il pubblico ministero o il giudice, l'accordo entra nel fascicolo e la decisione resta a loro. Nel 2024 la Mediation in Strafzaken ha ricevuto 1.725 rinvii, con 856 percorsi avviati; Perspectief ha ricevuto 1.651 casi, 1.459 dei quali affidati a un mediatore. Il bilancio strutturale della Mediation in Strafzaken è di 2.253.000 euro. Tutte le cifre vengono da una lettera del governo al Parlamento del 2025-07-02 (fonte unica). Il nuovo Codice di procedura penale contiene un articolo sul herstelrecht (art. 1.11.2). Violenza di genere: nessuna esclusione letta nelle pagine aperte."], "anno": "2009 (atto; in vigore 2011)", "chi": "pubblico: Perspectief (finanziato dal Ministero) e uffici di mediazione dei tribunali", "fasi": "Perspectief in ogni momento; Mediation in Strafzaken su rinvio di PM o giudice; dopo la condanna (art. 51h c. 3)", "limiti": "nessuna esclusione letta", "num": "2024: 1.725 rinvii MiS (856 avviati); 1.651 casi Perspectief", "serv": "https://perspectiefherstelbemiddeling.nl/ ; https://www.rechtspraak.nl/Onderwerpen/mediation/mediation-in-strafzaken"}, {"n": "Norvegia", "s": "paese-norvegia", "area": "Europa", "gr": "Paesi con un servizio nazionale", "t": ["In Norvegia la giustizia riparativa è affidata a un servizio pubblico nazionale, il Konfliktrådet, che fa parte della giustizia penale e dipende dal Ministero della giustizia e della sicurezza pubblica. La base è la legge sul procedimento davanti al konfliktråd (konfliktrådsloven) del 2014-06-20, n. 49, che ha sostituito la legge del 1991; secondo l'enciclopedia SNL è in vigore dal 2014-07-01. La stessa legge affida al servizio anche l'ungdomsstraff (pena per i giovani) e l'ungdomsoppfølging (percorso di accompagnamento per i giovani). Il servizio ha 12 konfliktråd con 22 sedi; a fine 2023 aveva 129 dipendenti e 430 mediatori volontari, nominati per quattro anni. Nei casi penali il pubblico ministero può trasferire il caso al konfliktråd al posto di un decreto penale, di un'imputazione o di un'archiviazione; il giudice può fare della mediazione una condizione della sospensione della pena e può infliggere l'ungdomsstraff. Servono il consenso dell'indagato e, per la mediazione, quello della vittima; i fatti devono essere sostanzialmente pacifici. Ungdomsstraff e ungdomsoppfølging riguardano chi aveva 15-18 anni al momento del fatto; la mediazione non ha limiti di età. Il servizio tratta anche liti civili. I casi sono stati 8.034 nel 2023 e 7.308 nel 2024 secondo la sintesi del rapporto annuale. Sito per i cittadini: konfliktraadet.no. Violenza nelle relazioni strette: nessuna esclusione per legge; la circolare del Riksadvokat n. 3/2025 ammette il trasferimento diretto nei casi meno gravi."], "anno": "1991", "chi": "pubblico: Konfliktrådet, servizio nazionale (12 konfliktråd, 22 sedi)", "fasi": "trasferimento dal PM; condizione della sospensione della pena; ungdomsstraff dal giudice; liti civili", "limiti": "idoneità caso per caso; consenso; fatti pacifici; alcuni reati poco adatti (circolare 3/2025)", "num": "2023: 8.034 casi; 2024: 7.308 (sintesi)", "serv": "Konfliktrådet, https://konfliktraadet.no/"}, {"n": "Finlandia", "s": "paese-finlandia", "area": "Europa", "gr": "Paesi con un servizio nazionale", "t": ["In Finlandia la mediazione nei casi penali e in alcuni casi civili (sovittelu) è regolata dalla legge 1015/2005. Il testo della legge base non è stato letto: le informazioni vengono dalla legge di modifica 966/2024 e dal rapporto statistico ufficiale sul 2023. Il servizio è pubblico e gratuito ed è organizzato per aree: nel 2023 c'erano 17 aree di servizio, ognuna con un proprio fornitore, con circa 100 professionisti e 1.516 mediatori volontari. L'Istituto per la salute e il welfare (THL) paga i fornitori e pubblica ogni anno la statistica ufficiale. Quasi tutti i casi penali arrivano dalla polizia (90,8% nel 2023) o dal pubblico ministero (8,8%). Dal 2025-01-01, con la legge 966/2024, polizia e pubblico ministero devono informare indagato e vittima della possibilità di mediazione e inviare il caso, salvo i casi esclusi dal nuovo § 3 a. Nel 2023 sono arrivati alla mediazione 14.537 casi (13.944 reati e 593 cause civili); il 39% degli indagati aveva meno di 21 anni; nel 77,2% dei processi penali conclusi si è arrivati a un accordo. Le cifre del 2024 non sono state lette. Violenza domestica: dal 2025-01-01 il § 3 a esclude dalla mediazione i reati dolosi contro la persona commessi contro una persona vicina, con eccezioni per i reati perseguibili a querela e per alcuni reati di minori contro familiari; nel 2023 questi reati erano 2.645, il 18% dei casi inviati."], "anno": "2005", "chi": "pubblico: 17 aree di servizio finanziate tramite THL", "fasi": "soprattutto polizia (90,8%) e PM (8,8%); dal 2025 obbligo di informare e inviare", "limiti": "§ 3 a dal 2025-01-01 (reati dolosi contro persone vicine, con eccezioni)", "num": "2023: 14.537 casi (13.944 reati)", "serv": "servizio di mediazione nei casi penali e civili (sito nazionale non aperto)"}, {"n": "Regno Unito · Irlanda del Nord", "s": "paese-regno-unito", "area": "Europa", "gr": "Paesi con un servizio nazionale", "t": ["In Irlanda del Nord la giustizia riparativa per i ragazzi è prevista dalla legge. Il Justice (Northern Ireland) Act 2002, sezione 57, ha inserito nel Criminal Justice (Children) (Northern Ireland) Order 1998 gli articoli 3A-3C sulle youth conferences e sui youth conference plans. Alla conferenza partecipano un coordinatore, il ragazzo, un agente di polizia e un adulto di riferimento; il piano può comprendere scuse, riparazione, risarcimento, lavoro non retribuito e trattamenti, per non più di un anno. Le conferenze sono gestite dalla Youth Justice Agency, agenzia del Department of Justice, per ragazzi da 10 a 17 anni; sono \"diversionary\" (inviate dal Public Prosecution Service prima del giudizio) o \"court-ordered\" (disposte dal giudice). Nel 2024/25 gli invii sono stati 750 diversionary e 338 court-ordered; il 73,0% delle vittime ha preso parte al processo di conferenza (72,7% nella stessa fonte, su un'altra base). Per gli adulti non c'è una legge specifica. Il Department of Justice ha pubblicato nel marzo 2022 la prima Adult Restorative Justice Strategy (2022-2027) e nel luglio 2023 un nuovo Restorative Justice Protocol, con un percorso di accreditamento dei programmi comunitari. Il registro pubblico dei programmi accreditati comprende le sedi di Northern Ireland Alternatives e di Community Restorative Justice Ireland. Nel 2023/24 la polizia ha avviato a Belfast un progetto pilota di Community Resolution Notice e il programma Sycamore Tree si è svolto in tre istituti penitenziari. Violenza domestica: regola non trovata nelle pagine lette."], "anno": "2002", "chi": "minori: Youth Justice Agency (pubblico); adulti: misto, programmi comunitari accreditati", "fasi": "conferenze diversionary (PPS) e court-ordered (giudice); adulti secondo la strategia 2022-2027", "limiti": "10-17 anni per le youth conferences; violenza domestica: regola non trovata", "num": "2024/25: 750 diversionary, 338 court-ordered; 73,0% vittime partecipanti", "serv": "https://www.justice-ni.gov.uk/publications/publication-key-restorative-justice-documents"}, {"n": "Germania", "s": "paese-germania", "area": "Europa", "gr": "Paesi con modelli nei codici", "t": ["In Germania la giustizia riparativa nel processo penale prende soprattutto la forma del Täter-Opfer-Ausgleich (TOA, composizione tra autore e vittima). Non c'è una legge dedicata: il TOA è previsto da più norme dei codici federali. Il § 155a StPO obbliga pubblico ministero e giudice a verificare in ogni fase del procedimento se una composizione è possibile; l'idoneità non si può riconoscere contro la volontà espressa della persona offesa. Il § 153a StPO consente l'archiviazione con l'impegno a cercare la composizione, per i delitti meno gravi e con il consenso del giudice e dell'imputato. Il § 46a StGB consente di diminuire la pena o, sotto un anno di reclusione o 360 tassi giornalieri, di rinunciarvi. Per i minori il TOA è una direttiva del giudice (§ 10 JGG) e permette la rinuncia all'azione penale (§ 45 JGG). I servizi sono organizzati nei Länder: nella statistica nazionale TOA, 57-59 strutture su 69-71 sono enti liberi, che trattano quasi il 90% dei casi. Il TOA-Servicebüro del DBH, finanziato dal Ministero federale della giustizia, cura formazione, standard e una ricerca delle sedi per i cittadini. La statistica nazionale TOA ha registrato 6.196 casi nel 2022; la partecipazione è volontaria e, secondo gli autori, copre circa il 15% delle strutture e oltre il 60% dei casi. Secondo un articolo del 2021, le procure hanno archiviato in media 12.207 procedimenti l'anno con il § 153a n. 5 tra il 2004 e il 2019. Violenza domestica: nessuna esclusione per legge; vale la regola della volontà della persona offesa."], "anno": "1990", "chi": "misto: strutture dei Länder, per lo più enti liberi; TOA-Servicebüro federale", "fasi": "ogni fase (§ 155a StPO); archiviazione (§ 153a); sentenza (§ 46a StGB); minori (§§ 10, 45 JGG)", "limiti": "non contro la volontà espressa della persona offesa; § 153a solo delitti meno gravi", "num": "2022: 6.196 casi nella statistica TOA (adesione volontaria)", "serv": "TOA-Servicebüro, https://www.toa-servicebuero.de/fachstellen"}, {"n": "Austria", "s": "paese-austria", "area": "Europa", "gr": "Paesi con modelli nei codici", "t": ["In Austria la giustizia riparativa penale si chiama Tatausgleich ed è una forma di diversione del codice di procedura penale (§ 204 StPO, con le condizioni generali del § 198). I testi sono stati letti su un sito non ufficiale, perché la banca dati RIS non si è aperta. Il pubblico ministero può rinunciare all'azione penale se l'imputato è pronto ad assumersi la responsabilità e a riparare le conseguenze del fatto; la composizione richiede il consenso della vittima; il pubblico ministero può incaricare un mediatore (Konfliktregler), che riferisce sugli accordi e ne controlla l'esecuzione. Anche il giudice può applicare la diversione dopo l'esercizio dell'azione penale. La diversione è esclusa per i reati puniti con più di cinque anni di reclusione, con colpa grave o che hanno causato la morte di una persona, salvo la morte colposa di un congiunto. Per i minori vale il Jugendgerichtsgesetz (JGG 1988), i cui articoli vigenti non sono stati letti. Il servizio è svolto in tutto il Paese dall'associazione NEUSTART, che si occupa anche di probation. Secondo il rapporto del Ministero della giustizia, nel 2023 il Tatausgleich ha chiuso 3.358 procedimenti nelle procure e 1.208 nei tribunali; un altro capitolo dello stesso rapporto dà un totale di 3.928. NEUSTART indica 11.632 persone coinvolte nel Tatausgleich nel 2025, tra imputati e vittime, e circa 225.000 composizioni dal 1985. Sito per i cittadini: neustart.at. Violenza nelle relazioni: non esclusa per legge; NEUSTART indica le relazioni di coppia tra i casi adatti."], "anno": "1988", "chi": "servizio nazionale svolto dall'associazione NEUSTART", "fasi": "indagini (PM, § 204 StPO); giudizio (giudice)", "limiti": "pena massima fino a 5 anni; no colpa grave; no morte salvo congiunto; consenso della vittima", "num": "2023: 3.358 (procure) e 1.208 (tribunali); NEUSTART 2025: 11.632 persone", "serv": "NEUSTART, https://www.neustart.at/was-wir-tun/tatausgleich/"}, {"n": "Francia", "s": "paese-francia", "area": "Europa", "gr": "Paesi con modelli nei codici", "t": ["In Francia la giustizia riparativa è prevista dal codice di procedura penale. L'art. 10-1, introdotto dalla loi n° 2014-896 du 15 août 2014 e in vigore dal 2014-10-01, stabilisce che in ogni procedura e in ogni fase, compresa l'esecuzione della pena, vittima e autore possono vedersi proporre una misura di giustizia riparativa, se i fatti sono stati riconosciuti; servono informazione completa e consenso espresso, e la misura è condotta da un terzo indipendente formato. L'art. 10-2 inserisce la misura riparativa tra i modi di riparazione a cui la vittima ha diritto. Dal 2026-07-25 il nuovo art. 10-1-1, creato dalla loi n° 2026-651 du 23 juillet 2026, obbliga il procuratore, il giudice istruttore, il giudice del dibattimento e il giudice dell'applicazione delle pene a informare vittima e autore di questo diritto. Gli artt. 10-1 e 10-2 saranno abrogati dal 2029-01-01 dall'ordonnance n° 2025-1091, che riscrive il codice. Non c'è un servizio nazionale unico: il sito justice.fr indica come punti di accesso gli uffici di aiuto alle vittime dei tribunali, le associazioni di aiuto alle vittime e il numero 116 006; descrive misure dirette e indirette, gratuite, possibili per ogni tipo di reato, prima, durante o dopo il processo e anche senza azione penale. Per i minori la misura è prevista dal Code de la justice pénale des mineurs; ad aprile 2023 il Ministero riferiva 84 misure avviate nella protezione giudiziaria dei minori. Violenza di genere: la médiation pénale è vietata per le violenze nella coppia; la giustizia riparativa dell'art. 10-1 non ha esclusioni per tipo di reato (Ricerca 26)."], "anno": "1993 (médiation pénale, non letta); 2014", "chi": "misto: associazioni di aiuto alle vittime, uffici dei tribunali, protezione giudiziaria dei minori", "fasi": "ogni fase, anche esecuzione e senza azione penale; dal 2026 obbligo di informazione dei magistrati", "limiti": "riconoscimento dei fatti; nessun reato escluso (art. 10-1)", "num": "minori: 84 misure avviate (aprile 2023); adulti: nessun dato nazionale", "serv": "https://www.justice.fr/themes/justice-restaurative ; 116 006"}, {"n": "Spagna", "s": "paese-spagna", "area": "Europa", "gr": "Paesi con modelli nei codici", "t": ["In Spagna la base nazionale è la Ley 4/2015, de 27 de abril, del Estatuto de la víctima del delito, in vigore dal 2015-10-28. L'art. 15 dà alle vittime l'accesso ai servizi di giustizia riparativa a cinque condizioni: l'autore riconosce i fatti essenziali; la vittima dà un consenso informato; l'autore dà il proprio consenso; il procedimento non comporta rischi per la sicurezza della vittima; la legge non vieta la mediazione per quel reato. L'art. 5 prevede che la vittima sia informata dei servizi disponibili e l'art. 29 affida un ruolo di supporto agli uffici di assistenza alle vittime. Per i minori la LO 5/2000 regola conciliazione e riparazione; nel codice penale la riparazione del danno è un'attenuante e la sospensione della pena può dipendere dall'accordo di mediazione (testi non letti). I servizi sono organizzati dalle comunità autonome con competenza in materia di giustizia, come Catalogna, País Vasco e Navarra, e dal Consiglio generale del potere giudiziario con convenzioni per la mediazione nei tribunali. Secondo un dossier del 2020, le mediazioni penali per adulti in Catalogna sono state 3.208 nel 2018, e in tutta la Spagna 3.804 nel 2015 (dati del Consiglio generale del potere giudiziario citati dal dossier). Dati ufficiali più recenti non sono stati trovati. La LO 1/2025 esclude il processo penale dai mezzi alternativi di soluzione delle controversie, ma richiama il diritto delle vittime ai servizi riparativi. Violenza di genere: mediazione e conciliazione sono vietate nei casi di violenza sessuale e di genere (art. 3.1 Ley 4/2015)."], "anno": "1992 (secondo [60], da verificare); 2015 per tutte le vittime", "chi": "misto e decentrato: comunità autonome e convenzioni del CGPJ", "fasi": "non limitate dalla legge; rinvii dei giudici (Catalogna)", "limiti": "cinque condizioni (art. 15); divieto per violenza sessuale e di genere (art. 3.1)", "num": "Catalogna 2018: 3.208 mediazioni penali adulti; Spagna 2015: 3.804", "serv": "nessun sito nazionale aperto"}, {"n": "Portogallo", "s": "paese-portogallo", "area": "Europa", "gr": "Paesi con modelli nei codici", "t": ["In Portogallo la mediazione penale per adulti è regolata dalla Lei n.º 21/2007, de 12 de junho, che secondo la banca dati della Procura generale distrettuale di Lisbona non ha avuto modifiche; il testo non è stato letto sul Diário da República. La mediazione riguarda i reati perseguibili a querela o ad accusa privata ed è esclusa, tra l'altro, per i reati puniti con più di 5 anni, per i reati sessuali, per peculato, corruzione e traffico di influenze, quando la vittima ha meno di 16 anni e nei riti sommari. Il pubblico ministero può inviare il caso al mediatore durante l'inchiesta; l'accordo firmato vale come rinuncia alla querela; senza accordo entro tre mesi, prorogabili di due, il processo prosegue. I mediatori sono iscritti in liste del Ministero della giustizia. Il sistema è partito in via sperimentale nel 2008 in 4 circoscrizioni, estese nel 2009. Secondo uno studio del 2021, basato su dati del Ministero, i casi sono stati 803 tra il 2008 e il 2018, in calo dal 2011, e dal 2017 non è stato inviato nessun caso; l'autore parla di «estado letárgico desde 2017». Per i minori la Lei Tutelar Educativa del 1999 prevede la mediazione (testo non letto). Dati dopo il 2018 non sono stati trovati. Violenza domestica: è un reato pubblico, fuori dall'ambito della Lei 21/2007; l'incontro riparativo previsto dalla legge sulla violenza domestica è stato abrogato nel 2015 (Ricerca 26)."], "anno": "1999 (Lei Tutelar Educativa, non letta); 2007", "chi": "pubblico: Ministero della giustizia, liste di mediatori", "fasi": "solo nell'inchiesta, su invio del PM", "limiti": "reati a querela; esclusi reati con pena oltre 5 anni, sessuali, corruzione, vittima sotto 16 anni", "num": "803 casi 2008-2018; nessun caso inviato dal 2017", "serv": "sito del servizio non aperto"}, {"n": "Regno Unito · Inghilterra e Galles", "s": "paese-regno-unito", "area": "Europa", "gr": "Regno Unito e Irlanda", "t": ["In Inghilterra e Galles non c'è una legge unica sulla giustizia riparativa. Il Code of Practice for Victims of Crime (Victims' Code) del 2020 dà alla vittima il diritto di ricevere informazioni sulla giustizia riparativa quando denuncia il reato (Right 3); le informazioni le dà la polizia se l'autore è adulto e lo Youth Offending Team se è minorenne. Il Victims and Prisoners Act 2024 rende il codice uno strumento previsto dalla legge e ne fissa i principi, senza nominare la giustizia riparativa. Il Ministry of Justice ha messo in consultazione una bozza di nuovo codice il 2026-02-05. Il Sentencing Act 2020 consente al giudice di rinviare la pena con l'obbligo di partecipare a un'attività riparativa, con il consenso di tutti i partecipanti; dal 2026-03-22 il Sentencing Act 2026 porta il rinvio da 6 a 12 mesi. Queste norme hanno preso il posto della Schedule 16 del Crime and Courts Act 2013, abrogata dal 2020-12-01. I servizi sono finanziati soprattutto a livello locale dai Police and Crime Commissioners: per esempio il servizio delle polizie di Norfolk e Suffolk ha ricevuto 289 invii in Suffolk nel 2025/26. Il Restorative Justice Council è un ente di beneficenza nazionale che tiene registri di professionisti e di servizi; dal 2020 lo status di Registered Service Provider ha sostituito il Restorative Service Quality Mark. Una statistica nazionale dei casi non è stata trovata. Violenza domestica: nessun divieto di legge; la guida della procura indica la giustizia riparativa come «rarely appropriate» (Ricerca 26)."], "anno": "1998 (Ricerca 03)", "chi": "misto e locale: servizi commissionati dai PCC, Youth Justice Services, probation, terzo settore; standard RJC", "fasi": "dalla denuncia (informazione); rinvio della pena; probation e carcere", "limiti": "volontarietà, riconoscimento dei fatti, valutazione di sicurezza; nessun reato escluso per legge", "num": "nessuna serie nazionale; Suffolk 2025/26: 289 invii", "serv": "https://www.gov.uk/government/publications/the-code-of-practice-for-victims-of-crime ; https://restorativejustice.org.uk"}, {"n": "Regno Unito · Scozia", "s": "paese-regno-unito", "area": "Europa", "gr": "Regno Unito e Irlanda", "t": ["In Scozia la giustizia riparativa è organizzata come politica pubblica, senza una legge dedicata nelle fonti lette. Le basi sono una guida del governo del 2017 e un Restorative Justice Action Plan del 2019, non aperti in questa ricerca. Il lavoro è condotto da Community Justice Scotland, dal Children and Young People's Centre for Justice e dal governo scozzese. Nel 2025-26 si è concluso un progetto di prova (test case project) cofinanziato dal governo; il rapporto annuale riferisce, in parafrasi, un'offerta «limited and inconsistent» e pochi casi arrivati a un incontro, senza cifre. Nel marzo 2026 è stato pubblicato un Restorative Justice Policy and Practice Framework con principi e standard minimi. Il rapporto annuale 2025/26 non dà numeri di invii o di incontri. Violenza di genere: secondo la guida del 2017 la giustizia riparativa è «very rarely appropriate» per abuso domestico e reati sessuali; secondo il quadro del 2026 in questi casi i rinvii sono accettati solo se li chiede la persona offesa (Ricerca 26)."], "anno": "2017 (guida; da Ricerca 26)", "chi": "Community Justice Scotland, CYCJ, governo scozzese", "fasi": "non lette", "limiti": "in violenza di genere rinvii solo su richiesta della persona offesa (Ricerca 26)", "num": "nessun numero nel rapporto 2025/26", "serv": "https://communityjustice.scot"}, {"n": "Irlanda", "s": "paese-irlanda", "area": "Europa", "gr": "Regno Unito e Irlanda", "t": ["In Irlanda la giustizia riparativa ha una base nel Criminal Justice (Victims of Crime) Act 2017. La s. 7 prevede che la vittima riceva informazioni sui servizi di giustizia riparativa dove esistono. La s. 26 fissa le condizioni di ogni programma: l'autore riconosce i fatti essenziali; vittima e autore danno un consenso libero e informato; gli accordi possono essere considerati dal giudice solo con il consenso di entrambi; chi gestisce il programma tutela la vittima dalla vittimizzazione secondaria e ripetuta. Il testo è stato letto su una banca dati della Law Reform Commission, non sull'Irish Statute Book. Per i minori il Children Act 2001 prevede le cautele riparative del programma di diversione della polizia (Garda) e le conferenze ordinate dal tribunale e gestite dal Probation Service. Il Probation Service ha un'unità per la giustizia riparativa e le vittime, istituita nel settembre 2018, e nel 2024 ha finanziato con 787.770 euro cinque organizzazioni comunitarie, tra cui Restorative Justice Services (Dublino e contee vicine) e Restorative Justice in the Community (Tipperary e Midlands). Nell'agosto 2023 il Department of Justice ha scelto, in un policy paper, di rafforzare i servizi esistenti invece di creare un nuovo ente. Secondo la raccolta dati del sito restorativejustice.ie, nel 2025 gli invii sono stati 1.030 (842 nel 2024), con almeno 185 casi di dialogo con la vittima, più 369 cautele riparative della Garda; è una raccolta di settore, non una statistica ufficiale. Violenza di genere: nessuna regola specifica trovata nelle fonti lette."], "anno": "2001 (Children Act, testo non letto)", "chi": "misto: Probation Service e 5 organizzazioni comunitarie; Garda per i minori", "fasi": "prima dell'accusa e prima della condanna (s. 26); relazioni pre-sanzione; cautele della Garda", "limiti": "condizioni della s. 26; nessun reato escluso", "num": "2025: 1.030 invii, almeno 185 dialoghi, 369 cautele Garda (raccolta di settore)", "serv": "https://restorativejustice.ie ; https://www.probation.ie"}, {"n": "Canada", "s": "paese-canada", "area": "Fuori dall'Europa", "gr": "Commonwealth", "t": ["In Canada il diritto penale è federale, mentre i servizi di giustizia riparativa sono organizzati soprattutto da province e territori, con programmi di comunità finanziati, e in parte da enti federali. Dal 2026-07-18 il codice penale contiene la Parte XXII.2 \"Alternative Measures and Restorative Justice Processes\" (artt. 715.44-715.6), aggiunta dal Protecting Victims Act (S.C. 2026, c. 19), che ha abrogato i vecchi artt. 717-717.4 sulle misure alternative. La data è quella dell'ultima modifica nella versione consolidata; nessun testo letto la dichiara come entrata in vigore. La Parte XXII.2 consente un processo riparativo «at any stage» del procedimento, anche come misura alternativa al processo, in forme come mediazione, conferenza riparativa e sentencing circle. Polizia e pubblico ministero devono considerare avvertimenti e invii a programmi; la misura alternativa richiede tra l'altro consenso libero e accettazione di responsabilità, e il testo letto non esclude tipi di reato. Per i minorenni (12-17 anni) lo Youth Criminal Justice Act del 2002 prevede misure extragiudiziali (artt. 4-12) e conferenze (art. 19). Il Canadian Victims Bill of Rights del 2015 dà alle vittime il diritto di essere informate sui processi riparativi disponibili (art. 7.2). In carcere il Correctional Service Canada gestisce Restorative Opportunities: 140 richieste e 45 dialoghi nell'anno 2023-24. L'Indigenous Justice Program finanzia 211 programmi in oltre 650 comunità. Nel 2017-18 i programmi finanziati dai governi hanno ricevuto 22.576 invii. In Nova Scotia vale dal 2000 una moratoria per violenza nelle relazioni intime e violenza sessuale."], "anno": "1995 (Bill C-41, norma-1995-canada-bill-c-41-riforma-pene)", "chi": "province e territori con programmi di comunità; Correctional Service Canada (carcere); Indigenous Justice Program", "fasi": "polizia, pubblico ministero, giudizio, pena (art. 720(2)), esecuzione; «at any stage» (art. 715.54)", "limiti": "consenso, accettazione di responsabilità, prove sufficienti (art. 715.49); nessuna esclusione per reato nel testo federale; Nova Scotia: moratoria dal 2000 per violenza intima e sessuale", "num": "22.576 invii (2017-18); CSC 140 richieste e 45 dialoghi (2023-24); IJP 6.904 clienti (2019-20)", "serv": "Department of Justice, https://www.justice.gc.ca/eng/cj-jp/rj-jr/"}, {"n": "Nuova Zelanda", "s": "paese-nuova-zelanda", "area": "Fuori dall'Europa", "gr": "Commonwealth", "t": ["In Nuova Zelanda la giustizia riparativa per gli adulti si fonda sul Sentencing Act 2002 e sul Victims' Rights Act 2002. Dal 2014-12-06 la sezione 24A del Sentencing Act, inserita dal Sentencing Amendment Act 2014, obbliga il District Court a rinviare il procedimento quando l'imputato si è dichiarato colpevole, c'è almeno una vittima, non si è già svolto un processo riparativo e il cancelliere segnala che un processo è disponibile; il rinvio serve a verificare se il processo è adatto, tenendo conto dei desideri delle vittime. Al momento della condanna il giudice deve tener conto degli esiti dei processi riparativi (s. 8(j)) e delle offerte o degli accordi di riparazione (s. 10). Se la vittima chiede di incontrare l'autore, tribunale, polizia o probation devono inoltrare la richiesta a un facilitatore, se ci sono le risorse (s. 9 del Victims' Rights Act). I servizi sono erogati da organizzazioni di comunità finanziate dal Ministry of Justice: la lista del Ministero, aggiornata al 2025-10-06, conta 22 fornitori, 21 dei quali accettano casi di violenza familiare; Project Restore NZ è l'unico per la violenza sessuale. I facilitatori devono essere accreditati; il Ministero ha un Practice Framework (2019) e standard per violenza familiare e reati sessuali. Per i minori opera la family group conference dell'Oranga Tamariki Act 1989: nell'anno 2024/25 le Youth Justice FGC sono state 4.186, per 2.028 giovani. Nel 2024/25 lo stanziamento per la giustizia riparativa era di 10,624 milioni di dollari neozelandesi. Il numero annuo delle conferenze per adulti non è stato trovato."], "anno": "1989 (family group conference minorile)", "chi": "Ministry of Justice finanzia 22 fornitori di comunità (2025-10-06); Oranga Tamariki per i minori", "fasi": "adulti: prima della condanna, su invio del tribunale o della polizia; rinvio obbligatorio s. 24A dopo dichiarazione di colpevolezza; su richiesta della vittima (s. 9 VRA); minori: prima dell'accusa e su ordine del tribunale", "limiti": "s. 24A: District Court, almeno una vittima, nessun processo precedente; violenza familiare ammessa con standard (2019); violenza sessuale solo con Project Restore NZ", "num": "4.186 Youth Justice FGC (2024/25); 10,624 mln NZD (2024/25); 82% vittime soddisfatte (indagine 2025)", "serv": "Ministry of Justice, https://www.justice.govt.nz/courts/criminal/charged-with-a-crime/restorative-justice/ (non raggiungibile il 2026-11-12)"}, {"n": "Australia", "s": "paese-australia", "area": "Fuori dall'Europa", "gr": "Commonwealth", "t": ["Nelle fonti lette la giustizia riparativa in Australia è regolata da Stati e Territori; nessuna pagina aperta cita una legge del Commonwealth in materia, e l'appendice dell'Australian Institute of Health and Welfare sui sistemi di giustizia minorile elenca solo leggi statali. Nel Territorio della Capitale Australiana (ACT) è in vigore il Crimes (Restorative Justice) Act 2004 (A2004-65), notificato il 2004-09-06, con la parte principale in vigore dal 2005-01-31. Lo schema è gestito dalla Restorative Justice Unit del Justice and Community Safety Directorate. Secondo la valutazione dell'Australian Institute of Criminology, la fase 1 (dal 2005) riguardava autori di 10-17 anni per reati meno gravi, la fase 2 (dal 2016) ha esteso l'accesso agli adulti e ai reati gravi dei minori, la fase 3 (da novembre 2018) alla violenza domestica, familiare e sessuale; il governo dell'ACT data l'avvio della fase 3 al 2018-11-01. Tra novembre 2018 e agosto 2022 i casi inviati in fase 3 sono stati 162 e le conferenze 24. Nel Nuovo Galles del Sud il Young Offenders Act 1997 regola lo Youth Justice Conferencing per i minori: nel 2024-25 le conferenze facilitate sono state 1.147 su 1.554 invii trattati. Per gli adulti, Corrective Services NSW offre un servizio riparativo solo dopo la condanna, che esclude i casi di violenza domestica e riceve circa 60 richieste l'anno. In Queensland lo Youth Justice Act 1992 prevede conferenze riparative su invio della polizia o del tribunale; i numeri del Queensland non sono stati letti."], "anno": "1997 (NSW); prime esperienze dal 1991 (esperienza-1991-wagga-wagga)", "chi": "Stati e Territori: Restorative Justice Unit (ACT), Youth Justice NSW, Corrective Services NSW, Department of Youth Justice (Qld)", "fasi": "ACT: più fasi, minori dal 2005, adulti dal 2016; NSW: minori in alternativa al processo, adulti solo dopo la condanna; Qld: polizia o tribunale", "limiti": "ACT: violenza familiare e sessuale ammessa dalla fase 3 (2018-11-01); Corrective Services NSW: violenza domestica esclusa", "num": "NSW 1.147 conferenze (2024-25); ACT fase 3: 162 casi e 24 conferenze (2018-11/2022-08); CSNSW circa 60 richieste l'anno", "serv": "NSW Youth Justice Conference, https://www.nsw.gov.au/legal-and-justice/youth-justice/conferencing/what-is-youth-justice-conference (solo risultato di ricerca)"}, {"n": "Stati Uniti", "s": "paese-stati-uniti", "area": "Fuori dall'Europa", "gr": "Americhe, Africa e altri", "t": ["Negli Stati Uniti la giustizia riparativa è regolata soprattutto dalle leggi dei singoli Stati. Le pagine aperte non citano una legge federale generale, ma nessuna lo afferma in modo esplicito. Una ricognizione del 2020, citata da González, Browne e Tomlinson, conta più di 264 leggi in materia penale in 46 giurisdizioni; lo stesso studio conta 14 leggi in 9 Stati, tra il 2020 e l'agosto 2025, sulla riservatezza e sull'inutilizzabilità delle dichiarazioni rese nei programmi. A livello federale il Bureau of Justice Assistance del Department of Justice ha avviato alla fine del 2019 il National Center on Restorative Justice, con la Vermont Law School come primo partner, per formazione e ricerca. Nel Vermont la legge prevede i reparative boards, comitati di cittadini nominati dal Commissioner of Corrections che incontrano autore, vittima e comunità (28 V.S.A. § 910a, in vigore dal 2000-05-24), e una rete di Community Justice Centers (24 V.S.A. capitolo 58); nel 2022 i centri erano 17, con contributi del Department of Corrections in media di circa 2,98 milioni di dollari l'anno dal 2010. Nel Colorado un Restorative Justice Coordinating Council ha sede presso l'ufficio dello State Court Administrator (C.R.S. 13-3-116, testo letto su un sito non ufficiale); i programmi pilota di diversione per minori hanno coinvolto più di 1.200 ragazzi tra il 2014 e il 2020 secondo The Sentencing Project. Nel Minnesota una legge del 2023 ha creato un Office of Restorative Practices. Le fonti lette non danno un numero nazionale di casi e non riportano una regola sulla violenza domestica."], "anno": "da verificare", "chi": "Stati, contee ed enti non profit finanziati; National Center on Restorative Justice (finanziato dal BJA, 2019)", "fasi": "variano per Stato: diversione prima del giudizio (adulti e minori), probation ed esecuzione (Vermont)", "limiti": "variano per Stato; regola sulla violenza domestica non trovata", "num": "più di 264 leggi in 46 giurisdizioni (ricognizione 2020); 14 leggi sulla riservatezza in 9 Stati (2020-2025); Colorado più di 1.200 giovani (2014-2020)", "serv": "National Center on Restorative Justice, https://ncorj.org/ (solo risultato di ricerca)"}, {"n": "Sudafrica", "s": "paese-sudafrica", "area": "Fuori dall'Europa", "gr": "Americhe, Africa e altri", "t": ["In Sudafrica la giustizia riparativa ha una base di legge per i minorenni: il Child Justice Act 75 of 2008 (testo letto su lawlibrary.org.za, da riscontrare su fonte ufficiale). La legge definisce la giustizia riparativa come un approccio che coinvolge il minore, la vittima, le famiglie e la comunità (in parafrasi). Il capo 8 regola la diversione (ss. 51-62); tra le opzioni ci sono la family group conference (s. 61) e la victim-offender mediation (s. 62), con il consenso del minore e della vittima e con un probation officer o un fornitore accreditato. Per i reati della Schedule 3, la diversione richiede una decisione scritta del Director of Public Prosecutions in «exceptional circumstances». Nell'anno 2025/26 le udienze preliminari registrate sono state 12.530 e 3.789 si sono concluse con una diversione, secondo il rapporto annuale interdipartimentale; il rapporto non conta separatamente conferenze e mediazioni. Per gli adulti non è stata trovata una legge generale: il Department of Justice descrive la giustizia riparativa come possibile in ogni fase, dalla fase precedente l'imputazione alla liberazione condizionale. Il Department of Correctional Services gestisce un programma di giustizia riparativa: nell'anno 2024/25 hanno partecipato 4.814 detenuti, persone in liberazione condizionale e in probation, e 14.349 vittime; 2.682 vittime hanno partecipato alle procedure di liberazione condizionale. Secondo lo stesso rapporto, le commissioni per la liberazione condizionale considerano l'esito dei processi riparativi. Una regola sulla violenza domestica non è stata trovata. La giustizia di transizione (Truth and Reconciliation Commission, 1995-1998) è trattata dalla Ricerca 03."], "anno": "2008 (Child Justice Act)", "chi": "probation officers (Social Development) e fornitori accreditati; National Prosecuting Authority; Department of Correctional Services", "fasi": "minori: udienza preliminare, giudizio, sentenza; adulti (politica del Department of Justice): ogni fase, fino alla liberazione condizionale", "limiti": "reati Schedule 3: diversione solo con decisione scritta del Director of Public Prosecutions; regola sulla violenza domestica non trovata", "num": "3.789 diversioni su 12.530 udienze preliminari (2025/26); DCS 4.814 autori e 14.349 vittime (2024/25)", "serv": "Department of Justice, https://justice.gov.za/rj/rj.html"}], "altri": [{"n": "Brasile", "t": "la Resolução n. 225 del Conselho Nacional de Justiça, del 2016-05-31, istituisce una politica nazionale di giustizia riparativa nel potere giudiziario e consente l'invio «em qualquer fase» del procedimento; è stata modificata dalle Resoluções 300/2019 e 458/2022. Testo letto su una copia del Tribunal de Justiça do Ceará, da riscontrare su atos.cnj.jus.br."}, {"n": "Colombia", "t": "la Ley 1098 de 2006 (Código de la Infancia y la Adolescencia) chiede che il processo per adolescenti garantisca «la justicia restaurativa, la verdad y la reparación del daño» (art. 140) e dà alle sanzioni finalità anche «restaurativa» (art. 178); per gli adulti l'ICBF cita la Ley 906 de 2004, art. 521. Testo letto sulla pagina dell'ICBF, da riscontrare su secretariasenado.gov.co. Ley 975 de 2005 (Justicia y Paz) e JEP: non aperte."}, {"n": "Giappone", "t": "il Ministero della Giustizia descrive un sistema per ascoltare e trasmettere ai condannati i sentimenti delle vittime durante l'esecuzione della pena, introdotto dalla legge di modifica del codice penale del giugno 2022 e operativo entro dicembre 2023. Numero della legge e data di avvio non indicati nella pagina."}], "giur": [{"s": "sentenza-1995-corte-cost-125", "au": "Corte costituzionale", "n": "125", "d": "1995-04-05", "dep": "1995-04-14", "tema": "messa alla prova minorile; Corte costituzionale", "punto": "La sospensione del processo con messa alla prova del minore non può essere esclusa perché l'imputato chiede il giudizio abbreviato o immediato", "letto": "sito della Corte costituzionale (testo integrale)"}, {"s": "sentenza-2023-corte-cost-151", "au": "Corte costituzionale", "n": "151", "d": "2023-06-07", "dep": "2023-07-18", "tema": "entrata in vigore del d.lgs. 150/2022; procedibilità a querela", "punto": "Non fondate le questioni sul rinvio dell'entrata in vigore del d.lgs. 150/2022 disposto per decreto-legge", "letto": "sito della Corte costituzionale (testo integrale)"}, {"s": "sentenza-2023-trib-lecce-sorveglianza-2023-11-30-impugnabilita", "au": "Tribunale di sorveglianza di Lecce", "n": "4710", "d": "2023-11-30", "dep": "non trovata", "tema": "esecuzione; impugnabilità", "punto": "Favorevole all'impugnabilità del dini iunta UCPI, l'art. 129-bis è il punto di maggior criticità dello schema: conforme alla delega sarebbe stata l'iniziativa riservata al solo imputato, mentre la proposta di giudice e PM, talvolta un ordine, incide sulla genuinità del consenso.", "k": ["invio"], "f": "UCPI, La Giunta, nota sui decreti delegati, Roma, 2022-09-08 (copia su terzultimafermata.blog)", "u": "https://terzultimafermata.blog/wp-content/uploads/2022/09/nota-ucpi-su-decreti-delegati-riforma-cartabia.pdf"}, {"s": "posizione-2024-01-23-aiga-accesso", "d": "2024-01-23", "o": "favorevole", "chi": "Associazione italiana giovani avvocati", "can": "audizione", "x": "Secondo l'AIGA, la giustizia riparativa è una forma di risoluzione del conflitto complementare al processo; le modifiche dell'A.G. 102 agli artt. 129-bis, 408 e 456 c.p.p. la rendono accessibile e informano subito le parti.", "k": ["principi", "invio"], "f": "AIGA, Osservazioni sullo schema di decreto legislativo A.G. 102, memoria depositata il 2024-01-23 (Camera, COM02)", "u": "https://documenti.camera.it/leg19/documentiAcquisiti/COM02/Audizioni/leg19.com02.Audizioni.Memoria.PUBBLICO.ideGes.27760.23-01-2024-10-50-09.392.pdf"}, {"s": "posizione-2024-01-18-cnf-mediatori", "d": "2024-01-18", "o": "neutra", "chi": "Consiglio nazionale forense", "can": "comunicato", "x": "Secondo il CNF, come riferisce Edotto, il d.m. del gennaio 2024 accoglie le proposte degli avvocati: elimina l'incompatibilità tra mediatore civile e familiare e mediatore penale e la limita, per gli avvocati, al circondario del tribunale.", "k": ["risorse"], "f": "Edotto, «Giustizia riparativa: esteso l'elenco dei mediatori esperti. Avvocati soddisfatti», 2024-01-18", "u": "https://edotto.com/articolo/giustizia-riparativa-esteso-lelenco-dei-mediatori-esperti"}, {"s": "posizione-2023-11-24-luca-bisori-ruolo-difensore", "d": "2023-11-24", "o": "favorevole con riserve", "chi": "Luca Bisori", "can": "articolo", "x": "Secondo Luca Bisori, tenere il difensore fuori dai programmi esprime uno scetticismo che egli non condivide; la riservatezza dell'art. 50 è solo documentale; l'invio d'ufficio ex art. 129-bis può pesare sull'imputato che intende far valere la propria innocenza.", "k": ["invio", "percorso"], "f": "L. Bisori, «La giustizia riparativa dalla prospettiva dell'avvocato», Sistema Penale, 2023-11-24", "u": "https://sistemapenale.it/pdf_contenuti/1700668128_006-luca-bisori-form.pdf"}, {"s": "posizione-2025-05-06-antonella-calcaterra-ruolo-avvocato", "d": "2025-05-06", "o": "favorevole", "chi": "Antonella Calcaterra", "can": "convegno", "x": "Secondo Antonella Calcaterra, il ruolo dell'avvocato non si limita più al processo: il difensore deve informare gli assistiti sulla giustizia riparativa e valutarne l'adeguatezza nel caso concreto.", "k": ["percorso"], "f": "A. Calcaterra, «Il nuovo ruolo dell'avvocato tra giustizia riparativa e trattamenti sanzionatori alternativi alla pena ed al processo», Sistema Penale, 2025-05-06", "u": "https://sistemapenale.it/it/scheda/calcaterra-il-nuovo-ruolo-dellavvocato-tra-giustizia-riparativa-e-trattamenti-sanzionatori-alternativi-alla-pena-ed-al-processo"}, {"s": "posizione-2023-01-26-luigi-salvato-reati-gravi", "d": "2023-01-26", "o": "favorevole con riserve", "chi": "Luigi Salvato", "can": "documento", "x": "Secondo Luigi Salvato, la giustizia riparativa del d.lgs. 150/2022 richiede un bilanciamento tra redenzione del reo, soddisfazione delle vittime e diritto alla verità; la disciplina dovrebbe evitare di scardinare gli strumenti di contrasto alle organizzazioni mafiose.", "k": ["principi", "reati-gravi"], "f": "L. Salvato, Intervento del Procuratore generale, Assemblea generale della Corte di cassazione, 2023-01-26", "u": "https://www.cortedicassazione.it/resources/cms/documents/Intervento_del_Procuratore_generale_2023_1.pdf"}, {"s": "posizione-2023-marcello-bortolato-carcere", "d": "2023", "o": "favorevole", "chi": "Marcello Bortolato", "can": "articolo", "x": "Secondo Marcello Bortolato, i programmi di giustizia riparativa hanno effetti positivi nell'esecuzione della pena e sul reinserimento dei condannati; la riparazione non è imposta e la riforma non va letta come «meno carcere e/o più premialità».", "k": ["invio", "carcere"], "f": "M. Bortolato, «La riforma Cartabia: la disciplina organica della giustizia riparativa. Un primo sguardo al nuovo decreto legislativo», Questione Giustizia 2/2023, pp. 130-135", "u": "https://www.questionegiustizia.it/data/rivista/articoli/1098/2_2023_qg_bortolato.pdf"}, {"s": "posizione-2024-01-27-matteo-frasca-principi", "d": "2024-01-27", "o": "favorevole", "chi": "Matteo Frasca", "can": "documento", "x": "Secondo la relazione di Matteo Frasca, che riporta la valutazione del Tribunale di sorveglianza di Palermo, la riforma Cartabia realizza un coinvolgimento «virtuoso» dei giudici di cognizione nella giustizia riparativa.", "k": ["principi"], "f": "M. Frasca, Relazione sull'amministrazione della giustizia nell'anno 2023, Corte d'appello di Palermo, 2024-01-27", "u": "https://ca-palermo.giustizia.it/cmsresources/cms/documents/Relazione_Inaugurazione_2024.pdf"}, {"s": "posizione-2022-08-20-oliviero-mazza-presunzione-innocenza", "d": "2022-08-20", "o": "critica", "chi": "Oliviero Mazza", "can": "articolo", "x": "Secondo Oliviero Mazza, come riporta Marco Bouchard, il giudice che spinge l'imputato verso soluzioni riparative viola la presunzione d'innocenza e la disciplina introduce un decisionismo processuale (in parafrasi).", "k": ["innocenza"], "f": "M. Bouchard, commento alla giustizia riparativa nel d.lgs. 150/2022, Questione Giustizia, note 27-28 (riporta O. Mazza, Il Dubbio, 2022-08-20)", "u": "https://www.questionegiustizia.it/data/doc/3444/bouchard-giustizia-riparativa-qg-riforma-penale.pdf"}, {"s": "posizione-2022-08-27-lorenzo-zilletti-presunzione-innocenza", "d": "2022-08-27", "o": "critica", "chi": "Lorenzo Zilletti", "can": "articolo", "x": "Secondo Lorenzo Zilletti, come riporta Marco Bouchard, sottrarsi al programma riparativo indicato dal PM o dal giudice potrebbe pregiudicare il successivo accertamento della responsabilità secondo il giusto processo (in parafrasi).", "k": ["invio", "innocenza"], "f": "M. Bouchard, commento alla giustizia riparativa nel d.lgs. 150/2022, Questione Giustizia, note 27-28 (riporta L. Zilletti, Il Dubbio, 2022-08-27)", "u": "https://www.questionegiustizia.it/data/doc/3444/bouchard-giustizia-riparativa-qg-riforma-penale.pdf"}, {"s": "posizione-2023-09-21-oliviero-mazza-presunzione-innocenza", "d": "2023-09-21", "o": "critica", "chi": "Oliviero Mazza", "can": "articolo", "x": "Secondo Oliviero Mazza, l'invio dell'imputato al centro da parte del giudice contrasta con la presunzione d'innocenza; il consenso riguarda solo la prosecuzione del programma, non l'accesso; critica l'esclusione del difensore dagli incontri.", "k": ["invio", "innocenza", "percorso"], "f": "O. Mazza, «Così la giustizia riparativa può indebolire il ruolo del difensore», Il Dubbio, 2023-09-21 (copia Ordine avvocati Milano)", "u": "https://www.ordineavvocatimilano.it/media/area-stampa/articoli/EVENTI%20E%20INIZIATIVE/settembre2023/Cos%C3%AC%20la%20giustizia%20riparativa%20pu%C3%B2%20indebolire%20il%20ruolo%20del%20difensore_ildubbionews_21settembre2023.pdf"}, {"s": "posizione-2024-09-oliviero-mazza-volontarieta", "d": "2024-09", "o": "critica", "chi": "Oliviero Mazza", "can": "articolo", "x": "Secondo Oliviero Mazza, vittima e imputato sono costretti a presentarsi dinanzi al mediatore se il giudice lo ordina; il difensore deve essere parte integrante del percorso per tutelare gli interessi giuridici dell'assistito.", "k": ["invio", "percorso"], "f": "O. Mazza, «Miti e realtà della giustizia riparativa», AnteLitteram n. 2, Camera penale di Catanzaro, 2024-09", "u": "https://camerapenalecatanzaro.it/riviste/AnteLitteram-Numerodue_Settembre2024.pdf"}, {"s": "posizione-2023-marco-bouchard-presunzione-innocenza", "d": "2023", "o": "favorevole", "chi": "Marco Bouchard", "can": "articolo", "x": "Secondo Marco Bouchard, le preoccupazioni sulla presunzione d'innocenza sono infondate: l'invio d'ufficio ha scopo deflattivo e la mancata adesione non ha effetti sfavorevoli (artt. 48, 54, 58); nell'art. 129-bis il giudice sente l'imputato ma non la vittima.", "k": ["invio", "innocenza"], "f": "M. Bouchard, Questione Giustizia 2/2023, pp. 136 ss.; commento online su Questione Giustizia", "u": "https://www.questionegiustizia.it/data/rivista/articoli/1099/2_2023_qg_bouchard.pdf"}, {"s": "posizione-2023-marco-bouchard-vittimizzazione-secondaria", "d": "2023", "o": "favorevole con riserve", "chi": "Marco Bouchard", "can": "articolo", "x": "Secondo Marco Bouchard, escludere il consenso della vittima diretta espone a seconda vittimizzazione; la riforma coinvolgerà poche persone, i centri sostituiranno o stabilizzeranno strutture per lo più private e mancheranno risorse umane ed economiche.", "k": ["vittime", "risorse"], "f": "M. Bouchard, Questione Giustizia 2/2023, pp. 136 ss.; commento online su Questione Giustizia", "u": "https://www.questionegiustizia.it/data/rivista/articoli/1099/2_2023_qg_bouchard.pdf"}, {"s": "posizione-2023-marco-bouchard-ruolo-giudice", "d": "2023", "o": "favorevole", "chi": "Marco Bouchard", "can": "articolo", "x": "Secondo Marco Bouchard, l'invio d'ufficio del giudice è una spinta senza effetti sfavorevoli per l'accusato e non viola la presunzione d'innocenza; l'accesso resta libera scelta; il mediatore descrive, senza valutare, attività ed esito.", "k": ["invio", "innocenza", "risorse"], "f": "M. Bouchard, «L'innesto della giustizia riparativa nel processo: l'avvio e la chiusura dalla prospettiva del giudice», Sistema Penale", "u": "https://sistemapenale.it/pdf_contenuti/1700669266_012-bouchard.pdf"}, {"s": "posizione-2023-domenico-pulitano-volontarieta", "d": "2023", "o": "critica", "chi": "Domenico Pulitanò", "can": "articolo", "x": "Secondo Domenico Pulitanò, la riparazione interpersonale non può essere il paradigma generale della risposta al reato; il buon esito ha rilevanza limitata nel giudizio; il potere officioso del giudice richiede vincoli stringenti.", "k": ["principi", "invio", "effetti"], "f": "D. Pulitanò, «Riparazione e lotta per il diritto», Sistema Penale 2/2023, p. 65 ss.", "u": "https://mail.sistemapenale.it/pdf_contenuti/1683798162_sp-2023-2-pulitano.pdf"}, {"s": "posizione-2022-francesco-palazzo-presunzione-innocenza", "d": "2022", "o": "favorevole con riserve", "chi": "Francesco Palazzo", "can": "articolo", "x": "Secondo Francesco Palazzo, l'obiezione che l'invio al centro anticipi un giudizio di colpevolezza «prova troppo»; la giustizia riparativa è doppiamente consensuale, ha scarsa portata deflativa e un ambito senza limiti per tipo di reato coerente con la dottrina.", "k": ["invio", "innocenza", "reati-gravi", "effetti", "risorse"], "f": "F. Palazzo, «Plaidoyer per la giustizia riparativa», in Riflessioni sulla giustizia penale. Studi in onore di Domenico Pulitanò, Giappichelli, 2022", "u": "https://mail.sistemapenale.it/pdf_contenuti/1700665489_001-palazzo.pdf"}, {"s": "posizione-2025-04-08-fabio-fiorentin-presunzione-innocenza", "d": "2025-04-08", "o": "favorevole con riserve", "chi": "Fabio Fiorentin", "can": "articolo", "x": "Secondo Fabio Fiorentin, nella fase di cognizione si pone un possibile attrito tra giustizia riparativa e presunzione d'innocenza, minore nella fase di esecuzione.", "k": ["innocenza", "carcere"], "f": "F. Fiorentin, «Giustizia riparativa: prospettive e crisi di una riforma che attende ancora Godot», Sistema Penale, 2025-04-08", "u": "https://mail.sistemapenale.it/pdf_contenuti/1742290683_fiorentin-giustizia-riparativa.pdf"}, {"s": "posizione-2025-04-08-fabio-fiorentin-centri", "d": "2025-04-08", "o": "favorevole con riserve", "chi": "Fabio Fiorentin", "can": "articolo", "x": "Secondo Fabio Fiorentin, a oltre due anni dalla disciplina organica l'attuazione è ancora alle fasi preliminari; avverte contro una deriva burocratica nelle autorizzazioni ex art. 129-bis e attribuisce agli avvocati una funzione di impulso.", "k": ["invio", "risorse"], "f": "F. Fiorentin, «Giustizia riparativa: prospettive e crisi di una riforma che attende ancora Godot», Sistema Penale, 2025-04-08", "u": "https://mail.sistemapenale.it/pdf_contenuti/1742290683_fiorentin-giustizia-riparativa.pdf"}, {"s": "posizione-2025-04-08-fabio-fiorentin-violenza-di-genere", "d": "2025-04-08", "o": "critica", "chi": "Fabio Fiorentin", "can": "articolo", "x": "Secondo Fabio Fiorentin, l'accesso ai programmi per ogni tipo di reato comporta rischi nei casi di violenza di genere e di criminalità organizzata (in parafrasi).", "k": ["vittime", "violenza-di-genere", "reati-gravi"], "f": "F. Fiorentin, «Giustizia riparativa: prospettive e crisi di una riforma che attende ancora Godot», Sistema Penale, 2025-04-08", "u": "https://mail.sistemapenale.it/pdf_contenuti/1742290683_fiorentin-giustizia-riparativa.pdf"}, {"s": "posizione-2024-10-28-gian-luigi-gatta-principi", "d": "2024-10-28", "o": "favorevole", "chi": "Gian Luigi Gatta", "can": "articolo", "x": "Secondo Gian Luigi Gatta, la riforma ha pensato la giustizia riparativa come complementare e non alternativa al processo, su base volontaria; è un servizio pubblico che richiede organizzazione, formazione e investimenti.", "k": ["principi", "invio", "risorse"], "f": "G.L. Gatta, «La giustizia riparativa: una sfida del nostro tempo», Sistema Penale, Opinioni, 2024-10-28", "u": "https://sistemapenale.it/it/opinioni/gatta-la-giustizia-riparativa-una-sfida-del-nostro-tempo"}, {"s": "posizione-2024-04-12-grazia-mannozzi-accesso", "d": "2024-04-12", "o": "favorevole con riserve", "chi": "Grazia Mannozzi", "can": "articolo", "x": "Secondo Grazia Mannozzi, restano nodi controversi (elenco dei mediatori esperti, natura giuridica dei centri); i programmi con vittima surrogata richiedono cautela; l'attivabilità per qualsiasi reato e in ogni stato e grado è problematica.", "k": ["invio", "vittime", "risorse"], "f": "G. Mannozzi, Prefazione a M. Bouchard, F. Fiorentin, Manuale di giustizia riparativa, Giuffrè 2024 (Sistema Penale, 2024-04-12)", "u": "https://sistemapenale.it/it/documenti/g-mannozzi-prefazione-a-m-bouchard-f-fiorentin-manuale-di-giustizia-riparativa-giuffre-2024?out=print"}, {"s": "posizione-2024-12-09-valentina-bonini-violenza-di-genere", "d": "2024-12-09", "o": "favorevole con riserve", "chi": "Valentina Bonini", "can": "articolo", "x": "Secondo Valentina Bonini, la violenza nelle relazioni intime è il terreno più difficile per la giustizia riparativa; respinge sia divieti aprioristici sia aperture generalizzate e standardizzate; il percorso deve essere un luogo sicuro.", "k": ["invio", "violenza-di-genere"], "f": "V. Bonini, introduzione a «Giustizia riparativa e violenza di genere: una relazione pericolosa?», Sistema Penale, 2024-12-09", "u": "https://sistemapenale.it/it/documenti/giustizia-riparativa-e-violenza-di-genere-una-relazione-pericolosa"}, {"s": "posizione-2026-02-13-gian-luigi-gatta-impugnazioni", "d": "2026-02-13", "o": "favorevole", "chi": "Gian Luigi Gatta", "can": "articolo", "x": "Secondo Gian Luigi Gatta e Mitja Gialuz, il provvedimento del giudice ex art. 129-bis è solo un'autorizzazione; il vaglio di utilità rischia di spingersi troppo in là e propongono una presunzione relativa di utilità del programma; condividono le affermazioni di Corte cost. 128/2025 richiamate dalle Sezioni Unite.", "k": ["invio"], "f": "G.L. Gatta, M. Gialuz, «Le Sezioni Unite sullo statuto della giustizia riparativa…», Sistema Penale, 2026-02-13", "u": "https://sistemapenale.it/it/scheda/gatta-gialuz-le-sezioni-unite-sullo-statuto-della-giustizia-riparativa-tra-funzioni-costituzionali-della-pena-e-garanzie-del-giusto-processo"}, {"s": "posizione-2026-02-13-mitja-gialuz-impugnazioni", "d": "2026-02-13", "o": "favorevole", "chi": "Mitja Gialuz", "can": "articolo", "x": "Secondo Gian Luigi Gatta e Mitja Gialuz, il provvedimento del giudice ex art. 129-bis è solo un'autorizzazione; il vaglio di utilità rischia di spingersi troppo in là e propongono una presunzione relativa di utilità del programma; condividono le affermazioni di Corte cost. 128/2025 richiamate dalle Sezioni Unite.", "k": ["invio"], "f": "G.L. Gatta, M. Gialuz, «Le Sezioni Unite sullo statuto della giustizia riparativa…», Sistema Penale, 2026-02-13", "u": "https://sistemapenale.it/it/scheda/gatta-gialuz-le-sezioni-unite-sullo-statuto-della-giustizia-riparativa-tra-funzioni-costituzionali-della-pena-e-garanzie-del-giusto-processo"}, {"s": "posizione-2025-10-31-paola-maggio-impugnazioni", "d": "2025-10-31", "o": "favorevole", "chi": "Paola Maggio", "can": "articolo", "x": "Secondo Paola Maggio e Veronica Virga, la soluzione delle Sezioni Unite (informazione provvisoria n. 16/2025) sull'impugnabilità del diniego sembra superare la tendenza a marginalizzare la giustizia riparativa, la cui disciplina organica appartiene al diritto e al processo penale.", "k": ["invio", "effetti"], "f": "P. Maggio, V. Virga, «L'impugnabilità del diniego ai programmi di GR nel segno della processualizzazione dell'esito riparativo», Sistema Penale, 2025-10-31", "u": "https://www.sistemapenale.it/it/scheda/maggio-virga-limpugnabilita-del-diniego-ai-programmi-di-gr-nel-segno-della-processualizzazione-dellesito-riparativo"}, {"s": "posizione-2025-10-31-veronica-virga-impugnazioni", "d": "2025-10-31", "o": "favorevole", "chi": "Veronica Virga", "can": "articolo", "x": "Secondo Paola Maggio e Veronica Virga, la soluzione delle Sezioni Unite (informazione provvisoria n. 16/2025) sull'impugnabilità del diniego sembra superare la tendenza a marginalizzare la giustizia riparativa, la cui disciplina organica appartiene al diritto e al processo penale.", "k": ["invio", "effetti"], "f": "P. Maggio, V. Virga, «L'impugnabilità del diniego ai programmi di GR nel segno della processualizzazione dell'esito riparativo», Sistema Penale, 2025-10-31", "u": "https://www.sistemapenale.it/it/scheda/maggio-virga-limpugnabilita-del-diniego-ai-programmi-di-gr-nel-segno-della-processualizzazione-dellesito-riparativo"}, {"s": "posizione-2023-12-04-vittime-del-dovere-reati-di-sangue", "d": "2023-12-04", "o": "critica", "chi": "Associazione Vittime del Dovere", "can": "comunicato", "x": "Secondo Emanuela Piantadosi, presidente dell'Associazione Vittime del Dovere, la riforma Cartabia consente di ottenere sconti di pena attraverso la mediazione; per i reati di sangue la mediazione va abrogata.", "k": ["reati-gravi", "effetti"], "f": "Report Difesa, 2023-12-04 (PDF nella rassegna stampa di vittimedeldovere.it)", "u": "https://vittimedeldovere.it/public/pdf/reportdifesa-4dic2023.pdf"}, {"s": "posizione-2023-12-04-vittime-del-dovere-bellotti-accesso", "d": "2023-12-04", "o": "critica", "chi": "Associazione Vittime del Dovere", "can": "convegno", "x": "Secondo l'avv. Sergio Bellotti, legale dell'Associazione Vittime del Dovere, la giustizia riparativa non può essere una forma alternativa di giustizia; servirebbe un intervento normativo che limiti l'accesso ai programmi, oggi possibile per qualsiasi reato e nella fase di esecuzione, e che distingua il percorso riparativo da quello rieducativo.", "k": ["invio", "reati-gravi", "carcere", "effetti"], "f": "Report Difesa, 2023-12-04; imgpress, 2023-12-05 (PDF nella rassegna stampa di vittimedeldovere.it)", "u": "https://vittimedeldovere.it/public/pdf/reportdifesa-4dic2023.pdf"}, {"s": "posizione-2024-05-02-daniela-marcone-principi", "d": "2024-05-02", "o": "favorevole", "chi": "Daniela Marcone", "can": "intervista", "x": "Secondo Daniela Marcone, vicepresidente di Libera, la riparazione va guardata dalla parte delle vittime; quando chi ha commesso violenza riconosce il dolore si apre una possibilità di verità per le vittime e di cambiamento per i responsabili; in Italia è più difficile perché manca la verità.", "k": ["principi", "reati-gravi"], "f": "Avvenire, 2024-05-02", "u": "https://www.avvenire.it/le-iniziative-di-avvenire/donne-per-la-pace/da-vittima-di-mafia-dico-si-puo-fare-pace-con-il-dolore_76387"}, {"s": "posizione-2021-07-03-dire-condotte-riparatorie-querela", "d": "2021-07-03", "o": "critica", "chi": "D.i.Re - Donne in Rete contro la violenza", "can": "documento", "x": "Secondo D.i.Re, le proposte della Commissione Lattanzi sull'art. 8 del ddl A.C. 2435 (rivedere i casi di querela irretrattabile in relazione alla giustizia riparativa ed estendere l'estinzione del reato per condotte riparatorie) permetterebbero di estinguere reati di violenza contro le donne; D.i.Re chiede di correggerle e un incontro con la ministra.", "k": ["violenza-di-genere", "reati-gravi", "effetti"], "f": "D.i.Re, lettera «C.A. Ministra Cartabia», 2021-07-03", "u": "https://www.direcontrolaviolenza.it/wp-content/uploads/2021/07/C.A._Ministra-Cartabia.pdf"}, {"s": "posizione-2023-09-22-anonimo-associazione-antiviolenza-verona-caso-maltesi", "d": "2023-09-22", "o": "critica", "chi": "Presidente di un'associazione contro la violenza sulle donne di Verona", "can": "articolo", "x": "Secondo Open, la presidente di un'associazione contro la violenza sulle donne di Verona ha detto che è difficile immaginare come vittima, familiari e associazioni possano confrontarsi con l'autore del femminicidio; le associazioni temono che la giustizia riparativa serva a evitare il carcere.", "k": ["violenza-di-genere", "reati-gravi"], "f": "Open, Redazione, 2023-09-22", "u": "https://www.open.online/2023/09/22/carol-matesi-killer-davide-fontana-giustizia-riparativa-polemiche"}, {"s": "posizione-2023-09-28-rete-per-la-parita-esclusione-reati-genere", "d": "2023-09-28", "o": "critica", "chi": "Rete per la Parità APS", "can": "audizione", "x": "Secondo la Rete per la Parità, dopo il primo caso di applicazione (l'ammissione di Davide Fontana a un percorso di giustizia riparativa), la legge contro la violenza sulle donne dovrebbe stabilire che i programmi dell'art. 42 d.lgs. 150/2022 non si applicano ai reati degli artt. 572, 609-bis, 609-ter, 609-quater, 609-quinquies, 609-octies, 612-bis c.p. e alle lesioni aggravate (artt. 582, 583-quinquies c.p.).", "k": ["invio", "violenza-di-genere", "reati-gravi"], "f": "Rete per la Parità APS, memoria e nota di aggiornamento, Camera, documenti acquisiti COM02", "u": "https://documenti.camera.it/leg19/documentiAcquisiti/COM02/Audizioni/leg19.com02.Audizioni.Memoria.PUBBLICO.ideGes.19218.28-09-2023-18-33-59.578.pdf"}, {"s": "posizione-2023-10-01-fabrizia-giuliani-esclusione-reati-genere", "d": "2023-10-01", "o": "critica", "chi": "Fabrizia Giuliani", "can": "audizione", "x": "Secondo la memoria depositata da Fabrizia Giuliani, la legge dovrebbe escludere il percorso di giustizia riparativa e le sanzioni sostitutive per i reati di violenza contro le donne, domestica e di genere.", "k": ["invio", "violenza-di-genere"], "f": "F. Giuliani, memoria, Camera, documenti acquisiti COM02", "u": "https://documenti.camera.it/leg19/documentiAcquisiti/COM02/Audizioni/leg19.com02.Audizioni.Memoria.PUBBLICO.ideGes.19344.04-10-2023-10-54-33.884.pdf"}, {"s": "posizione-2023-10-12-agia-minori", "d": "2023-10-12", "o": "favorevole con riserve", "chi": "Autorità garante per l'infanzia e l'adolescenza", "can": "documento", "x": "Secondo l'AGIA, i percorsi di giustizia riparativa in ambito penale minorile richiedono partecipazione libera e informata, capacità di coinvolgere le vittime, prossimità territoriale, incontri in presenza, coinvolgimento della famiglia, formazione specifica dei mediatori e formazione diffusa dei professionisti.", "k": ["invio", "risorse", "minori"], "f": "AGIA, scheda «Giustizia riparativa: l'indagine nazionale su effetti, programmi e servizi», 2023-10-12", "u": "https://www.garanteinfanzia.org/sites/default/files/2023-10/12-10-2023-scheda-ricerca-giustizia-riparativa.pdf"}, {"s": "posizione-2024-07-25-agia-minori-non-imputabili", "d": "2024-07-25", "o": "favorevole", "chi": "Carla Garlatti", "can": "audizione", "x": "Secondo Carla Garlatti, Autorità garante per l'infanzia e l'adolescenza, la giustizia riparativa non sostituisce il processo ma lo affianca; la Garante auspica che i suoi strumenti siano previsti anche per i minorenni non imputabili e chiede che il carcere per i minorenni sia «extrema ratio».", "k": ["principi", "invio", "carcere", "minori"], "f": "AGIA, comunicato sull'audizione al Senato, 2024-07-25 (data dal nome del file)", "u": "https://garanteinfanzia.org/sites/default/files/2024-07/25-07-2024-audizione-diritti-umani.pdf"}, {"s": "posizione-2026-10-09-garante-detenuti-sicilia-principi", "d": "2026-10-09", "o": "favorevole", "chi": "Anthony De Lisi", "can": "convegno", "x": "Secondo il comunicato della Regione Siciliana, il Garante regionale dei diritti dei detenuti Anthony De Lisi ha detto che la sua presenza al tavolo tecnico-istituzionale serve a contribuire alle politiche sulla giustizia riparativa, con attenzione alla dignità dei detenuti, alla responsabilizzazione e al reinserimento sociale.", "k": ["principi", "carcere"], "f": "Regione Siciliana, comunicato, pagina aggiornata il 2026-10-14", "u": "https://www.regione.sicilia.it/la-regione-informa/anthony-de-lisi-volta-agli-stati-generali-giustizia-riparativa"}, {"s": "posizione-2024-06-07-caritas-italiana-principi", "d": "2024-06-07", "o": "favorevole", "chi": "Caritas Italiana", "can": "documento", "x": "Secondo la scheda di Caritas Italiana, che riprende le parole di Papa Francesco sulla cultura della giustizia riparativa, la partecipazione ai percorsi è libera, volontaria e confidenziale; la scheda riporta 137 percorsi e 6.787 partecipanti in 8 Caritas diocesane.", "k": ["principi", "invio", "risorse"], "f": "Caritas Italiana, scheda «Progetto sperimentale nazionale di giustizia riparativa»", "u": "https://www.caritas.it/wp-content/uploads/sites/2/2024/12/RJ_scheda_risultati_progetto.pdf"}, {"s": "posizione-2024-07-18-cinzia-neglia-centri", "d": "2024-07-18", "o": "favorevole con riserve", "chi": "Cinzia Neglia", "can": "intervista", "x": "Secondo Cinzia Neglia, referente dell'area giustizia di Caritas Italiana, l'attuazione della riforma procede «in modo lento»: i Centri per la giustizia riparativa mancano ancora, mentre gli elenchi dei mediatori sono stati pubblicati a giugno; la giustizia riparativa è complementare alla pena.", "k": ["principi", "risorse"], "f": "Avvenire, 2024-07-18", "u": "https://www.avvenire.it/chiesa/chiesa-italiana/dialogo-che-ricuce-i-conflitti-e-coinvolge-tutta-la-comunita_79149"}, {"s": "posizione-2024-11-13-matteo-maria-zuppi-principi", "d": "2024-11-13", "o": "favorevole", "chi": "Matteo Maria Zuppi", "can": "convegno", "x": "Secondo Matteo Maria Zuppi, presidente della CEI, la giustizia riparativa restituisce dignità alle vittime e agli autori dei reati.", "k": ["principi", "carcere"], "f": "Avvenire, P. Lambruschi, articolo sul convegno del 2024-11-13", "u": "https://www.avvenire.it/attualita/carcere-la-chiesa-chiede-una-svolta-basta-con-la-sicurezza-degli-sceriffi_82727"}, {"s": "posizione-2024-11-13-rosario-petrone-mediatori", "d": "2024-11-13", "o": "favorevole", "chi": "Rosario Petrone", "can": "convegno", "x": "Secondo Rosario Petrone, cappellano del carcere di Salerno, la giustizia riparativa «è il Vangelo»; per avviare la relazione tra reo e vittima servono formazione e aiuto della Caritas.", "k": ["carcere", "risorse"], "f": "Avvenire, P. Lambruschi, articolo sul convegno del 2024-11-13", "u": "https://www.avvenire.it/attualita/carcere-la-chiesa-chiede-una-svolta-basta-con-la-sicurezza-degli-sceriffi_82727"}, {"s": "posizione-2024-11-13-alessandro-ongaro-principi", "d": "2024-11-13", "o": "favorevole", "chi": "Alessandro Ongaro", "can": "convegno", "x": "Secondo Alessandro Ongaro, della Caritas di Verona, la giustizia riparativa non serve solo alla responsabilizzazione degli autori di reato, ma anche a riconoscere la dignità di vittime e famiglie.", "k": ["principi", "percorso"], "f": "Avvenire, P. Lambruschi, articolo sul convegno del 2024-11-13", "u": "https://www.avvenire.it/attualita/carcere-la-chiesa-chiede-una-svolta-basta-con-la-sicurezza-degli-sceriffi_82727"}, {"s": "posizione-2024-11-13-caritas-italiana-carcere", "d": "2024-11-13", "o": "favorevole", "chi": "Caritas Italiana", "can": "documento", "x": "Secondo il documento pubblicato su caritas.it per il convegno «Giustizia e speranza», la comunità deve creare una cultura della giustizia riparativa, promuovere la sensibilizzazione in scuole, parrocchie e associazioni e avviare o partecipare a programmi riparativi come previsti dalla normativa vigente.", "k": ["principi", "carcere"], "f": "«Fuori dal carcere, prima del fine pena e accompagnati», caritas.it", "u": "https://caritas.it/wp-content/uploads/sites/2/2024/11/carcere_documentoingresso.pdf"}, {"s": "posizione-2025-11-25-marcella-reni-carcere", "d": "2025-11-25", "o": "favorevole", "chi": "Marcella Reni", "can": "intervista", "x": "Secondo Marcella Reni, responsabile di Prison Fellowship Italia, il Progetto Sicomoro è in alcuni casi riconosciuto dal Ministero della giustizia come attività trattamentale; per Reni il cambiamento è sempre possibile e nessuno è riducibile al reato commesso.", "k": ["percorso", "carcere"], "f": "Avvenire, G. Paolucci, 2025-11-25", "u": "https://www.avvenire.it/idee-e-commenti/incontrare-le-vittime-dei-crimini-mi-ha-cambiato-la-vita_101327"}, {"s": "posizione-2026-02-09-mariangela-perito-carcere", "d": "2026-02-09", "o": "favorevole", "chi": "Mariangela Perito", "can": "convegno", "x": "Secondo Mariangela Perito, delegata ACLI alla giustizia riparativa, che riprende parole dell'arcivescovo di Milano Mario Delpini, servono giustizia riparativa, clemenza, percorsi di responsabilità e umanità.", "k": ["carcere"], "f": "Avvenire, G. Carini, 2026-02-09", "u": "https://www.avvenire.it/politica/carceri-lappello-di-associazioni-e-garanti-senza-diritti-sistema-a-rischio_104337"}, {"s": "posizione-2022-06-23-marta-cartabia-principi", "d": "2022-06-23", "o": "favorevole", "chi": "Marta Cartabia", "can": "convegno", "x": "Secondo la ministra della giustizia Marta Cartabia, la giustizia riparativa è un modo nuovo di intendere la giustizia, un percorso di dialogo basato sulla partecipazione volontaria di vittima e autore che coinvolge la comunità; resta molto da fare sulle risorse finanziarie e umane e la riforma va in questa direzione.", "k": ["principi", "invio", "risorse"], "f": "L'Unione Sarda, G. Marras, 2022-06-23", "u": "https://www.unionesarda.it/news-sardegna/sassari-provincia/sassari-al-forum-europeo-il-ministro-cartabia-la-giustizia-riparativa-puo-aiutare-a-migliorare-i-rapporti-sociali-dzll7yuy"}, {"s": "posizione-2022-09-15-m5s-camera-parere-alternativo-ag-414", "d": "2022-09-15", "o": "critica", "chi": "Movimento 5 Stelle", "can": "documento", "x": "Secondo il gruppo M5S in II Commissione Giustizia della Camera, le norme dello schema A.G. 414 presentano criticità che rischiano di rendere meno efficiente la giustizia penale (10 richieste di modifica); secondo il deputato Vittorio Ferraresi, alcune norme sulla giustizia riparativa e sul patteggiamento incidono sulle vittime dei reati.", "k": ["principi"], "f": "Il Fatto Quotidiano, «F. Q.», 2022-09-15", "u": "https://www.ilfattoquotidiano.it/2022/09/15/riforma-cartabia-colpo-di-spugna-sulle-confische-fi-lega-pd-e-azione-danno-lok-al-decreto-che-rischia-di-mandarle-in-fumo-m5s-vota-contro/6804825/"}, {"s": "posizione-2023-05-25-francesco-paolo-sisto-principi", "d": "2023-05-25", "o": "favorevole", "chi": "Francesco Paolo Sisto", "can": "convegno", "x": "Secondo il viceministro della giustizia Francesco Paolo Sisto, la disciplina della giustizia riparativa è «una rivoluzione», una riforma culturale che mette la vittima al centro dei percorsi e riconosce benefici anche per ristori non patrimoniali.", "k": ["principi"], "f": "Ecoseven (lancio Adnkronos), 2023-05-25", "u": "https://www.ecoseven.net/flash-news/il-viceministro-sisto-alluniversita-link-quella-riparativa-una-rivoluzione-culturale/"}, {
