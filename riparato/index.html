"s": "posizione-2023-10-carlo-nordio-principi", "d": "2023-10", "o": "favorevole", "chi": "Carlo Nordio", "can": "convegno", "x": "Secondo il ministro della giustizia Carlo Nordio, la giustizia riparativa è una rivoluzione copernicana.", "k": ["principi"], "f": "NT+ Diritto (Il Sole 24 Ore), M. Crisafi, 2026-02-11", "u": "https://ntplusdiritto.ilsole24ore.com/art/nascono-36-centri-giustizia-riparativa-italia-AI5b6SLB"}, {"s": "posizione-2023-11-24-carlo-nordio-violenza-di-genere", "d": "2023-11-24", "o": "favorevole con riserve", "chi": "Carlo Nordio", "can": "intervista", "x": "Secondo il ministro Carlo Nordio, in un'intervista sulla violenza contro le donne, la giustizia riparativa è una conquista del diritto penale moderno e si basa sul consenso pieno della vittima; per alcune situazioni è impraticabile, ma in sé funziona.", "k": ["principi", "invio", "violenza-di-genere"], "f": "Il Sole 24 Ore, M. Perrone, 2023-11-24", "u": "https://en.ilsole24ore.com/art/violenza-donne-sconfitta-lo-stato-decisiva-prevenzione-AFnsoHjB"}, {"s": "posizione-2024-11-20-antonio-dalessio-centri", "d": "2024-11-20", "o": "favorevole con riserve", "chi": "Antonio D'Alessio", "can": "documento", "x": "Secondo l'interrogazione del deputato D'Alessio, il Governo deve indicare quali iniziative intende adottare per rendere operativi a breve i Centri per la giustizia riparativa istituiti dal d.lgs. 150/2022.", "k": ["risorse"], "f": "Ministero della giustizia, risposta all'interrogazione 4-03829 (che riassume la richiesta)", "u": "https://www.giustizia.it/cmsresources/cms/documents/interrogazione_dalessio_risposta_12dic2024.pdf"}, {"s": "posizione-2024-12-12-carlo-nordio-centri", "d": "2024-12-12", "o": "neutra", "chi": "Carlo Nordio", "can": "documento", "x": "Secondo il ministro Carlo Nordio, il coordinamento spetta al Ministero tramite il Dipartimento per la giustizia minorile e di comunità e la nuova Direzione generale per la giustizia minorile e riparativa (DPCM 78/2024); è in corso una ricognizione dei servizi esistenti per un Elenco utile agli enti locali in vista della prima apertura dei Centri; il sistema sarà operativo con l'obiettivo di restituire centralità alla vittima.", "k": ["principi", "risorse"], "f": "Ministero della giustizia, risposta all'interrogazione D'Alessio 4-03829", "u": "https://www.giustizia.it/cmsresources/cms/documents/interrogazione_dalessio_risposta_12dic2024.pdf"}, {"s": "posizione-2026-10-09-francesco-paolo-sisto-principi", "d": "2026-10-09", "o": "favorevole", "chi": "Francesco Paolo Sisto", "can": "convegno", "x": "Secondo il viceministro della giustizia Francesco Paolo Sisto, la giustizia riparativa è un'opportunità per promuovere una giustizia più umana.", "k": ["principi"], "f": "Regione Siciliana, comunicato, pagina aggiornata il 2026-10-14", "u": "https://www.regione.sicilia.it/la-regione-informa/anthony-de-lisi-volta-agli-stati-generali-giustizia-riparativa"}, {"s": "posizione-2023-10-19-stefania-ascari-esclusione-reati-genere", "d": "2023-10-19", "o": "critica", "chi": "Stefania Ascari; Movimento 5 Stelle", "can": "esame in sede referente, II Commissione Giustizia della Camera (A.C. 1294 e abbinate)", "x": "Secondo la deputata S. Ascari (M5S), le disposizioni sulla giustizia riparativa non dovrebbero applicarsi ai reati di violenza di genere; richiama la Convenzione di Istanbul. L'articolo aggiuntivo è respinto.", "k": ["invio", "violenza-di-genere"], "f": "Camera, II Commissione Giustizia, bollettino del 2023-10-19, pp. 45 e 50-51", "u": "https://documenti.camera.it/leg19/resoconti/commissioni/bollettini/pdf/2023/10/19/leg.19.bol0186.data20231019.com02.pdf"}, {"s": "posizione-2023-10-23-differenza-donna-esclusione-reati-genere", "d": "2023-10-23", "o": "critica", "chi": "Differenza Donna APS; Elisa Ercoli; Teresa Manente", "can": "memoria scritta alla II Commissione Giustizia della Camera (A.C. 1294, 439, 603, 1245)", "x": "Secondo Differenza Donna, la giustizia riparativa va esclusa per i reati di violenza contro le donne, di genere e domestica: la disciplina contrasterebbe con l'art. 48 della Convenzione di Istanbul e l'art. 12 della direttiva 2012/29/UE.", "k": ["invio", "vittime", "violenza-di-genere"], "f": "Differenza Donna APS (E. Ercoli, T. Manente), memoria su A.C. 1294 e abbinati", "u": "https://documenti.camera.it/leg19/documentiAcquisiti/COM02/Audizioni/leg19.com02.Audizioni.Memoria.PUBBLICO.ideGes.19218.23-10-2023-14-59-13.184.pdf"}, {"s": "posizione-2024-04-08-giulia-boccassi-violenza-di-genere", "d": "2024-04-08", "o": "critica", "chi": "Giulia Boccassi; Unione delle Camere Penali Italiane", "can": "audizione, Commissione parlamentare di inchiesta sul femminicidio, seduta n. 38", "x": "Secondo l'avv. G. Boccassi, dell'Ufficio di presidenza UCPI, nei reati di violenza di genere la giustizia riparativa potrebbe servire nell'esecuzione della pena, non nella fase processuale.", "k": ["invio", "violenza-di-genere", "carcere"], "f": "Camera, Commissione femminicidio, resoconto stenografico (bozza non corretta) della seduta del 2024-04-08", "u": "https://documenti.camera.it/leg19/resoconti/commissioni/stenografici/html/26/audiz2/audizione/2024/04/08/indice_stenografico.0038.html"}, {"s": "posizione-2025-12-02-grevio-giustizia-riparativa-italia", "d": "2025-12-02", "o": "favorevole con riserve", "chi": "GREVIO", "can": "rapporto di monitoraggio (primo rapporto di valutazione tematica sull'Italia, GREVIO(2025)15)", "x": "Secondo il GREVIO, i giudici possono inviare i casi ai Centri senza il consenso della vittima e le garanzie non sembrano applicate; chiede informazione, valutazione del rischio, rappresentanza legale e sostegno specialistico.", "k": ["invio", "violenza-di-genere", "risorse"], "f": "GREVIO(2025)15, sintesi e par. 5 e nota 7", "u": "https://rm.coe.int/first-thematic-evaluation-report-building-trust-by-delivering-support-/4880299441"}, {"s": "posizione-2024-efrj-giustizia-riparativa-violenza-donne", "d": "2024", "o": "favorevole", "chi": "European Forum for Restorative Justice", "can": "briefing paper", "x": "Secondo l'EFRJ, la Convenzione di Istanbul non menziona la giustizia riparativa; chiede che sia disponibile alle vittime di violenza contro le donne, con informazione, libera scelta, garanzie e standard di pratica.", "k": ["invio", "violenza-di-genere"], "f": "EFRJ, briefing paper on the use of restorative justice in cases of violence against women, pp. 6-7", "u": "https://www.euforumrj.org/sites/default/files/2024-12/efrj-briefing-paper-on-rj-in-cases-of-vaw.pdf"}, {"s": "posizione-2024-12-09-elena-mattevi-violenza-di-genere", "d": "2024-12-09", "o": "favorevole con riserve", "chi": "Elena Mattevi", "can": "rivista (Sistema Penale, dossier «Giustizia riparativa e violenza di genere: una relazione pericolosa?»)", "x": "Secondo E. Mattevi, l'art. 48 della Convenzione vieta solo le procedure obbligatorie; no a divieti generali; vaglio giudiziale rigoroso, valutazione strutturata del rischio, mediatori formati, raccordo con i centri antiviolenza.", "k": ["invio", "violenza-di-genere", "risorse"], "f": "Sistema Penale, dossier del 2024-12-09, pp. 5-22", "u": "https://sistemapenale.it/pdf_contenuti/1733334586_giustizia-riparativa-e-violenza-di-genere.pdf"}, {"s": "posizione-2024-12-09-anna-lorenzetti-violenza-di-genere", "d": "2024-12-09", "o": "favorevole con riserve", "chi": "Anna Lorenzetti", "can": "rivista (Sistema Penale, stesso dossier); copia su aisberg.unibg.it", "x": "Secondo A. Lorenzetti, né divieto né abrogazione: servono formazione sulla violenza di genere per mediatori, magistrati e avvocati, mediatori esperti, confronto con i centri antiviolenza e un linguaggio che distingua violenza e conflitto.", "k": ["vittime", "violenza-di-genere", "risorse"], "f": "A. Lorenzetti, «Giustizia riparativa e violenza di genere. Spunti per un confronto non più eludibile»", "u": "https://aisberg.unibg.it/bitstream/10446/289985/1/gr%20e%20vdg_lorenzetti.pdf"}, {"s": "posizione-2024-salvatore-giangrasso-violenza-di-genere", "d": "2024", "o": "favorevole con riserve", "chi": "Salvatore Giangrasso", "can": "testo pubblicato dall'Osservatorio violenza donne, Università di Milano", "x": "Secondo l'avv. S. Giangrasso, nei reati di violenza di genere l'uso è controverso: va valutato con cautela caso per caso, con partecipazione sempre volontaria e attenzione al rischio di ulteriore vittimizzazione.", "k": ["invio", "vittime", "violenza-di-genere"], "f": "S. Giangrasso, «Azioni di prevenzione al contrasto della violenza di genere ed azioni di giustizia riparativa. Considerazioni a partire dal protocollo Zeus»", "u": "https://ovd.unimi.it/wp-content/uploads/sites/3/2024/05/OVD.pdf"}, {"s": "posizione-2023-10-19-paola-maggio-vittima-aspecifica", "d": "2023-10-19", "o": "favorevole con riserve", "chi": "Paola Maggio; Francesco Parisi", "can": "rivista (Sistema Penale, scheda)", "x": "Secondo P. Maggio e F. Parisi, in un caso di omicidio la sostituzione automatica della vittima diretta con una vittima aspecifica rischia vittimizzazione secondaria; il criterio di «utilità» è ampio; il cambiamento va introdotto con cautela.", "k": ["vittime", "violenza-di-genere", "reati-gravi"], "f": "P. Maggio, F. Parisi, scheda su Sistema Penale, 2023-10-19", "u": "https://www.sistemapenale.it/it/scheda/maggio-parisi-giustizia-riparativa-con-vittima-surrogata-o-aspecifica-il-caso-maltesi-fontana-continua-a-far-discutere"}, {"s": "posizione-2023-10-19-devis-dori-contrario-esclusione-reati-genere", "d": "2023-10-19", "o": "favorevole", "chi": "Devis Dori", "can": "esame in sede referente, II Commissione Giustizia della Camera (A.C. 1294)", "x": "Secondo il deputato D. Dori (AVS), che vota contro l'articolo aggiuntivo 14.038, il percorso è volontario e le vittime spesso lo chiedono; richiama l'art. 48 della Convenzione di Istanbul.", "k": ["invio", "violenza-di-genere"], "f": "Camera, II Commissione Giustizia, bollettino del 2023-10-19, p. 50", "u": "https://documenti.camera.it/leg19/resoconti/commissioni/bollettini/pdf/2023/10/19/leg.19.bol0186.data20231019.com02.pdf"}, {"s": "posizione-2023-10-19-debora-serracchiani-contraria-esclusione-reati-genere", "d": "2023-10-19", "o": "favorevole", "chi": "Debora Serracchiani", "can": "esame in sede referente, II Commissione Giustizia della Camera (A.C. 1294)", "x": "Secondo la deputata D. Serracchiani (PD-IDP), che vota contro l'articolo aggiuntivo 14.038, la Convenzione di Istanbul esclude solo la mediazione obbligatoria e in Italia la giustizia riparativa è facoltativa.", "k": ["invio", "violenza-di-genere"], "f": "Camera, II Commissione Giustizia, bollettino del 2023-10-19, p. 51", "u": "https://documenti.camera.it/leg19/resoconti/commissioni/bollettini/pdf/2023/10/19/leg.19.bol0186.data20231019.com02.pdf"}, {"s": "posizione-2023-10-19-simonetta-matone-contraria-esclusione-mediazione", "d": "2023-10-19", "o": "favorevole", "chi": "Simonetta Matone", "can": "esame in sede referente, II Commissione Giustizia della Camera (A.C. 1294)", "x": "Secondo la deputata S. Matone (Lega), eliminare la mediazione per questi reati sarebbe controproducente; la mediazione mira a eliminare le conseguenze negative del reato.", "k": ["violenza-di-genere"], "f": "Camera, II Commissione Giustizia, bollettino del 2023-10-19, p. 51", "u": "https://documenti.camera.it/leg19/resoconti/commissioni/bollettini/pdf/2023/10/19/leg.19.bol0186.data20231019.com02.pdf"}, {"s": "posizione-2023-10-19-relatore-governo-parere-contrario-art-agg-14-038", "d": "2023-10-19", "o": "favorevole", "chi": "relatore e Governo", "can": "esame in sede referente, II Commissione Giustizia della Camera (A.C. 1294)", "x": "Il relatore e il Governo invitano a ritirare l'articolo aggiuntivo 14.038 (esclusione dei reati di violenza di genere), altrimenti esprimono parere contrario.", "k": ["violenza-di-genere"], "f": "Camera, II Commissione Giustizia, bollettino del 2023-10-19, p. 45", "u": "https://documenti.camera.it/leg19/resoconti/commissioni/bollettini/pdf/2023/10/19/leg.19.bol0186.data20231019.com02.pdf"}, {"s": "posizione-2024-12-09-elena-biaggioni-violenza-di-genere", "d": "2024-12-09", "o": "critica", "chi": "Elena Biaggioni", "can": "rivista (Sistema Penale, stesso dossier), a titolo personale", "x": "Secondo E. Biaggioni, l'accesso in ogni fase, anche prima della querela, rischia di violare la Convenzione di Istanbul; la funzione deflattiva non deve gravare sulle donne; la natura del reato impedisce un rapporto alla pari.", "k": ["invio", "innocenza", "violenza-di-genere"], "f": "Sistema Penale, dossier del 2024-12-09, pp. 23-34", "u": "https://sistemapenale.it/pdf_contenuti/1733334586_giustizia-riparativa-e-violenza-di-genere.pdf"}, {"s": "posizione-2020-01-13-grevio-mediazione-obbligatoria-ddl-735", "d": "2020-01-13", "o": "neutra", "chi": "GREVIO", "can": "rapporto di valutazione di base sull'Italia, GREVIO/Inf(2019)18, par. 36", "x": "Secondo il GREVIO, la mediazione obbligatoria prevista dal ddl n. 735 sarebbe contraria all'art. 48 della Convenzione; invita a verificare i progetti di legge rispetto alla Convenzione.", "k": ["violenza-di-genere"], "f": "GREVIO/Inf(2019)18, par. 36 e 39", "u": "https://rm.coe.int/rapport-du-grevio-sur-l-italie/1680998659"}, {"s": "posizione-2023-10-11-grazia-mannozzi-vittima-surrogata", "d": "2023-10-11", "o": "favorevole con riserve", "chi": "Grazia Mannozzi", "can": "stampa (Sky TG24, intervista di Y. Al Zaitr)", "x": "Secondo G. Mannozzi, i percorsi non possono essere imposti; la vittima surrogata è una scelta molto delicata che può creare malcontento nelle vittime dirette; niente giustizia riparativa «a tutti i costi».", "k": ["invio", "vittime"], "f": "Sky TG24, 2023-10-11", "u": "https://tg24.sky.it/cronaca/2023/10/11/giustizia-riparativa-cartabia-cosa-e"}, {"s": "posizione-2024-04-08-elisabetta-pierazzi-violenza-di-genere", "d": "2024-04-08", "o": "favorevole", "chi": "Elisabetta Pierazzi", "can": "audizione, Commissione parlamentare di inchiesta sul femminicidio, seduta n. 38", "x": "Secondo la magistrata E. Pierazzi, dell'Ufficio legislativo del Ministero della giustizia, nel testo in esame si può valutare di collocare la giustizia riparativa tra i servizi pubblici di cura della relazione, perché riguarda anche la fase prima dell'esecuzione.", "k": ["violenza-di-genere", "risorse"], "f": "Camera, Commissione femminicidio, seduta del 2024-04-08", "u": "https://documenti.camera.it/leg19/resoconti/commissioni/stenografici/html/26/audiz2/audizione/2024/04/08/indice_stenografico.0038.html"}, {"s": "posizione-2024-04-08-maria-elena-mastrojanni-violenza-di-genere", "d": "2024-04-08", "o": "neutra", "chi": "Maria Elena Mastrojanni", "can": "audizione, Commissione parlamentare di inchiesta sul femminicidio, seduta n. 38", "x": "Secondo la magistrata M.E. Mastrojanni, c'è un ampio dibattito sull'inserire o no la giustizia riparativa tra le norme sulla violenza di genere; l'innesto in un sistema «granitico» è delicato.", "k": ["violenza-di-genere"], "f": "Camera, Commissione femminicidio, seduta del 2024-04-08", "u": "https://documenti.camera.it/leg19/resoconti/commissioni/stenografici/html/26/audiz2/audizione/2024/04/08/indice_stenografico.0038.html"}, {"s": "posizione-2023-10-23-differenza-donna-programmi-autori-mediazione", "d": "2023-10-23", "o": "critica", "chi": "Differenza Donna APS", "can": "memoria scritta alla II Commissione Giustizia della Camera (A.C. 1294)", "x": "Secondo Differenza Donna, gli effetti della pena sospesa devono decorrere dopo l'esito positivo del programma per autori; i programmi con contatto autore-vittima aprono una mediazione di fatto vietata dalla Convenzione di Istanbul.", "k": ["percorso", "violenza-di-genere"], "f": "Differenza Donna, memoria su A.C. 1294", "u": "https://documenti.camera.it/leg19/documentiAcquisiti/COM02/Audizioni/leg19.com02.Audizioni.Memoria.PUBBLICO.ideGes.19218.23-10-2023-14-59-13.184.pdf"}, {"s": "posizione-2023-10-02-dire-percorsi-autori-sospensione-condizionale", "d": "2023-10-02", "o": "favorevole con riserve", "chi": "D.i.Re - Donne in Rete contro la violenza", "can": "osservazioni scritte alla II Commissione Giustizia della Camera (A.C. 1294)", "x": "Secondo D.i.Re, il percorso dell'art. 165 c. 5 c.p. deve essere una partecipazione positiva valutata dagli enti che lo gestiscono; il controllo dell'UEPE rischia di allungare i tempi.", "k": ["percorso", "violenza-di-genere"], "f": "D.i.Re, osservazioni su A.C. 1294", "u": "https://documenti.camera.it/leg19/documentiAcquisiti/COM02/Audizioni/leg19.com02.Audizioni.Memoria.PUBBLICO.ideGes.19218.02-10-2023-12-39-36.282.pdf"}, {"s": "posizione-2024-07-10-ucpi-41-bis", "d": "2024-07-10", "o": "favorevole", "chi": "Unione delle Camere Penali Italiane", "can": "audizione", "x": "Secondo la Giunta UCPI la lett. f-bis contrasta con l'obiettivo di umanizzare la pena e con la riforma Cartabia, lede l'uguaglianza e manca di necessità e urgenza.", "k": ["reati-gravi"], "f": "UCPI, La Giunta, note per l'audizione in Commissione Giustizia del Senato, Roma, 2024-07-10", "u": "https://camerepenali.it/public/file/Documenti Camera e Senato/2024-07-10_Audizione-Comm-Senato_Note-UCPI.pdf"}, {"s": "posizione-2024-07-10-marco-ruotolo-41-bis", "d": "2024-07-10", "o": "favorevole", "chi": "Marco Ruotolo", "can": "audizione", "x": "Secondo Ruotolo nessun decreto attuativo aveva previsto l'esclusione; la preclusione assoluta va vagliata sul piano costituzionale; è una scelta di opportunità politica; l'art. 7 potrebbe essere soppresso.", "k": ["reati-gravi"], "f": "M. Ruotolo, «Riflessioni sui possibili margini di intervento parlamentare in sede di conversione del decreto-legge 4 luglio 2024, n. 92», Sistema Penale, 2024-07-11", "u": "https://sistemapenale.it/it/documenti/ruotolo-riflessioni-sui-possibili-margini-di-intervento-parlamentare-in-sede-di-conversione-del-decreto-legge-4-luglio-2024-n-92-appunti-a-prima-lettura"}, {"s": "posizione-2024-07-05-governo-41-bis-incompatibilita", "d": "2024-07-05", "o": "critica", "chi": "Governo della Repubblica italiana", "can": "documento", "x": "Secondo la relazione del Governo le caratteristiche dei programmi sono incompatibili con il 41-bis; la norma esplicita un'incompatibilità già ricavabile dal sistema, per evitare dubbi applicativi.", "k": ["reati-gravi"], "f": "Servizi Studi Senato e Camera", "u": "https://senato.it/service/PDF/PDFServer/BGT/01423142.pdf"}, {"s": "posizione-2024-08-01-sergio-rastrelli-41-bis", "d": "2024-08-01", "o": "critica", "chi": "Sergio Rastrelli", "can": "documento", "x": "Secondo il relatore Rastrelli il decreto ha reso esplicito il divieto, già previsto nei fatti, per i detenuti al 41-bis di accedere ai programmi.", "k": ["reati-gravi"], "f": "Senato della Repubblica", "u": "https://senato.it/service/PDF/PDFServer/DF/438353.pdf"}, {"s": "posizione-2024-11-09-giulia-pitzolu-41-bis", "d": "2024-11-09", "o": "favorevole", "chi": "Giulia Pitzolu", "can": "articolo", "x": "Secondo la nota OSEP la lett. f-bis inverte la rotta della riforma, contrasta con l'art. 44 d.lgs. 150/2022 e potrebbe essere oggetto di una questione di legittimità.", "k": ["reati-gravi"], "f": "OSEP", "u": "https://osep.jus.unipi.it/2024/11/09/il-carcere-duro-impedisce-laccesso-ai-programmi-di-giustizia-riparativa/"}, {"s": "posizione-2025-06-18-giuseppe-mastropasqua-41-bis", "d": "2025-06-18", "o": "favorevole", "chi": "Giuseppe Mastropasqua", "can": "articolo", "x": "Secondo Mastropasqua l'esclusione del 41-bis contrasta con la riforma Cartabia e crea una disparità irragionevole; la questione di legittimità era non manifestamente infondata.", "k": ["reati-gravi"], "f": "Diritto Giustizia e Costituzione", "u": "https://www.dirittogiustiziaecostituzione.it/giustizia-riparativa-prime-decisioni-giurisprudenziali-di-giuseppe-mastropasqua/"}, {"s": "posizione-2025-11-11-familiari-vittime-circolare-dap", "d": "2025-11-11", "o": "favorevole", "chi": "Giovanni Bachelet; Fiammetta Borsellino; Marisa Fiorani; Silvia Giralucci; Manlio Milani; Lucia Di Mauro Montanino; Agnese Moro; Giovanni Ricci; Sabina Rossa; Paolo Setti Carraro", "can": "documento", "x": "Secondo i firmatari, le regole che centralizzano le autorizzazioni agli incontri tra detenuti ed esterni causano perplessità e sofferenza; il riconoscimento reciproco tra detenuto e vittima favorisce il cambiamento.", "k": ["reati-gravi"], "f": "Sistema Penale [1]", "u": "https://sistemapenale.it/it/documenti/stretta-del-dap-sui-percorsi-di-rieducazione-la-lettera-dei-familiari-delle-vittime-di-terrorismo-e-il-comunicato-della-magistratura-di-sorveglianza"}, {"s": "posizione-2025-11-11-conams-circolare-dap", "d": "2025-11-11", "o": "favorevole", "chi": "CONAMS", "can": "comunicato", "x": "Secondo il CONAMS, la nota DAP del 2025-10-21 centralizza le autorizzazioni, rischia di compromettere progetti del Terzo settore e riduce le attività trattamentali.", "k": ["principi"], "f": "Sistema Penale [1]", "u": "https://sistemapenale.it/it/documenti/stretta-del-dap-sui-percorsi-di-rieducazione-la-lettera-dei-familiari-delle-vittime-di-terrorismo-e-il-comunicato-della-magistratura-di-sorveglianza"}, {"s": "posizione-2025-11-21-ucpi-circolare-dap", "d": "2025-11-21", "o": "favorevole", "chi": "Unione delle Camere Penali Italiane", "can": "documento", "x": "Secondo l'UCPI, il nulla osta DAP sugli eventi trattamentali deve avere funzione consultiva, perché l'art. 17 o.p. affida l'autorizzazione al magistrato di sorveglianza; chiede termini certi.", "k": ["principi"], "f": "camerepenali.it [4]", "u": "https://www.camerepenali.it/public/file/Documenti/Documenti_Giunta_Petrelli/Doc-047_2025-11-21_UCPI_Osservazioni_proposte-mod_circolare21-10-25.pdf"}, {"s": "posizione-2026-01-21-carlo-nordio-circolare-dap", "d": "2026-01-21", "o": "neutra", "chi": "Carlo Nordio", "can": "documento", "x": "Secondo il Ministro, la nota del 2025-10-21 sposta solo la competenza alla DGDT e non ha ridotto le attività trattamentali, anche in alta sicurezza.", "k": ["principi"], "f": "giustizia.it [3]", "u": "https://www.giustizia.it/cmsresources/cms/documents/interrogazione_ghirra_risposta_21gen2026.pdf"}, {"s": "posizione-2026-02-garante-emilia-romagna-gr-carcere", "d": "2026-02", "o": "favorevole con riserve", "chi": "Garante delle persone sottoposte a misure restrittive o limitative della libertà personale", "can": "documento", "x": "Secondo il rapporto, l'accesso ai programmi in carcere è disomogeneo tra istituti; servono formazione degli operatori e più preparazione nei casi di omicidio.", "k": ["principi", "reati-gravi"], "f": "Università di Bologna, CIRVIS [7]", "u": "https://centri.unibo.it/cirvis/it/pubblicazioni/testo-in-openaccess-1/@@download/file/garantedetenuti-mannone_giustizia_riparativa.pdf"}, {"s": "posizione-2026-04-02-maria-brucale-alta-sicurezza", "d": "2026-04-02", "o": "favorevole", "chi": "Maria Brucale", "can": "articolo", "x": "Secondo M. Brucale, le circolari dell'ultimo anno hanno tolto ai detenuti di alta sicurezza quasi ogni contatto con l'esterno, contro l'art. 27 Cost.", "k": ["principi"], "f": "Domani [5]", "u": "https://www.editorialedomani.it/giustizia/cosi-lo-stato-cancella-la-rieducazione-per-i-detenuti-allalta-sicurezza-carcere-uukblu0p"}, {"s": "posizione-2026-07-domenico-massano-alta-sicurezza", "d": "2026-07", "o": "favorevole", "chi": "Domenico Massano", "can": "documento", "x": "Secondo il Garante di Asti, la chiusura ha colpito soprattutto l'alta sicurezza; iniziative con l'esterno hanno avuto ostacoli o nessuna autorizzazione.", "k": ["principi"], "f": "La Voce di Asti (PDF) [6]", "u": "https://www.lavocediasti.it/fileadmin/archivio/lavocediasti/2026/07/Relazione_garante_privati_libert%C3%A0_2025_2026.pdf"}, {"s": "posizione-2023-12-05-alberto-torregiani-terrorismo", "d": "2023-12-05", "o": "critica", "chi": "Alberto Torregiani", "can": "intervista", "x": "Secondo Alberto Torregiani la legge è «scritta male»: prima di chiedere benefici il condannato dovrebbe scontare metà pena in alta sicurezza e dimostrare pentimento; non incontrerà Battisti.", "k": ["reati-gravi"], "f": "Fanpage, F. Del Boca, 2023-12-05", "u": "https://www.fanpage.it/milano/cesare-battisti-chiede-di-incontrare-i-parenti-delle-vittime-alberto-torregiani-questa-legge-e-sbagliata/"}, {"s": "posizione-2023-12-aiviter-decide-magistratura", "d": "2023-12", "o": "neutra", "chi": "AIVITER - Associazione italiana vittime del terrorismo", "can": "intervista", "x": "Secondo Roberto Della Rocca, presidente di AIVITER, sulla richiesta di Battisti non decidono i familiari ma la magistratura, in uno Stato di diritto.", "k": ["reati-gravi"], "f": "Adnkronos, articolo senza data", "u": "https://www.adnkronos.com/cronaca/redenzione-per-cesare-battisti-no-delle-famiglie-delle-vittime-allincontro_5DFlqHZqZvFD69CUmHLjkC"}, {"s": "posizione-2023-01-12-paolo-setti-carraro-mafia", "d": "2023-01-12", "o": "favorevole", "chi": "Paolo Setti Carraro", "can": "articolo", "x": "Secondo Paolo Setti Carraro la riparazione richiede il cambiamento del colpevole; il dialogo con gli autori di reati di mafia aiuta a chiudere il «ciclo della vendetta».", "k": ["reati-gravi"], "f": "lavialibera.it, P. Setti Carraro, 2023-01-12", "u": "https://lavialibera.it/it-schede-1231-giustizia_riparativa_paolo_setti_carraro_nuovo_percorso"}, {"s": "posizione-2023-03-20-luigi-ciotti-41-bis", "d": "2023-03-20", "o": "favorevole", "chi": "Luigi Ciotti", "can": "intervista", "x": "Secondo Luigi Ciotti il 41-bis serve a impedire che i boss guidino le cosche dal carcere, ma non giustifica misure vessatorie; la pena deve mirare al recupero per ogni reato.", "k": ["reati-gravi"], "f": "LaPresse, 2023-03-20", "u": "https://www.lapresse.it/cronaca/2023/03/20/mafie-ciotti-80-familiari-attende-giustizia-su-41-bis-no-vendette/"}, {"s": "posizione-2025-07-10-agnese-moro-terrorismo", "d": "2025-07-10", "o": "favorevole", "chi": "Agnese Moro", "can": "articolo", "x": "Secondo Famiglia Cristiana, Agnese Moro si definisce soddisfatta del percorso di giustizia riparativa, dopo un primo rifiuto e un incontro tra sole vittime.", "k": ["reati-gravi"], "f": "Famiglia Cristiana, E. Chiari, 2025-07-10", "u": "https://www.famigliacristiana.it/articolo/giustizia-riparativa-che-cos-e-da-quando-esiste-perche-fa-discutere-cesare-battisti.aspx"}, {"s": "posizione-2024-giovanni-melillo-41-bis", "d": "2024", "o": "critica", "chi": "Giovanni Melillo", "can": "audizione", "x": "Secondo un commento su Domani, Giovanni Melillo in audizione ha detto che al 41-bis non si fa trattamento penitenziario e ha messo in dubbio la liberazione anticipata per quei detenuti.", "k": ["reati-gravi"], "f": "Domani, M. Brucale, 2024-04-19 (commento)", "u": "https://www.editorialedomani.it/giustizia/lo-ammette-anche-melillo-per-i-detenuti-al-41-bis-la-rieducazione-non-si-fa-w8r72amq"}, {"s": "posizione-2024-07-10-michele-passione-41-bis", "d": "2024-07-10", "o": "favorevole", "chi": "Michele Passione", "can": "audizione", "x": "Secondo Passione il divieto anticipa con atto ministeriale una valutazione di pericolosità che spetta al giudice caso per caso; è una scelta politica senza urgenza; propone di sopprimere l'art. 7.", "k": ["reati-gravi"], "f": "M. Passione, «Ancora a proposito del ddl n. 1183 in materia di diritto penitenziario», Sistema Penale, 2024-07-17", "u": "https://sistemapenale.it/it/documenti/passione-ancora-a-proposito-del-ddl-n-1183-in-matera-di-diritto-penitenziario"}, {"s": "posizione-2024-07-10-fabio-gianfilippi-41-bis", "d": "2024-07-10", "o": "favorevole", "chi": "Fabio Gianfilippi", "can": "articolo", "x": "Secondo Gianfilippi la lett. f-bis introduce una preclusione assoluta senza vaglio caso per caso, con criticità costituzionali; il divieto nasce da un decreto ministeriale ma ha effetti processuali.", "k": ["reati-gravi"], "f": "F. Gianfilippi, «Il decreto-legge 4 luglio 2024 n. 92 \"Carcere sicuro\" e le attese del mondo penitenziario», Giustizia Insieme, 2024-07-10", "u": "https://giustiziainsieme.it/print/articolo_pdf?id=3201"}, {"s": "posizione-2024-07-18-marco-pelissero-41-bis", "d": "2024-07-18", "o": "favorevole", "chi": "Marco Pelissero", "can": "articolo", "x": "Secondo Pelissero il d.l. risolve in via presuntiva, a favore dell'esclusione, il conflitto tra decreto ministeriale e valutazione del giudice; la questione andrebbe affidata alla riserva di giurisdizione.", "k": ["reati-gravi"], "f": "M. Pelissero, «La pervicace volontà di non affrontare i nodi dell'emergenza carceraria», Sistema Penale, 2024-07-18", "u": "https://sistemapenale.it/it/opinioni/pelissero-la-pervicace-volonta-di-non-affrontare-i-nodi-dellemergenza-carceraria"}, {"s": "posizione-2025-06-09-lara-fortuna-41-bis", "d": "2025-06-09", "o": "favorevole", "chi": "Lara Fortuna", "can": "articolo", "x": "Secondo Fortuna il divieto di accesso ai programmi per i detenuti al 41-bis è privo del requisito dell'urgenza.", "k": ["reati-gravi"], "f": "L. Fortuna, «Il decreto-legge \"carcere sicuro\", n. 92/2024», Questione Giustizia 3/2025, pp. 117 ss.", "u": "https://www.questionegiustizia.it/data/rivista/articoli/1296/3_2025_qg_fortuna.pdf"}, {"s": "posizione-2023-10-eriberto-rosso-volontarieta", "d": "2023-10", "o": "critica", "chi": "Eriberto Rosso", "can": "documento", "x": "Secondo Eriberto Rosso, Segretario UCPI, nella fase della cognizione deve prevalere la presunzione d'innocenza; volontarietà del percorso significa che nessuna forzatura è possibile da parte del PM o del giudice prima che la responsabilità sia accertata in modo irrevocabile.", "k": ["invio", "innocenza"], "f": "UCPI, Relazione del Segretario E. Rosso, XIX Congresso ordinario, Firenze, 6-8 ottobre 2023", "u": "https://camerepenali.it/public/file/Congresso/2023_Firenze/RELAZIONE-del-Segretario-CONGRESSO-FIRENZE_def.pdf"}, {"s": "posizione-2025-02-alessandro-traversi-art-129-bis", "d": "2025-02", "o": "critica", "chi": "Alessandro Traversi", "can": "articolo", "x": "Secondo Alessandro Traversi, l'invio ai programmi disposto d'ufficio dal giudice (art. 129-bis c.p.p.) potrebbe essere costituzionalmente illegittimo, anche per eccesso di delega rispetto al consenso libero e informato; il giudice che dispone l'invio non dovrebbe poi giudicare l'imputato, e l'esclusione del difensore dallo svolgimento dei programmi lede il diritto di difesa.", "k": ["invio", "innocenza", "percorso"], "f": "A. Traversi, «Giustizia riparativa: un ircocervo giuridico», Giurisprudenza Penale Web, 2025, n. 2", "u": "https://www.giurisprudenzapenale.com/wp-content/uploads/2025/02/Traversi_gp_2025_2.pdf"}, {"s": "posizione-2025-06-18-mario-pavone-ruolo-difensore", "d": "2025-06-18", "o": "critica", "chi": "Mario Pavone", "can": "articolo", "x": "Secondo l'avv. Mario Pavone, l'esclusione degli avvocati dalle attività di mediazione penale è una criticità del procedimento: il difensore non può assistere il cliente durante il programma, salvo i colloqui preliminari, e ciò solleva dubbi di legittimità rispetto all'art. 24 Cost.", "k": ["invio", "percorso"], "f": "M. Pavone, «Giustizia Riparativa e ruolo del difensore», news.avvocatoandreani.it, 2025-06-18", "u": "https://news.avvocatoandreani.it/articoli/giustizia-riparativa-ruolo-difensore-108163.html"}, {"s": "posizione-2026-01-giuseppe-ondei-centri", "d": "2026-01", "o": "critica", "chi": "Giuseppe Ondei", "can": "documento", "x": "Secondo la relazione 2026 della Corte d'appello di Milano, presentata dal Presidente Giuseppe Ondei, le richieste di accesso alla giustizia riparativa sono state pochissime nel distretto e le ammissioni molto inferiori alle richieste; tra le difficoltà ci sono l'assenza di centri autorizzati, la sospensione per tutto l'anno del centro del Comune di Monza per mancati finanziamenti e i problemi logistici dei tribunali minori come Lecco.", "k": ["invio", "risorse"], "f": "Corte d'appello di Milano (Presidente G. Ondei), Relazione per l'inaugurazione dell'anno giudiziario 2026, § 1.3.5, pp. 31-32", "u": "https://ca-milano.giustizia.it/resources/cms/documents/Relazione_Anno_Giudiziario_2026.pdf"}, {"s": "posizione-2026-01-giuseppe-ondei-accesso-codice-rosso", "d": "2026-01", "o": "critica", "chi": "Giuseppe Ondei", "can": "documento", "x": "Secondo la relazione 2026 della Corte d'appello di Milano, che riporta l'opinione dei giudici delle varie sedi del distretto, l'accesso alla giustizia riparativa prima della definizione dei procedimenti è prematuro, in particolare nei casi di «codice rosso», per la tutela dell'incolumità della vittima e per la genuinità della prova; le sezioni che trattano soggetti deboli segnalano rigetti frequenti per evitare la vittimizzazione secondaria.", "k": ["invio", "vittime", "violenza-di-genere"], "f": "Corte d'appello di Milano (Presidente G. Ondei), Relazione per l'inaugurazione dell'anno giudiziario 2026, § 1.3.5, pp. 31-32", "u": "https://ca-milano.giustizia.it/resources/cms/documents/Relazione_Anno_Giudiziario_2026.pdf"}, {"s": "posizione-2025-01-25-giovanni-gagliotta-minori-taranto", "d": "2025-01-25", "o": "critica", "chi": "Giovanni Gagliotta", "can": "documento", "x": "Secondo l'intervento 2025 del Procuratore generale f.f. presso la Corte d'appello di Lecce, Giovanni Gagliotta, nella parte sulla Procura per i minorenni di Taranto, il Servizio di mediazione penale e giustizia riparativa attivo a Taranto dal 2019-09-02 ha subito una «battuta d'arresto» da gennaio 2023, perché il contratto con la società che lo forniva, scaduto a dicembre 2022, non è stato rinnovato in previsione dell'entrata in vigore della riforma.", "k": ["risorse", "minori"], "f": "Procura generale presso la Corte d'appello di Lecce (PG f.f. G. Gagliotta), Intervento per l'inaugurazione dell'anno giudiziario 2025, 2025-01-25, pp. 30-31", "u": "https://pg-lecce.giustizia.it/cmsresources/cms/documents/Inaugurazione%202025.pdf"}, {"s": "posizione-2023-06-27-adonella-presutti-art-129-bis", "d": "2023-06-27", "o": "critica", "chi": "Adonella Presutti", "can": "articolo", "x": "Secondo Adonella Presutti, un intervento autoritativo per l'accesso alla giustizia riparativa appare in contraddizione con il suo carattere consensuale, e l'iniziativa del pubblico ministero si presta più facilmente a diventare strumento di coazione; chiede che il difensore assista l'imputato nella fase della decisione, ma respinge l'eliminazione dell'iniziativa del giudice e la modifica dell'art. 58 proposte dall'UCPI.", "k": ["invio", "innocenza", "percorso"], "f": "A. Presutti, «La giustizia riparativa alla prova del giusto processo penale», Sistema Penale, 2023-06-27", "u": "https://sistemapenale.it/pdf_contenuti/1687851605_presutti-giustizia-riparativa-giusto-processo.pdf"}, {"s": "posizione-2023-11-francesco-cingari-art-129-bis", "d": "2023-11", "o": "critica", "chi": "Francesco Cingari", "can": "articolo", "x": "Secondo Francesco Cingari, il potere del giudice di inviare d'ufficio le parti ai Centri esprime una visione paternalistica e statalista, incoerente con il carattere consensuale della giustizia riparativa; in caso di esito negativo la relazione del mediatore può condizionare il giudice, la disciplina del controllo giudiziario sull'esito (artt. 57-58) è poco chiara e il risultato della riforma dipende da risorse, organizzazione e formazione.", "k": ["invio", "percorso", "effetti", "risorse"], "f": "F. Cingari, «La giustizia riparativa nella riforma Cartabia», Sistema Penale, 2023-11", "u": "https://sistemapenale.it/pdf_contenuti/1700667587_004-cingari.pdf"}, {"s": "posizione-2023-09-05-pierpaolo-dell-anno-presunzione-innocenza", "d": "2023-09-05", "o": "critica", "chi": "Pierpaolo Dell'Anno", "can": "articolo", "x": "Secondo Pierpaolo Dell'Anno, l'accesso ai programmi senza limiti di tempo e il riconoscimento dei fatti essenziali possono entrare in tensione con la presunzione di non colpevolezza e con il diritto al silenzio; la presenza del difensore non è pienamente garantita e una valorizzazione eccessiva della vittima rischia di destabilizzare la struttura triadica del processo.", "k": ["principi", "innocenza", "percorso"], "f": "P. Dell'Anno, «La giustizia riparativa sotto la lente di ingrandimento della Carta costituzionale: prime osservazioni», Dirittifondamentali.it, 3/2023 (copia nell'archivio istituzionale di Tor Vergata)", "u": "https://art.torvergata.it/retrieve/792feda4-d584-4411-b61c-535fdb68f321/Dell-Anno-La-giustizia-riparativa-sotto-la-lente-di-ingrandimento-della-Carta-costituzionale-prime-osservazioni-1.pdf"}, {"s": "posizione-2022-11-03-dario-guidi-presunzione-innocenza", "d": "2022-11-03", "o": "critica", "chi": "Dario Guidi", "can": "convegno", "x": "Secondo Dario Guidi, la valutazione di utilità richiesta al giudice dall'art. 129-bis c.p.p. presuppone una colpevolezza non ancora accertata e il giudice che invia le parti non è soggetto a incompatibilità; il contenuto della relazione del mediatore non è delimitato, con il rischio di aggirare l'inutilizzabilità delle dichiarazioni, e il difensore è previsto solo in fasi marginali.", "k": ["invio", "innocenza", "percorso"], "f": "D. Guidi, «Profili processuali della giustizia riparativa», intervento al corso della Camera penale di Firenze, 2022-11-03 (copia nell'archivio istituzionale dell'Università di Siena)", "u": "https://usiena-air.unisi.it/retrieve/01aa2268-eaa1-4b8e-b003-c013297dbb11/Guidi-Profili-processuali-della-giustizia-riparativa.pdf"}, {"s": "posizione-2021-giuseppe-mosconi-principi", "d": "2021", "o": "critica", "chi": "Giuseppe Mosconi", "can": "articolo", "x": "Secondo Giuseppe Mosconi, la giustizia riparativa rischia di essere riassorbita nel sistema penale e penitenziario e di essere strumentalizzata per rafforzare la penalità; il principio della legge delega 134/2021 per cui il fallimento del programma non produce effetti negativi potrebbe preludere a un processo penale lasciato sostanzialmente intatto.", "k": ["principi", "effetti"], "f": "G. Mosconi, «La giustizia riparativa tra funzionalità del diritto penale e alternatività di paradigmi», Antigone, XVI, 2/2021, pp. 123-152 (copia sul sito AIS)", "u": "https://www.ais-sociologia.it/wp-content/uploads/2023/05/09_Mosconi.pdf"}, {"s": "posizione-2023-anna-lorenzetti-riservatezza-volontarieta", "d": "2023", "o": "critica", "chi": "Anna Lorenzetti", "can": "articolo", "x": "Secondo Anna Lorenzetti, la riservatezza non si concilia facilmente con la relazione destinata al giudice e non è chiaro come si garantisca la volontarietà davanti a un invio d'ufficio; prevede una burocratizzazione della giustizia riparativa, il rischio che l'esito riparativo sia inteso come ristoro civilistico e, nella violenza di genere, il rischio di riprodurre la gerarchia tra i generi.", "k": ["invio", "percorso", "violenza-di-genere"], "f": "A. Lorenzetti, «La riforma Cartabia, fra ottimismo della volontà e pessimismo della ragione», AmbienteDiritto.it, XXIII, 4/2023", "u": "https://ambientediritto.it/wp-content/uploads/2023/12/LA-RIFORMA-CARTABIA-FRA-OTTIMISMO-DELLA-VOLONTA-E-PESSIMISMO-DELLA-RAGIONE._Lorenzetti.pdf"}, {"s": "posizione-2023-emma-venafro-servizi-vittime", "d": "2023", "o": "critica", "chi": "Emma Venafro", "can": "articolo", "x": "Secondo Emma Venafro, la riforma non ha incrementato i servizi di assistenza alle vittime e i Centri per la giustizia riparativa se ne occupano solo dopo l'inizio del processo; sarebbe stato preferibile sospendere i termini di querela per i programmi avviati prima della querela.", "k": ["invio", "risorse"], "f": "E. Venafro, «Giustizia riparativa e sistema penale alla luce della riforma Cartabia», La Legislazione Penale, 4/2023 (copia nell'archivio istituzionale dell'Università di Pisa)", "u": "https://arpi.unipi.it/retrieve/a55dfd11-b395-449f-932d-6a2b809a33f2/Legislazione%20penale%20_Venafro.pdf"}, {"s": "posizione-2024-lucia-re-violenza-di-genere", "d": "2024", "o": "critica", "chi": "Lucia Re", "can": "articolo", "x": "Secondo Lucia Re, che riprende la critica degli attivisti della giustizia trasformativa, chi pratica la giustizia riparativa si è fatto cooptare dal sistema penale, soprattutto dove la riparazione è integrata nell'esecuzione della pena, come in Italia; le soluzioni riparative sono per lo più individualizzate e non devono servire a semplificare il processo né sostituire interventi di welfare.", "k": ["principi", "violenza-di-genere", "risorse"], "f": "L. Re, «Violenza basata sul genere e \"giustizia trasformativa\". Un'alternativa al sistema penale?», La Legislazione Penale, 2024 (copia nell'archivio istituzionale dell'Università di Firenze)", "u": "https://flore.unifi.it/retrieve/adb945f1-b746-46c3-ac60-cfccec59c87e/Re-LP-rev-Lucia-Re%20%281%29.pdf"}, {"s": "posizione-2024-02-23-giovanni-fiandaca-principi", "d": "2024-02-23", "o": "critica", "chi": "Giovanni Fiandaca", "can": "articolo", "x": "Secondo Giovanni Fiandaca, il modello di giustizia riparativa del d.lgs. 150/2022 presuppone una visione irenica e aconflittuale della società; la sua compatibilità con una lettura laica del principio rieducativo è problematica e la nozione di esito riparativo è generica.", "k": ["principi", "effetti"], "f": "G. Fiandaca, «La giustizia riparativa di Cartabia è compatibile con uno stato laico?», Domani, 2024-02-23 (estratto dal libro «Punizione», Il Mulino, 2024)", "u": "https://www.editorialedomani.it/giustizia/la-giustizia-riparativa-di-cartabia-e-compatibile-col-principio-laico-della-funzione-rieducativa-della-pena-mothkmbm"}, {"s": "posizione-2023-09-22-familiari-maltesi-caso-fontana", "d": "2023-09-22", "o": "critica", "chi": "Padre della vittima", "can": "articolo", "x": "Secondo l'avvocata di parte civile Manuela Scalia, il padre della vittima si dice «sconvolto e schifato» da una giustizia che ammette al percorso l'autore reo confesso dell'omicidio; lui e tutti i familiari non vogliono in alcun modo incontrare Davide Fontana.", "k": ["invio", "violenza-di-genere", "reati-gravi"], "f": "L'Unione Sarda, «L'omicidio di Carol Maltesi, Fontana ammesso alla giustizia riparativa. Il padre della vittima: \"Sconvolto e schifato\"», 2023-09-22", "u": "https://www.unionesarda.it/news/italia/lomicidio-di-carol-maltesi-fontana-ammesso-alla-giustizia-riparativa-il-padre-della-vittima-sconvolto-e-schifato-rpu5z9h0"}, {"s": "posizione-2025-07-09-genitori-tramontano-opposizione", "d": "2025-07-09", "o": "critica", "chi": "Genitori della vittima", "can": "articolo", "x": "Secondo quanto riferisce Open, la difesa di Alessandro Impagnatiello ha chiesto un programma con vittima surrogata perché i genitori della vittima si erano opposti al percorso.", "k": ["invio", "violenza-di-genere", "reati-gravi"], "f": "Open, femminicidio Tramontano, negata la giustizia riparativa a Impagnatiello, 2025-07-09", "u": "https://www.open.online/2025/07/09/femminicidio-tramontano-negata-giustizia-riparativa-impagnatiello/"}, {"s": "posizione-2026-06-08-domenico-marzi-caso-monteiro-duarte", "d": "2026-06-08", "o": "critica", "chi": "Domenico Marzi", "can": "articolo", "x": "Secondo l'avvocato Domenico Marzi, legale della famiglia della vittima, la richiesta di giustizia riparativa di Gabriele Bianchi non poteva incidere sulla pena: la sanzione e il percorso rieducativo sono piani distinti.", "k": ["reati-gravi", "effetti"], "f": "Libero, Willy Monteiro: ergastolo a Gabriele Bianchi, «le scuse non bastano», 2026-06-08", "u": "https://www.liberoquotidiano.it/news/italia/48081323/willy-monteiro-ergastolo-gabriele-bianchi-scuse-non-bastano.amp"}, {"s": "posizione-2026-07-07-familiari-del-pozzo-opposizione", "d": "2026-07-07", "o": "critica", "chi": "Padre e nonni paterni della vittima", "can": "articolo", "x": "Secondo L'Adige, il padre e i nonni paterni della vittima, con l'avvocata di parte civile Barbara Ronsisvalle, si sono opposti alla richiesta di Martina Patti di accedere alla giustizia riparativa e hanno rifiutato il confronto con lei; la Corte l'ha ammessa con una vittima surrogata.", "k": ["invio", "reati-gravi", "minori"], "f": "L'Adige, «Uccise la figlia e finse sequestro, ammessa a giustizia riparativa», 2026-07-07", "u": "https://www.ladige.it/attualita/uccise-la-figlia-e-finse-sequestro-ammessa-a-giustizia-riparativa-kwjx8l9x"}, {"s": "posizione-2026-07-24-familiari-mastrapasqua-caso-rezza", "d": "2026-07-24", "o": "critica", "chi": "Madre e fratelli della vittima", "can": "articolo", "x": "Secondo Il Giorno, la madre e i fratelli della vittima hanno vissuto le scuse di Daniele Rezza, ammesso alla giustizia riparativa, come una «oltraggiosa provocazione»; il fratello ha detto che le scuse chieste dopo un anno non valgono niente.", "k": ["invio", "reati-gravi"], "f": "Il Giorno, caso Rezza: giustizia riparativa e reazione dei familiari, 2026-07-24", "u": "https://www.ilgiorno.it/milano/cronaca/daniele-rezza-giustizia-riparativa-c9y7cbc9"}, {"s": "posizione-2025-01-29-parti-civili-ravasio-prematuro", "d": "2025-01-29", "o": "critica", "chi": "Avvocati di parte civile dei genitori della vittima", "can": "articolo", "x": "Secondo gli avvocati di parte civile nel caso dell'omicidio della vittima, i loro assistiti non hanno dato alcun consenso al percorso di giustizia riparativa chiesto da un'imputata, e il percorso è prematuro.", "k": ["invio", "reati-gravi"], "f": "Il Giorno, «Delitto Ravasio, gli scenari: la richiesta», 2025-01-29", "u": "https://www.ilgiorno.it/legnano/cronaca/delitto-ravasio-gli-scenari-richiesta-7becdb38"}, {"s": "posizione-2023-09-27-uil-esclusione-reati-genere", "d": "2023-09-27", "o": "critica", "chi": "UIL - Unione Italiana del Lavoro", "can": "audizione", "x": "Secondo la memoria della UIL per l'audizione in II Commissione Giustizia della Camera sui ddl contro la violenza sulle donne, le disposizioni sul programma di mediazione dell'art. 42 del d.lgs. 150/2022 non dovrebbero applicarsi a maltrattamenti, violenza sessuale anche di gruppo, atti sessuali con minorenne, corruzione di minorenne, atti persecutori e ad alcune lesioni aggravate.", "k": ["invio", "violenza-di-genere", "reati-gravi", "minori"], "f": "UIL, memoria per l'audizione informale del 2023-09-27 in II Commissione Giustizia della Camera sui ddl contro la violenza sulle donne (A.C. 1294 e abbinati)", "u": "https://documenti.camera.it/leg19/documentiAcquisiti/COM02/Audizioni/leg19.com02.Audizioni.Memoria.PUBBLICO.ideGes.19237.02-10-2023-11-06-28.949.pdf"}, {"s": "posizione-2025-09-19-gino-cecchettin-reati-gravi", "d": "2025-09-19", "o": "critica", "chi": "Gino Cecchettin", "can": "intervista", "x": "Secondo Gino Cecchettin, la giustizia riparativa deve partire dalla consapevolezza e dalle scuse, che da Filippo Turetta non sono arrivate; in vista dell'appello gli sembra troppo tardi e il percorso non deve diventare uno strumento per ottenere uno sconto di pena.", "k": ["violenza-di-genere", "reati-gravi", "effetti"], "f": "F. Garau, «\"È troppo tardi...\". Il \"no\" di Gino Cecchettin alla giustizia riparativa per Filippo Turetta», Il Giornale, 2025-09-19", "u": "https://www.ilgiornale.it/news/cronaca-giudiziaria/gino-cecchettin-e-giustizia-riparativa-filippo-turetta-2539283.html"}, {"s": "posizione-2026-07-10-guido-vitiello-vittima-surrogata", "d": "2026-07-10", "o": "critica", "chi": "Guido Vitiello", "can": "articolo", "x": "Secondo Guido Vitiello, l'ammissione al programma di una donna condannata per l'omicidio della figlia, con una vittima surrogata delegata dai parenti, richiama la logica della sostituzione dei riti sacrificali antichi; condivide in parte la critica di «maligno psicologismo» dell'avvocato Vincenzo Vitale.", "k": ["principi", "percorso", "reati-gravi"], "f": "G. Vitiello, «Il processo penale è edificato sul terreno del rito sacrificale», Il Foglio, rubrica «Il bi e il ba», 2026-07-10", "u": "https://ilfoglio.it/rubriche/il-bi-e-il-ba/2026/07/10/news/il-processo-penale-e-edificato-sul-terreno-del-rito-sacrificale--401905"}, {"s": "posizione-2026-07-07-claudia-osmetti-effetti", "d": "2026-07-07", "o": "critica", "chi": "Claudia Osmetti", "can": "articolo", "x": "Secondo Claudia Osmetti, il peso della giustizia riparativa è quasi simbolico, nessuna regola stabilisce il numero degli incontri e l'esito non è garantito per nessuna delle parti.", "k": ["percorso", "effetti"], "f": "C. Osmetti, «Cos'è la giustizia riparativa», Libero, 2026-07-07", "u": "https://www.liberoquotidiano.it/news/giustizia/48457018/giustizia-riparativa/"}, {"s": "posizione-2025-08-20-gabriele-colasanti-centri", "d": "2025-08-20", "o": "critica", "chi": "Gabriele Colasanti", "can": "intervista", "x": "Secondo l'avvocato Gabriele Colasanti, l'assenza di strutture pubbliche nel circondario di Roma compromette un diritto previsto dalla legge e l'istituto è rimasto inattuato.", "k": ["risorse"], "f": "M. Roberti, «Riparare, un'altra via di giustizia», L'Espresso, 2025-08-20", "u": "https://lespresso.it/c/attualita/2025/8/20/giustizia-riparativa-rieducazione-condannato/56189"}, {"s": "posizione-2021-10-29-marco-bouchard-riconoscimento-fatti", "d": "2021-10-29", "o": "critica", "chi": "Marco Bouchard", "can": "articolo", "x": "Secondo Marco Bouchard, la giustizia riparativa richiede il riconoscimento dei fatti da parte dell'autore del reato, requisito che manca nella legge delega della riforma Cartabia.", "k": ["principi", "invio"], "f": "M. Bouchard, «Qualche parola di giustizia per le vittime», Domani, 2021-10-29", "u": "https://www.editorialedomani.it/giustizia/qualche-parola-di-giustizia-per-le-vittime-a6cbjr1c"}, {"s": "posizione-2024-01-31-valentina-dorso-consenso-vittima", "d": "2024-01-31", "o": "critica", "chi": "Valentina D'Orso", "can": "audizione", "x": "Secondo la deputata Valentina D'Orso (M5S), intervenuta in II Commissione Giustizia della Camera sull'A.G. 102, il consenso della vittima dovrebbe essere condizione necessaria per l'accesso ai programmi ex art. 129-bis c.p.p.; i commi 1 e 3 vanno in senso opposto (avvio d'ufficio del giudice, audizione della vittima solo eventuale) e lo schema correttivo è un'occasione persa per questa modifica.", "k": ["invio", "vittime"], "f": "Camera dei deputati, II Commissione Giustizia, Bollettino n
