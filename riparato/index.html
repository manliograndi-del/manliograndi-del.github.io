(«Group 1»)"}, {"re": "miscellaneous (altri)", "n": "—", "pc": "5", "tot": "non dichiarato", "per": "2019 (periodi diversi tra servizi)", "am": "adulti e minori (non separati)", "doc": "restorativejustice.ie, «Overview of Group 1»", "s": "Irlanda, sei servizi di giustizia riparativa («Group 1»)"}], "n": "La fonte dichiara che i servizi classificano i reati in modi diversi e con periodi diversi (cifre approssimative) e collega la quota dei reati stradali al programma di sicurezza stradale di Restorative Justice Services (in parafrasi)."}, {"p": "C", "t": "Inghilterra: un servizio locale (Essex), 2022/23", "r": [{"re": "neighbour disputes (liti di vicinato)", "n": "—", "pc": "41", "tot": "262 invii", "per": "2022/23", "am": "non separati", "doc": "ERMS Annual Report 2022/23, p. 7", "s": "Inghilterra, Essex Restorative and Mediation Service (servizio locale del PFCC)"}, {"re": "violent offences (reati violenti)", "n": "—", "pc": "32", "tot": "262 invii", "per": "2022/23", "am": "non separati", "doc": "ERMS Annual Report 2022/23, p. 7", "s": "Inghilterra, Essex Restorative and Mediation Service (servizio locale del PFCC)"}, {"re": "harassment (molestie)", "n": "—", "pc": "8", "tot": "262 invii", "per": "2022/23", "am": "non separati", "doc": "ERMS Annual Report 2022/23, p. 7", "s": "Inghilterra, Essex Restorative and Mediation Service (servizio locale del PFCC)"}, {"re": "sexual offences (reati sessuali)", "n": "3", "pc": "—", "tot": "262 invii", "per": "2022/23", "am": "non separati", "doc": "ERMS Annual Report 2022/23, p. 7", "s": "Inghilterra, Essex Restorative and Mediation Service (servizio locale del PFCC)"}, {"re": "domestic abuse (abusi domestici)", "n": "10", "pc": "—", "tot": "262 invii", "per": "2022/23", "am": "non separati", "doc": "ERMS Annual Report 2022/23, p. 7", "s": "Inghilterra, Essex Restorative and Mediation Service (servizio locale del PFCC)"}, {"re": "hate crime (reati d'odio)", "n": "24", "pc": "—", "tot": "262 invii", "per": "2022/23", "am": "non separati", "doc": "ERMS Annual Report 2022/23, p. 7", "s": "Inghilterra, Essex Restorative and Mediation Service (servizio locale del PFCC)"}], "n": "Il servizio tratta anche mediazione non penale (35% degli invii). Anno precedente: molestie 14%, reati sessuali 14 invii. Nessuna statistica nazionale per reato trovata per Inghilterra e Galles."}], "articoli": [{"n": "42", "rubrica": "Definizioni", "coll": "Capo I, Sezione I", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art42", "testo": ["1. Ai fini del presente decreto si intende per:", "a) giustizia riparativa: ogni programma che consente alla vittima del reato, alla persona indicata come autore dell'offesa e ad altri soggetti appartenenti alla comunità di partecipare liberamente, in modo consensuale, attivo e volontario, alla risoluzione delle questioni derivanti dal reato, con l'aiuto di un terzo imparziale, adeguatamente formato, denominato mediatore;", "b) vittima del reato: la persona fisica che ha subito direttamente dal reato qualunque danno patrimoniale o non patrimoniale, nonché il familiare della persona fisica la cui morte è stata causata dal reato e che ha subito un danno in conseguenza della morte di tale persona;", "c) persona indicata come autore dell'offesa: 1) la persona indicata come tale dalla vittima, anche prima della proposizione della querela; 2) la persona sottoposta alle indagini; 3) l'imputato; 4) la persona sottoposta a misura di sicurezza personale; 5) la persona condannata con pronuncia irrevocabile; 6) la persona nei cui confronti è stata emessa una sentenza di non luogo a procedere o di non doversi procedere, per difetto della condizione di procedibilità, anche ai sensi dell'articolo 344-bis del codice di procedura penale, o per intervenuta causa estintiva del reato;", "d) familiare: il coniuge, la parte di un'unione civile ai sensi dell'articolo 1, comma 2, della legge 20 maggio 2016, n. 76, il convivente di fatto di cui all'articolo 1, comma 36, della stessa legge, la persona che è legata alla vittima o alla persona indicata come autore dell'offesa da un vincolo affettivo stabile, nonché i parenti in linea retta, i fratelli, le sorelle e le persone fiscalmente a carico della vittima o della persona indicata come autore dell'offesa;", "e) esito riparativo: qualunque accordo, risultante dal programma di giustizia riparativa, volto alla riparazione dell'offesa e idoneo a rappresentare l'avvenuto riconoscimento reciproco e la possibilità di ricostruire la relazione tra i partecipanti;", "f) servizi per la giustizia riparativa: tutte le attività relative alla predisposizione, al coordinamento, alla gestione e all'erogazione di programmi di giustizia riparativa;", "g) Centro per la giustizia riparativa: la struttura pubblica di cui al capo V, sezione II, cui competono le attività necessarie all'organizzazione, gestione, erogazione e svolgimento dei programmi di giustizia riparativa.", "2. I diritti e le facoltà attribuite alla vittima del reato sono riconosciuti anche al soggetto giuridico offeso dal reato."], "note": "Note di Normattiva all'art. 42 (estremi): art. 344-bis c.p.p. (rinvio alle note all'art. 16); l. 20 maggio 2016, n. 76, art. 1, commi 2 e 36.", "slug": "norma-2022-dlgs-150-art-42", "descr": "Definisce giustizia riparativa, vittima del reato, persona indicata come autore dell'offesa, familiare, esito riparativo, servizi per la giustizia riparativa e Centro per la giustizia riparativa. Il comma 2 riconosce i diritti e le facoltà della vittima anche al soggetto giuridico offeso dal reato.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["concetto-giustizia-riparativa", "concetto-vittima-del-reato", "concetto-persona-indicata-come-autore-dell-offesa", "concetto-familiare", "concetto-esito-riparativo", "concetto-servizi-per-la-giustizia-riparativa", "organizzazione-centri-giustizia-riparativa", "concetto-mediatore-esperto", "concetto-vittima-surrogata", "norma-2012-direttiva-ue-2012-29", "norma-cpp-art-90-bis-1", "norma-cpp-art-129-bis", "norma-2022-dlgs-150-art-92", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "43", "rubrica": "Principi generali e obiettivi", "coll": "Capo I, Sezione I", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art43", "testo": ["1. La giustizia riparativa in materia penale si conforma ai seguenti principi: a) la partecipazione attiva e volontaria della persona indicata come autore dell'offesa e della vittima del reato e degli altri eventuali partecipanti alla gestione degli effetti pregiudizievoli causati dall'offesa; b) l'equa considerazione dell'interesse della vittima del reato e della persona indicata come autore dell'offesa; c) il coinvolgimento della comunità nei programmi di giustizia riparativa; d) il consenso alla partecipazione ai programmi di giustizia riparativa; e) la riservatezza sulle dichiarazioni e sulle attività svolte nel corso dei programmi di giustizia riparativa; f) la ragionevolezza e proporzionalità degli eventuali esiti riparativi consensualmente raggiunti; g) l'indipendenza dei mediatori e la loro equiprossimità rispetto ai partecipanti ai programmi di giustizia riparativa; h) la garanzia del tempo necessario allo svolgimento di ciascun programma.", "2. I programmi di giustizia riparativa tendono a promuovere il riconoscimento della vittima del reato, la responsabilizzazione della persona indicata come autore dell'offesa e la ricostituzione dei legami con la comunità.", "3. L'accesso ai programmi di giustizia riparativa è assicurato ai soggetti che vi hanno interesse con le garanzie previste dal presente decreto ed è gratuito.", "4. L'accesso ai programmi di giustizia riparativa è sempre favorito, senza discriminazioni e nel rispetto della dignità di ogni persona. Può essere limitato soltanto in caso di pericolo concreto per i partecipanti, derivante dallo svolgimento del programma."], "note": "Note di Normattiva: nessuna.", "slug": "norma-2022-dlgs-150-art-43", "descr": "Elenca otto principi (partecipazione attiva e volontaria, equa considerazione degli interessi, coinvolgimento della comunità, consenso, riservatezza, ragionevolezza e proporzionalità degli esiti, indipendenza ed equiprossimità dei mediatori, tempo necessario), gli obiettivi dei programmi, la gratuità dell'accesso e il solo limite del pericolo concreto per i partecipanti.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["concetto-giustizia-riparativa", "concetto-equiprossimita", "concetto-esito-riparativo", "concetto-mediatore-esperto", "concetto-vittima-del-reato", "concetto-persona-indicata-come-autore-dell-offesa", "norma-2022-dlgs-150-art-42", "norma-2022-dlgs-150-art-48", "norma-2022-dlgs-150-art-50", "norma-2022-dlgs-150-art-51", "norma-2022-dlgs-150-art-52", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "44", "rubrica": "Principi sull'accesso", "coll": "Capo I, Sezione II", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art44", "testo": ["1. I programmi di giustizia riparativa disciplinati dal presente decreto sono accessibili senza preclusioni in relazione alla fattispecie di reato o alla sua gravità.", "2. Ai programmi di cui al comma 1 si può accedere in ogni stato e grado del procedimento penale, nella fase esecutiva della pena e della misura di sicurezza, dopo l'esecuzione delle stesse e all'esito di una sentenza di non luogo a procedere o di non doversi procedere, per difetto della condizione di procedibilità, anche ai sensi dell'articolo 344-bis del codice di procedura penale, o per intervenuta causa estintiva del reato.", "3. Qualora si tratti di delitti perseguibili a querela, ai programmi di cui al comma 1 si può accedere anche prima che la stessa sia stata proposta."], "note": "Note di Normattiva: nessuna.", "slug": "norma-2022-dlgs-150-art-44", "descr": "Rende i programmi accessibili senza preclusioni per tipo o gravità del reato, in ogni stato e grado del procedimento, nella fase esecutiva, dopo l'esecuzione e dopo sentenze di non luogo a procedere o di non doversi procedere; per i delitti a querela, anche prima della querela.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["concetto-giustizia-riparativa", "norma-2022-dlgs-150-art-43", "norma-cpp-art-129-bis", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "45", "rubrica": "Partecipanti ai programmi di giustizia riparativa", "coll": "Capo I, Sezione II", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art45", "testo": ["1. Possono partecipare ai programmi di giustizia riparativa, con le garanzie di cui al presente decreto: a) la vittima del reato; b) la persona indicata come autore dell'offesa; c) altri soggetti appartenenti alla comunità, quali familiari della vittima del reato e della persona indicata come autore dell'offesa, persone di supporto segnalate dalla vittima del reato e dalla persona indicata come autore dell'offesa, enti ed associazioni rappresentativi di interessi lesi dal reato, rappresentanti o delegati di Stato, Regioni, enti locali o di altri enti pubblici, autorità di pubblica sicurezza, servizi sociali; d) chiunque altro vi abbia interesse."], "note": "Note di Normattiva: nessuna.", "slug": "norma-2022-dlgs-150-art-45", "descr": "Indica chi può partecipare ai programmi: la vittima del reato, la persona indicata come autore dell'offesa, altri soggetti della comunità (familiari, persone di supporto, enti e associazioni, rappresentanti di enti pubblici, autorità di pubblica sicurezza, servizi sociali) e chiunque altro vi abbia interesse.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["concetto-vittima-del-reato", "concetto-persona-indicata-come-autore-dell-offesa", "concetto-familiare", "norma-2022-dlgs-150-art-42", "norma-2022-dlgs-150-art-47", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "46", "rubrica": "Diritti e garanzie per le persone minori di età", "coll": "Capo I, Sezione III", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art46", "testo": ["1. Nello svolgimento dei programmi di giustizia riparativa che coinvolgono a qualsiasi titolo persone minori di età, le disposizioni del presente decreto, in quanto compatibili, sono applicate in modo adeguato alla personalità e alle esigenze del minorenne, tenuto in considerazione il suo superiore interesse conformemente a quanto previsto dall'articolo 3, paragrafo 1, della Convenzione sui diritti del fanciullo del 20 novembre 1989, ratificata dalla legge 27 maggio 1991, n. 176.", "2. Allo svolgimento dei programmi di giustizia riparativa che coinvolgono a qualsiasi titolo persone minori di età sono assegnati mediatori dotati di specifiche attitudini, avuto riguardo alla formazione e alle competenze acquisite."], "note": "Note di Normattiva (estremi): l. 27 maggio 1991, n. 176 (ratifica della Convenzione sui diritti del fanciullo, New York, 1989-11-20), art. 3, par. 1.", "slug": "norma-2022-dlgs-150-art-46", "descr": "Applica le disposizioni del decreto, in quanto compatibili, in modo adeguato alla personalità e alle esigenze del minorenne e al suo superiore interesse (art. 3, par. 1, Convenzione ONU sui diritti del fanciullo); assegna ai programmi con minori mediatori con specifiche attitudini.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["concetto-mediatore-esperto", "norma-2022-dlgs-150-art-48", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "47", "rubrica": "Diritto all'informazione", "coll": "Capo II, Sezione I", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art47", "testo": ["1. La persona indicata come autore dell'offesa e la vittima del reato vengono informate senza ritardo da parte dell'autorità giudiziaria, in ogni stato e grado del procedimento penale o all'inizio dell'esecuzione della pena detentiva o della misura di sicurezza, in merito alla facoltà di accedere ai programmi di giustizia riparativa e ai servizi disponibili.", "2. L'informazione di cui al comma 1 è altresì fornita agli interessati dagli istituti e servizi, anche minorili, del Ministero della giustizia, dai servizi sociali del territorio, dai servizi di assistenza alle vittime, dall'autorità di pubblica sicurezza, nonché da altri operatori che a qualsiasi titolo sono in contatto con i medesimi soggetti.", "3. I soggetti di cui all'articolo 45 hanno diritto di ricevere dai mediatori una informazione effettiva, completa e obiettiva sui programmi di giustizia riparativa disponibili, sulle modalità di accesso e di svolgimento, sui potenziali esiti e sugli eventuali accordi tra i partecipanti. Vengono inoltre informati in merito alle garanzie e ai doveri previsti nel presente decreto.", "4. Le informazioni di cui al presente articolo sono fornite all'esercente la responsabilità genitoriale, al tutore, all'amministratore di sostegno, al curatore speciale nei casi di cui all'articolo 121 del codice penale, nonché ai difensori della vittima del reato e della persona indicata come autore dell'offesa, ove nominati.", "5. Le informazioni vengono fornite ai destinatari in una lingua comprensibile e in modo adeguato all'età e alle capacità degli stessi."], "note": "Note di Normattiva (estremi): art. 121 c.p. (diritto di querela esercitato da un curatore speciale).", "slug": "norma-2022-dlgs-150-art-47", "descr": "Obbliga l'autorità giudiziaria a informare senza ritardo vittima e persona indicata come autore dell'offesa sulla facoltà di accedere ai programmi; estende l'obbligo a servizi ministeriali, servizi sociali, servizi per le vittime e pubblica sicurezza; fissa i contenuti dell'informazione dei mediatori, i destinatari ulteriori e la lingua.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["concetto-vittima-del-reato", "concetto-persona-indicata-come-autore-dell-offesa", "concetto-mediatore-esperto", "norma-2022-dlgs-150-art-45", "norma-2022-dlgs-150-art-49", "norma-2022-dlgs-150-art-54", "norma-cpp-art-90-bis-1", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "48", "rubrica": "Consenso alla partecipazione ai programmi di giustizia riparativa", "coll": "Capo II, Sezione I", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art48", "testo": ["1. Il consenso alla partecipazione ai programmi di giustizia riparativa è personale, libero, consapevole, informato ed espresso in forma scritta. È sempre revocabile anche per fatti concludenti.", "2. Per la persona minore d'età che non ha compiuto gli anni quattordici, il consenso è espresso, previo ascolto e assenso della stessa, tenuto conto della sua capacità di discernimento, dall'esercente la responsabilità genitoriale o, nei casi di cui all'articolo 121 del codice penale, dal curatore speciale.", "3. Per la persona minore d'età che ha compiuto gli anni quattordici, il consenso è espresso dalla stessa e dall'esercente la responsabilità genitoriale o, nei casi di cui all'articolo 121 del codice penale, dal curatore speciale. Qualora l'esercente la responsabilità genitoriale o il curatore speciale non prestino il consenso, il mediatore, sentiti i soggetti interessati e considerato l'interesse della persona minore d'età, valuta se procedere sulla base del solo consenso di quest'ultima. Restano fermi i limiti inerenti alla capacità di agire del minore.", "4. Nel caso di interdetto giudiziale, il consenso è espresso dal tutore, sentito l'interdetto. Nel caso di inabilitato, il consenso è espresso dallo stesso e dal curatore. Nel caso di persona sottoposta ad amministrazione di sostegno, il consenso è espresso da quest'ultima, da sola o con l'assistenza dell'amministratore di sostegno, sulla base delle specifiche indicazioni contenute nei provvedimenti di cui agli articoli 405 e 407, comma 4, del codice civile.", "5. Il consenso per l'ente è espresso dal legale rappresentante pro tempore o da un suo delegato.", "6. Il consenso viene raccolto nel corso del primo incontro dal mediatore designato, alla presenza del difensore della vittima del reato e del difensore della persona indicata come autore dell'offesa, quando questi lo richiedono."], "note": "Note di Normattiva (estremi): art. 121 c.p.; artt. 405 e 407, comma 4, c.c.", "slug": "norma-2022-dlgs-150-art-48", "descr": "Richiede un consenso personale, libero, consapevole, informato, scritto e sempre revocabile; regola il consenso per minori di 14 anni e oltre, interdetti, inabilitati, persone in amministrazione di sostegno ed enti; il consenso è raccolto dal mediatore al primo incontro, con i difensori se lo chiedono.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["concetto-mediatore-esperto", "norma-2022-dlgs-150-art-43", "norma-2022-dlgs-150-art-46", "norma-2022-dlgs-150-art-47", "norma-2022-dlgs-150-art-54", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "49", "rubrica": "Diritto all'assistenza linguistica", "coll": "Capo II, Sezione I", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art49", "testo": ["1. La persona indicata come autore dell'offesa, la vittima del reato e gli altri partecipanti che non parlano o non comprendono la lingua italiana hanno diritto di farsi assistere gratuitamente da un interprete al fine di prendere parte consapevolmente ai programmi di giustizia riparativa.", "2. Negli stessi casi è disposta la traduzione della relazione del mediatore.", "3. La conoscenza della lingua italiana è presunta fino a prova contraria per chi sia cittadino italiano. L'impiego di una lingua diversa dalla lingua madre dell'interessato è consentito solo laddove l'interessato ne abbia una conoscenza sufficiente ad assicurare la partecipazione effettiva al programma. L'accertamento sulla conoscenza della lingua italiana è compiuto dal mediatore.", "4. L'interprete e il traduttore sono nominati anche quando il mediatore ha personale conoscenza della lingua o del dialetto da interpretare.", "5. Si applicano le disposizioni degli articoli 144 e 145 del codice di procedura penale, in quanto compatibili."], "note": "Note di Normattiva (estremi): artt. 144 e 145 c.p.p. (incapacità, incompatibilità, ricusazione e astensione dell'interprete).", "slug": "norma-2022-dlgs-150-art-49", "descr": "Garantisce l'interprete gratuito ai partecipanti che non parlano o non comprendono l'italiano e la traduzione della relazione del mediatore; presume la conoscenza dell'italiano per i cittadini italiani; ammette una lingua diversa dalla lingua madre se conosciuta a sufficienza; affida l'accertamento al mediatore.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["concetto-mediatore-esperto", "norma-2022-dlgs-150-art-47", "norma-2022-dlgs-150-art-57", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "50", "rubrica": "Dovere di riservatezza", "coll": "Capo II, Sezione II", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art50", "testo": ["1. I mediatori e il personale dei Centri per la giustizia riparativa sono tenuti alla riservatezza sulle attività e sugli atti compiuti, sulle dichiarazioni rese dai partecipanti e sulle informazioni acquisite per ragione o nel corso dei programmi di giustizia riparativa, salvo che vi sia il consenso dei partecipanti alla rivelazione, che il mediatore ritenga la rivelazione assolutamente necessaria per evitare la commissione di imminenti o gravi reati ovvero che le dichiarazioni integrino di per sé reato.", "2. I partecipanti sono tenuti a non divulgare le dichiarazioni rese e le informazioni acquisite nel corso del programma di giustizia riparativa prima della sua conclusione e della definizione del procedimento penale con sentenza o decreto penale irrevocabili.", "3. Dopo la conclusione del programma di giustizia riparativa e la definizione del procedimento penale con sentenza o decreto penale irrevocabili, la pubblicazione delle dichiarazioni e delle informazioni acquisite è ammessa con il consenso dell'interessato e nel rispetto della disciplina sulla protezione dei dati personali."], "note": "Note di Normattiva: nessuna.", "slug": "norma-2022-dlgs-150-art-50", "descr": "Obbliga mediatori e personale dei Centri alla riservatezza su atti, dichiarazioni e informazioni dei programmi, salvo consenso dei partecipanti, necessità di evitare reati imminenti o gravi, dichiarazioni che sono di per sé reato; vieta ai partecipanti di divulgare prima della fine del programma e del procedimento.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["concetto-mediatore-esperto", "organizzazione-centri-giustizia-riparativa", "norma-2022-dlgs-150-art-43", "norma-2022-dlgs-150-art-51", "norma-2022-dlgs-150-art-52", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "51", "rubrica": "Inutilizzabilità", "coll": "Capo II, Sezione II", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art51", "testo": ["1. Le dichiarazioni rese e le informazioni acquisite nel corso del programma non possono essere utilizzate nel procedimento penale e nella fase dell'esecuzione della pena, fatti salvi i contenuti della relazione di cui all'articolo 57 e fermo quanto disposto nell'articolo 50, comma 1."], "note": "Note di Normattiva: nessuna.", "slug": "norma-2022-dlgs-150-art-51", "descr": "Vieta l'uso, nel procedimento penale e nell'esecuzione, delle dichiarazioni rese e delle informazioni acquisite nel programma, salvi i contenuti della relazione del mediatore (art. 57) e i casi dell'art. 50, comma 1.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["norma-2022-dlgs-150-art-50", "norma-2022-dlgs-150-art-57", "norma-2022-dlgs-150-art-52", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "52", "rubrica": "Tutela del segreto", "coll": "Capo II, Sezione II", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art52", "testo": ["1. Il mediatore non può essere obbligato a deporre davanti all'autorità giudiziaria né a rendere dichiarazioni davanti ad altra autorità sugli atti compiuti, sui contenuti dell'attività svolta, nonché sulle dichiarazioni rese dai partecipanti e sulle informazioni apprese per ragione o nel corso del programma di giustizia riparativa, salvo che vi sia il consenso dei partecipanti alla rivelazione o il mediatore ritenga questa assolutamente necessaria per evitare la commissione di imminenti o gravi reati e quando le dichiarazioni integrino di per sé reato. Al mediatore si applicano, in quanto compatibili, le disposizioni dell'articolo 200 del codice di procedura penale.", "2. Presso i mediatori e nei luoghi in cui si svolge il programma di giustizia riparativa non si può procedere a sequestro di carte o documenti relativi all'oggetto del programma, salvo che costituiscano corpo del reato.", "3. Non è consentita l'intercettazione di conversazioni o comunicazioni nei luoghi in cui si svolge il programma di giustizia riparativa, né di conversazioni o comunicazioni dei mediatori che abbiano ad oggetto fatti conosciuti per ragione o nel corso del medesimo programma.", "4. I risultati dei sequestri e delle intercettazioni di conversazioni o comunicazioni eseguiti in violazione delle disposizioni di cui al presente articolo non possono essere utilizzati, salvo che costituiscano corpo di reato o, nel caso di intercettazioni, abbiano ad oggetto fatti sui quali i mediatori abbiano deposto o che gli stessi abbiano in altro modo divulgato.", "5. Il mediatore non ha obblighi di denuncia in relazione ai reati dei quali abbia avuto notizia per ragione o nel corso del programma di giustizia riparativa, salvo che vi sia il consenso dei partecipanti alla rivelazione, che il mediatore ritenga la rivelazione assolutamente necessaria per evitare la commissione di imminenti o gravi reati ovvero che le dichiarazioni integrino di per sé reato."], "note": "Note di Normattiva (estremi): art. 200 c.p.p. (segreto professionale).", "slug": "norma-2022-dlgs-150-art-52", "descr": "Esclude l'obbligo del mediatore di deporre o rendere dichiarazioni sul programma, salvo le eccezioni previste, e gli applica l'art. 200 c.p.p.; vieta sequestri di documenti presso i mediatori e intercettazioni nei luoghi del programma; rende inutilizzabili i risultati illegittimi; esclude l'obbligo di denuncia, salvo eccezioni.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["concetto-mediatore-esperto", "norma-2022-dlgs-150-art-50", "norma-2022-dlgs-150-art-51", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "53", "rubrica": "Programmi di giustizia riparativa", "coll": "Titolo IV, Capo III \"Programmi di giustizia riparativa\", Sezione I \"Svolgimento dei programmi di giustizia riparativa\"", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art53", "testo": ["1. I programmi di giustizia riparativa si conformano ai principi europei e internazionali in materia e vengono svolti da almeno due mediatori con le garanzie previste dal presente decreto. Essi comprendono:", "a) la mediazione tra la persona indicata come autore dell'offesa e la vittima del reato, anche estesa ai gruppi parentali, ovvero tra la persona indicata come autore dell'offesa e la vittima di un reato diverso da quello per cui si procede;", "b) il dialogo riparativo;", "c) ogni altro programma dialogico guidato da mediatori, svolto nell'interesse della vittima del reato e della persona indicata come autore dell'offesa."], "note": "", "vig": "30-12-2022", "orig": "Il testo originario è identico.", "slug": "norma-2022-dlgs-150-art-53", "descr": "Stabilisce che i programmi si conformano ai principi europei e internazionali e sono svolti da almeno due mediatori. Elenca, in modo non chiuso, mediazione autore-vittima (anche estesa ai gruppi parentali o con vittima di un reato diverso), dialogo riparativo e ogni altro programma dialogico guidato da mediatori.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["programma-mediazione-autore-vittima", "programma-mediazione-gruppi-parentali", "programma-mediazione-aspecifica", "concetto-vittima-surrogata", "programma-dialogo-riparativo", "programma-altri-programmi-dialogici", "concetto-mediatore-esperto", "concetto-vittima-del-reato", "concetto-persona-indicata-come-autore-dell-offesa", "norma-2022-dlgs-150", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "54", "rubrica": "Attività preliminari", "coll": "Titolo IV, Capo III \"Programmi di giustizia riparativa\", Sezione I \"Svolgimento dei programmi di giustizia riparativa\"", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art54", "testo": ["1. Il primo incontro tra i partecipanti ai programmi di giustizia riparativa è preceduto da uno o più contatti con i mediatori e da colloqui tra il mediatore e ciascuno dei partecipanti diretti a fornire le informazioni previste dall'articolo 47, comma 3, a raccogliere il consenso, nonché a verificare la fattibilità dei programmi stessi.", "2. I difensori della persona indicata come autore dell'offesa e della vittima del reato hanno facoltà di intervenire ai colloqui preliminari, su richiesta delle persone interessate."], "note": "", "vig": "30-12-2022", "orig": "Il testo originario è identico.", "slug": "norma-2022-dlgs-150-art-54", "descr": "Prevede che il primo incontro sia preceduto da contatti con i mediatori e da colloqui separati con ciascun partecipante, per dare le informazioni dell'art. 47, c. 3, raccogliere il consenso e verificare la fattibilità. I difensori possono intervenire ai colloqui preliminari su richiesta degli interessati.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["norma-2022-dlgs-150-art-47", "norma-2022-dlgs-150-art-48", "concetto-mediatore-esperto", "concetto-vittima-del-reato", "concetto-persona-indicata-come-autore-dell-offesa", "norma-2022-dlgs-150-art-56", "norma-2022-dlgs-150", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "55", "rubrica": "Svolgimento degli incontri", "coll": "Titolo IV, Capo III \"Programmi di giustizia riparativa\", Sezione I \"Svolgimento dei programmi di giustizia riparativa\"", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art55", "testo": ["1. I programmi di giustizia riparativa si svolgono in spazi e luoghi adeguati allo svolgimento dei programmi e idonei ad assicurare riservatezza e indipendenza.", "2. Nello svolgimento degli incontri i mediatori assicurano il trattamento rispettoso, non discriminatorio ed equiprossimo dei partecipanti, garantendo tempi adeguati alle necessità del caso.", "3. Gli interessati partecipano personalmente a tutte le fasi del programma e possono essere assistiti da persone di supporto, anche in relazione alla loro capacità, fermo quanto previsto dall'articolo 54, comma 2.", "4. Il mediatore, anche su richiesta dell'autorità giudiziaria procedente, invia comunicazioni sullo stato e sui tempi del programma."], "note": "", "vig": "30-12-2022", "orig": "Il testo originario è identico.", "slug": "norma-2022-dlgs-150-art-55", "descr": "Richiede spazi adeguati e idonei ad assicurare riservatezza e indipendenza; trattamento rispettoso, non discriminatorio ed equiprossimo; tempi adeguati. Gli interessati partecipano personalmente, anche con persone di supporto. Il mediatore invia comunicazioni sullo stato e sui tempi del programma, anche su richiesta dell'autorità giudiziaria.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["concetto-equiprossimita", "concetto-mediatore-esperto", "norma-2022-dlgs-150-art-54", "norma-2022-dlgs-150-art-50", "norma-2022-dlgs-150", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "56", "rubrica": "Disciplina degli esiti riparativi", "coll": "Titolo IV, Capo III \"Programmi di giustizia riparativa\", Sezione I \"Svolgimento dei programmi di giustizia riparativa\"", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art56", "testo": ["1. Quando il programma si conclude con un esito riparativo, questo può essere simbolico o materiale.", "2. L'esito simbolico può comprendere dichiarazioni o scuse formali, impegni comportamentali anche pubblici o rivolti alla comunità, accordi relativi alla frequentazione di persone o luoghi.", "3. L'esito materiale può comprendere il risarcimento del danno, le restituzioni, l'adoperarsi per elidere o attenuare le conseguenze dannose o pericolose del reato o evitare che lo stesso sia portato a conseguenze ulteriori.", "4. È garantita alle parti l'assistenza dei mediatori per l'esecuzione degli accordi relativi all'esito simbolico.", "5. I difensori della persona indicata come autore dell'offesa e della vittima del reato hanno facoltà di assistere i partecipanti nella definizione degli accordi relativi all'esito materiale."], "note": "", "vig": "30-12-2022", "orig": "Il testo originario è identico.", "slug": "norma-2022-dlgs-150-art-56", "descr": "Distingue l'esito riparativo simbolico (dichiarazioni o scuse formali, impegni comportamentali, accordi sulla frequentazione di persone o luoghi) da quello materiale (risarcimento, restituzioni, attività per attenuare le conseguenze del reato). I mediatori assistono l'esecuzione degli accordi simbolici; i difensori possono assistere negli accordi materiali.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["concetto-esito-riparativo", "concetto-esito-simbolico", "concetto-esito-materiale", "concetto-mediatore-esperto", "norma-2022-dlgs-150-art-42", "norma-2022-dlgs-150-art-58", "norma-2022-dlgs-150", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "57", "rubrica": "Relazione e comunicazioni all'autorità giudiziaria", "coll": "Titolo IV, Capo III, Sezione II \"Valutazione dell'autorità giudiziaria\"", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art57", "testo": ["1. Al termine del programma viene trasmessa all'autorità giudiziaria procedente una relazione redatta dal mediatore contenente la descrizione delle attività svolte e dell'esito riparativo raggiunto. Ulteriori informazioni sono trasmesse su richiesta dei partecipanti e con il loro consenso.", "2. Il mediatore comunica all'autorità giudiziaria procedente anche la mancata effettuazione del programma, l'interruzione dello stesso o il mancato raggiungimento di un esito riparativo, fermo restando quanto disposto dall'articolo 58."], "note": "", "vig": "30-12-2022", "orig": "Il testo originario è identico.", "slug": "norma-2022-dlgs-150-art-57", "descr": "Al termine del programma il mediatore trasmette all'autorità giudiziaria procedente una relazione sulle attività svolte e sull'esito riparativo; altre informazioni solo su richiesta e con il consenso dei partecipanti. Il mediatore comunica anche mancata effettuazione, interruzione o mancato esito, fermo l'art. 58.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["concetto-esito-riparativo", "concetto-mediatore-esperto", "norma-2022-dlgs-150-art-58", "norma-2022-dlgs-150-art-51", "norma-2022-dlgs-150", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "58", "rubrica": "Valutazione dell'esito del programma di giustizia riparativa", "coll": "Titolo IV, Capo III, Sezione II \"Valutazione dell'autorità giudiziaria\"", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art58", "testo": ["1. L'autorità giudiziaria, per le determinazioni di competenza, valuta lo svolgimento del programma e, anche ai fini di cui all'articolo 133 del codice penale, l'eventuale esito riparativo.", "2. In ogni caso, la mancata effettuazione del programma, l'interruzione dello stesso o il mancato raggiungimento di un esito riparativo non producono effetti sfavorevoli nei confronti della persona indicata come autore dell'offesa."], "note": "Note all'articolo di Normattiva (solo estremi): Si riporta il testo dell'articolo 133 del codice penale.", "vig": "30-12-2022", "orig": "Il testo originario è identico.", "slug": "norma-2022-dlgs-150-art-58", "descr": "L'autorità giudiziaria valuta lo svolgimento del programma e l'eventuale esito riparativo, anche ai fini dell'art. 133 c.p. Mancata effettuazione, interruzione o mancato esito non producono effetti sfavorevoli per la persona indicata come autore dell'offesa.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["concetto-esito-riparativo", "concetto-persona-indicata-come-autore-dell-offesa", "norma-2022-dlgs-150-art-57", "norma-cp-art-62-n6", "norma-cp-art-152", "norma-cp-art-163", "norma-2022-dlgs-150", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "59", "rubrica": "Formazione dei mediatori esperti in programmi di giustizia riparativa", "coll": "Titolo IV, Capo IV \"Formazione dei mediatori esperti in programmi di giustizia riparativa e requisiti per l'esercizio dell'attività\", Sezione I \"Formazione dei mediatori esperti\"", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art59", "testo": ["1. La formazione dei mediatori esperti assicura l'acquisizione delle conoscenze, competenze, abilità e dei principi deontologici necessari a svolgere, con imparzialità, indipendenza, sensibilità ed equiprossimità, i programmi di giustizia riparativa.", "2. I mediatori esperti ricevono una formazione iniziale e continua.", "3. La formazione iniziale consiste in almeno duecentoquaranta ore, di cui un terzo dedicato alla formazione teorica e due terzi a quella pratica, seguite da almeno cento ore di tirocinio presso uno dei Centri per la giustizia riparativa di cui all'articolo 63.", "4. La formazione continua consiste in non meno di trenta ore annuali, dedicate all'aggiornamento teorico e pratico, nonché allo scambio di prassi nazionali, europee e internazionali.", "5. La formazione teorica fornisce conoscenze su principi, teorie e metodi della giustizia riparativa, nonché nozioni basilari di diritto penale, diritto processuale penale, diritto penitenziario, diritto minorile, criminologia, vittimologia e ulteriori materie correlate.", "6. La formazione pratica mira a sviluppare capacità di ascolto e di relazione e a fornire competenze e abilità necessarie alla gestione degli effetti negativi dei conflitti, con specifica attenzione alle vittime, ai minorenni e alle altre persone vulnerabili.", "7. La formazione pratica e quella teorica sono assicurate dai Centri per la giustizia riparativa e dalle Università che operano in collaborazione, secondo le rispettive competenze. Ai Centri per la giustizia riparativa è affidata in particolare la formazione pratica, che viene impartita attraverso mediatori esperti iscritti nell'elenco di cui all'articolo 60 i quali abbiano un'esperienza almeno quinquennale nei servizi per la giustizia riparativa e siano in possesso di comprovate competenze come formatori.", "8. L'accesso ai corsi è subordinato al possesso di un titolo di studio non inferiore alla laurea e al superamento di una prova di ammissione culturale e attitudinale.", "9. I partecipanti al corso di formazione acquisiscono la qualifica di mediatore esperto in programmi di giustizia riparativa in seguito al superamento della prova finale teorico-pratica.", "10. Con decreto del Ministro della giustizia, adottato di concerto con il Ministro del lavoro e delle politiche sociali e con il Ministro dell'università e della ricerca, entro sei mesi dalla data di entrata in vigore del presente decreto, sono disciplinati le forme e i tempi della formazione pratica e teorica di cui al comma 7, nonché le modalità delle prove di cui ai commi 8 e 9. Gli oneri per la partecipazione alle attività di formazione ed alla prova finale teorico-pratica sono posti a carico dei partecipanti."], "note": "", "vig": "30-12-2022", "orig": "Il testo originario è identico.", "slug": "norma-2022-dlgs-150-art-59", "descr": "Disciplina la formazione dei mediatori esperti: iniziale (almeno 240 ore, un terzo teoria e due terzi pratica, più almeno 100 ore di tirocinio in un Centro) e continua (almeno 30 ore annue). Accesso con laurea e prova di ammissione; qualifica dopo la prova finale. Rinvia a un decreto interministeriale.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["concetto-mediatore-esperto", "concetto-equiprossimita", "organizzazione-centri-giustizia-riparativa", "norma-2022-dlgs-150-art-60", "norma-2022-dlgs-150-art-63", "norma-2023-06-09-dm-formazione-mediatori", "norma-2022-dlgs-150", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "60", "rubrica": "Requisiti per l'esercizio dell'attività di mediatore esperto. Elenco dei mediatori esperti", "coll": "Titolo IV, Capo IV, Sezione II \"Requisiti per l'esercizio dell'attività\"", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art60", "testo": ["1. Oltre alla qualifica di cui all'articolo 59, comma 9, per l'esercizio dell'attività di mediatore esperto in programmi di giustizia riparativa è necessario l'inserimento nell'elenco di cui al comma 2.", "2. Con decreto del Ministro della giustizia, di concerto con il Ministro del lavoro e delle politiche sociali e con il Ministro dell'università e della ricerca, da adottarsi entro sei mesi dalla data di entrata in vigore del presente decreto, è istituito presso il Ministero della giustizia l'elenco dei mediatori esperti. L'elenco contiene i nominativi dei mediatori esperti, con l'indicazione della eventuale qualifica di formatori. Il decreto stabilisce anche i criteri per la valutazione delle esperienze e delle competenze dei mediatori esperti, al fine dell'ammissione allo svolgimento dell'attività di formazione, nonché i criteri per l'iscrizione e la cancellazione, anche per motivi sopravvenuti, dall'elenco, le modalità di revisione dell'elenco, nonché la data a decorrere dalla quale la partecipazione all'attività di formazione di cui all'articolo 59 costituisce requisito obbligatorio per l'esercizio dell'attività di mediatore esperto. Lo stesso decreto disciplina le incompatibilità con l'esercizio dell'attività di mediatore esperto, nonché i requisiti di onorabilità e l'eventuale contributo per l'iscrizione nell'elenco.", "3. L'istituzione e la tenuta dell'elenco di cui al comma 2 avvengono nell'ambito delle risorse umane, finanziarie e strumentali già esistenti e disponibili a legislazione vigente, presso il Ministero della giustizia, senza nuovi o maggiori oneri per il bilancio dello Stato."], "note": "", "vig": "30-12-2022", "orig": "Il testo originario è identico.", "slug": "norma-2022-dlgs-150-art-60", "descr": "Per esercitare l'attività di mediatore esperto servono la qualifica dell'art. 59, c. 9, e l'iscrizione in un elenco istituito presso il Ministero della giustizia con decreto interministeriale entro sei mesi. Il decreto fissa criteri di iscrizione e cancellazione, incompatibilità, onorabilità, eventuale contributo e data di obbligatorietà della formazione.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["concetto-mediatore-esperto", "norma-2022-dlgs-150-art-59", "norma-2022-dlgs-150-art-93", "organizzazione-ministero-giustizia", "norma-2023-06-09-dm-elenco-mediatori", "norma-2023-12-15-dm-modifica-requisiti-elenco-mediatori", "norma-2024-02-19-dm-modelli-domanda-elenco-mediatori", "norma-2022-dlgs-150", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "61", "rubrica": "Coordinamento dei servizi e Conferenza nazionale per la giustizia riparativa", "coll": "Titolo IV, Capo V \"Servizi per la giustizia riparativa\", Sezione I \"Coordinamento dei servizi e livelli essenziali delle prestazioni\"", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art61", "testo": ["1. Il Ministero della giustizia provvede al coordinamento nazionale dei servizi per la giustizia riparativa, esercitando le funzioni di programmazione delle risorse, di proposta dei livelli essenziali delle prestazioni e di monitoraggio dei servizi erogati. A tali fini si avvale della Conferenza nazionale per la giustizia riparativa.", "2. La Conferenza nazionale è presieduta dal Ministro della giustizia o da un suo delegato. Ad essa partecipano un rappresentante per ogni Regione o Provincia autonoma, un sindaco o un suo delegato per ciascuna Regione o Provincia autonoma, designato dall'Associazione Nazionale Comuni Italiani, un rappresentante della Cassa delle ammende e sei esperti con funzioni di consulenza tecnico-scientifica.", "3. La Conferenza nazionale è convocata annualmente dal Ministro della giustizia o da un suo delegato e si svolge mediante videoconferenza.", "4. La Conferenza redige annualmente una relazione sullo stato della giustizia riparativa in Italia, che viene presentata al Parlamento dal Ministro della giustizia.", "5. Gli esperti di cui al comma 2 sono nominati con decreto del Ministro della giustizia, di concerto con il Ministro dell'università e della ricerca, tra personalità di riconosciuta competenza ed esperienza nell'ambito della giustizia riparativa, tenuto conto della necessità di assicurare una equilibrata rappresentanza di mediatori esperti e di docenti universitari. L'incarico di esperto ha durata biennale, con possibilità di rinnovo per un ulteriore biennio.", "6. All'attuazione delle attività di cui al presente articolo le amministrazioni provvedono con le risorse umane, strumentali e finanziarie disponibili a legislazione vigente e, comunque, senza nuovi o maggiori oneri per la finanza pubblica. La partecipazione alle attività della Conferenza nazionale per la giustizia riparativa non dà diritto a compensi, gettoni, emolumenti, indennità o rimborsi di spese di qualunque natura o comunque denominati."], "note": "", "vig": "30-12-2022", "orig": "Il testo originario è identico.", "slug": "norma-2022-dlgs-150-art-61", "descr": "Affida al Ministero della giustizia il coordinamento nazionale dei servizi (programmazione delle risorse, proposta dei LEP, monitoraggio), con l'ausilio della Conferenza nazionale. Ne fissa composizione (Regioni e Province autonome, sindaci designati dall'ANCI, Cassa delle ammende, sei esperti), convocazione annuale e relazione annuale al Parlamento.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["organizzazione-conferenza-nazionale-giustizia-riparativa", "organizzazione-ministero-giustizia", "organizzazione-anci", "organizzazione-cassa-delle-ammende", "concetto-servizi-per-la-giustizia-riparativa", "norma-2023-07-27-dm-nomina-esperti-conferenza-nazionale", "norma-2023-10-04-decreto-integrazione-conferenza-nazionale", "norma-2026-02-09-dm-rinnovo-esperti-conferenza-nazionale", "evento-2023-10-25-prima-riunione-conferenza-nazionale", "norma-2022-dlgs-150", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "62", "rubrica": "Livelli essenziali delle prestazioni", "coll": "Titolo IV, Capo V \"Servizi per la giustizia riparativa\", Sezione I \"Coordinamento dei servizi e livelli essenziali delle prestazioni\"", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art62", "testo": ["1. Mediante intesa assunta nella Conferenza unificata di cui all'articolo 8 del decreto legislativo 28 agosto 1997, n. 281, sono stabiliti i livelli essenziali e uniformi delle prestazioni dei servizi per la giustizia riparativa, in conformità ai principi e alle garanzie stabiliti dal presente decreto, nel limite delle disponibilità del fondo di cui all'articolo 67, comma 1."], "note": "Note all'articolo di Normattiva (solo estremi): Per l'articolo 8 del decreto legislativo 28 agosto 1997, n. 281 (Definizione ed ampliamento delle attribuzioni della Conferenza permanente per i rapporti tra lo Stato, le regioni e le province autonome di Trento e Bolzano ed unificazione, per le materie ed i compiti di interesse comune delle regioni, delle province e dei comuni, con la Conferenza Stato-città ed autonomie locali) si vedano le note alle premesse del presente decreto.", "vig": "30-12-2022", "orig": "Il testo originario è identico.", "slug": "norma-2022-dlgs-150-art-62", "descr": "Stabilisce che i livelli essenziali e uniformi delle prestazioni dei servizi per la giustizia riparativa sono fissati con intesa in Conferenza unificata, nel rispetto dei principi e delle garanzie del decreto e nel limite del fondo dell'art. 67, c. 1.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["organizzazione-conferenza-unificata", "concetto-servizi-per-la-giustizia-riparativa", "norma-2022-dlgs-150-art-67", "documento-lep-giustizia-riparativa-conferenza-unificata", "evento-2024-07-04-conferenza-unificata-intesa-lep", "evento-2024-02-09-riunione-conferenza-nazionale-proposta-lep", "norma-2022-dlgs-150", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "63", "rubrica": "Istituzione dei Centri per la giustizia riparativa e Conferenza locale per la giustizia riparativa", "coll": "Titolo IV, Capo V, Sezione II \"Centri di giustizia riparativa\"", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art63", "testo": ["1. I Centri per la giustizia riparativa sono istituiti presso gli enti locali, individuati a norma del presente articolo.", "2. Per ciascun distretto di Corte di appello è istituita la Conferenza locale per la giustizia riparativa cui partecipano, attraverso propri rappresentanti:", "a) il Ministero della giustizia;", "b) le Regioni o le Province autonome sul territorio delle quali si estende il distretto della Corte di appello;", "c) le Province o le Città metropolitane sul territorio delle quali si estende il distretto della Corte di appello;", "d) i Comuni, sedi di uffici giudiziari, compresi nel distretto di Corte di appello;", "e) ogni altro Comune, compreso nel distretto di Corte di appello, presso il quale sono in atto esperienze di giustizia riparativa.", "3. La Conferenza locale è convocata dal Ministro della giustizia o da un suo delegato, con cadenza almeno annuale.", "4. La Conferenza locale è coordinata dal Ministro della giustizia o da un suo delegato e si svolge mediante videoconferenza.", "5. La Conferenza locale per la giustizia riparativa, previa ricognizione delle esperienze di giustizia riparativa in atto, sentiti gli esperti di cui all'articolo 61, comma 2, il Presidente della Corte di appello, il Procuratore generale presso la Corte di appello e il Presidente del Consiglio dell'ordine degli avvocati del Comune sede dell'ufficio di Corte di appello, anche in rappresentanza degli Ordini distrettuali, individua, mediante protocollo d'intesa, in relazione alle risorse umane, strumentali e finanziarie disponibili, uno o più enti locali cui affidare l'istituzione e la gestione dei Centri per la giustizia riparativa in base ai seguenti criteri:", "a) il fabbisogno di servizi sul territorio;", "b) la necessità che l'insieme dei Centri assicuri per tutto il distretto, su base territoriale o funzionale, l'offerta dell'intera gamma dei programmi di giustizia riparativa;", "c) la necessità che i Centri assicurino, nello svolgimento dei servizi, i livelli essenziali delle prestazioni e il rispetto dei principi e delle garanzie stabiliti dal presente decreto.", "6. All'attuazione delle attività di cui al presente articolo le amministrazioni provvedono con le risorse umane, strumentali e finanziarie disponibili a legislazione vigente e, comunque, senza nuovi o maggiori oneri per la finanza pubblica. La partecipazione alle attività della Conferenza locale per la giustizia riparativa non dà diritto a compensi, gettoni, emolumenti, indennità o rimborsi di spese di qualunque natura o comunque denominati."], "note": "", "vig": "30-12-2022", "orig": "Il testo originario è identico.", "slug": "norma-2022-dlgs-150-art-63", "descr": "Istituisce i Centri presso enti locali e, in ogni distretto di Corte d'appello, la Conferenza locale (Ministero, Regioni, Province o Città metropolitane, Comuni sede di uffici giudiziari o con esperienze in atto). La Conferenza individua con protocollo d'intesa gli enti che istituiscono e gestiscono i Centri.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["organizzazione-centri-giustizia-riparativa", "organizzazione-conferenze-locali-giustizia-riparativa", "organizzazione-ministero-giustizia", "norma-2022-dlgs-150-art-61", "norma-2022-dlgs-150-art-92", "evento-2024-03-06-insediamento-conferenze-locali", "evento-2025-10-22-firma-protocolli-36-centri", "norma-2022-dlgs-150", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "64", "rubrica": "Forme di gestione", "coll": "Titolo IV, Capo V, Sezione II \"Centri di giustizia riparativa\"", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art64", "testo": ["1. I Centri per la giustizia riparativa assicurano, nello svolgimento dei servizi, i livelli essenziali e uniformi di cui all'articolo 62.", "2. I Centri possono avvalersi di mediatori esperti dell'ente locale di riferimento. Possono, altresì, dotarsi di mediatori esperti mediante la stipula di contratti di appalto ai sensi degli articoli 140 e seguenti del decreto legislativo 18 aprile 2016, n. 50, ovvero avvalendosi di enti del terzo settore ai sensi dell'articolo 55 del decreto legislativo 3 luglio 2017, n. 117, o mediante una convenzione stipulata ai sensi dell'articolo 56 del medesimo decreto.", "3. Nel contratto di appalto o nella convenzione sono indicati, tra l'altro, le caratteristiche e le modalità di svolgimento dei programmi di giustizia riparativa, la durata, gli obblighi e le modalità di copertura assicurativa, i rapporti finanziari, le forme del controllo amministrativo dell'ente locale di riferimento, i casi di decadenza e di risoluzione per inadempimento, tra i quali il mancato rispetto dei principi e delle garanzie disciplinati nel presente decreto.", "4. In ogni caso, il personale che svolge i programmi di giustizia riparativa deve possedere la qualifica di mediatore esperto ed essere inserito nell'elenco di cui all'articolo 60, comma 2."], "note": "Note all'articolo di Normattiva (solo estremi): Si riporta il testo degli articoli 140 e 141 del decreto legislativo 18 aprile 2016, n. 50 (Codice dei contratti pubblici); Si riporta il testo degli articoli 55 e 56 del decreto legislativo 3 luglio 2017, n. 117 (Codice del Terzo settore, a norma dell'articolo 1, comma 2, lettera b), della legge 6 giugno 2016, n. 106).", "vig": "30-12-2022", "orig": "Il testo originario è identico.", "slug": "norma-2022-dlgs-150-art-64", "descr": "I Centri assicurano i LEP. Possono avvalersi di mediatori esperti dell'ente locale, di appalti (d.lgs. 50/2016, artt. 140 ss.), di enti del terzo settore (d.lgs. 117/2017, art. 55) o di convenzioni (art. 56). Il contratto o la convenzione ne fissa i contenuti; il personale deve essere iscritto nell'elenco dell'art. 60.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["organizzazione-centri-giustizia-riparativa", "concetto-mediatore-esperto", "norma-2022-dlgs-150-art-60", "norma-2022-dlgs-150-art-62", "norma-2022-dlgs-150-art-92", "norma-2022-dlgs-150", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "65", "rubrica": "Trattamento dei dati personali", "coll": "Titolo IV, Capo V, Sezione II \"Centri di giustizia riparativa\"", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art65", "testo": ["1. I Centri per la giustizia riparativa trattano i dati personali, anche appartenenti alle categorie di cui agli articoli 9 e 10 del regolamento (UE) 2016/679 del Parlamento europeo e del Consiglio, del 27 aprile 2016, strettamente necessari all'esercizio delle competenze e al raggiungimento degli scopi di cui al presente decreto, per le finalità di rilevante interesse pubblico di cui all'articolo 2-sexies, comma 2, lettera q), del decreto legislativo 30 giugno 2003, n. 196, e assumono la qualità di titolari del trattamento.", "2. Il trattamento è effettuato nel rispetto del regolamento (UE) 2016/679 del Parlamento europeo e del Consiglio, del 27 aprile 2016, e del decreto legislativo 30 giugno 2003, n. 196.", "3. Le tipologie dei dati che possono essere trattati, le categorie di interessati, i soggetti cui possono essere comunicati i dati personali, le operazioni di trattamento, nonché le misure appropriate e specifiche per tutelare i diritti degli interessati sono definiti con decreto del Ministro della giustizia, da adottarsi, ai sensi dell'articolo 17, comma 3, della legge 23 agosto 1988, n. 400, sentito il Garante per la protezione dei dati personali, nel termine di un anno dalla data di entrata in vigore del presente decreto."], "note": "Note all'articolo di Normattiva (solo estremi): Si riporta il testo dell'articolo 2-sexies, comma 2, lettera q), del decreto legislativo 30 giugno 2003, n. 196 (Codice in materia di protezione dei dati personali, recante disposizioni per l'adeguamento dell'ordinamento nazionale al regolamento (UE) n. 2016/679 del Parlamento europeo e del Consiglio, del 27 aprile 2016, relativo alla protezione delle persone fisiche con riguardo al trattamento dei dati personali, nonché alla libera circolazione di tali dati e che abroga la direttiva 95/46/CE); Si riporta il testo dell'articolo 17, comma 3, della legge 23 agosto 1988, n. 400 (Disciplina dell'attività di Governo e ordinamento della Presidenza del Consiglio dei ministri).", "vig": "30-12-2022", "orig": "Il testo originario è identico.", "slug": "norma-2022-dlgs-150-art-65", "descr": "I Centri trattano i dati personali, anche delle categorie degli artt. 9 e 10 del Regolamento (UE) 2016/679, strettamente necessari, per finalità di rilevante interesse pubblico, e sono titolari del trattamento. Un regolamento del Ministro della giustizia, sentito il Garante, definisce tipi di dati, interessati, comunicazioni e misure di tutela.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["organizzazione-centri-giustizia-riparativa", "norma-2023-07-25-dm-97-dati-personali-centri", "norma-2022-dlgs-150-art-50", "norma-2022-dlgs-150", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "66", "rubrica": "Vigilanza del Ministero della giustizia", "coll": "Titolo IV, Capo V, Sezione II \"Centri di giustizia riparativa\"", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art66", "testo": ["1. La Conferenza locale presenta annualmente al Ministero della giustizia una relazione sull'attività svolta. È, in ogni caso, nella facoltà del Ministero di richiedere in qualunque momento informazioni sullo stato dei servizi per la giustizia riparativa.", "2. Le informazioni acquisite sono valutate ai fini delle determinazioni da assumere ai sensi dell'articolo 67, comma 1."], "note": "", "vig": "30-12-2022", "orig": "Il testo originario è identico.", "slug": "norma-2022-dlgs-150-art-66", "descr": "La Conferenza locale presenta ogni anno al Ministero della giustizia una relazione sull'attività; il Ministero può chiedere in ogni momento informazioni sullo stato dei servizi. Le informazioni sono valutate per le determinazioni dell'art. 67, c. 1.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["organizzazione-conferenze-locali-giustizia-riparativa", "organizzazione-ministero-giustizia", "norma-2022-dlgs-150-art-67", "norma-2022-dlgs-150", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "67", "rubrica": "Finanziamento", "coll": "Titolo IV, Capo V, Sezione II \"Centri di giustizia riparativa\"", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art67", "testo": ["1. Nello stato di previsione del Ministero della giustizia è istituito un Fondo per il finanziamento di interventi in materia di giustizia riparativa, con una dotazione di euro 4.438.524 annui a decorrere dall'anno 2022. Con decreto del Ministro della giustizia, di concerto con il Ministro dell'economia e delle finanze, acquisito il parere della Conferenza unificata di cui all'articolo 8 del decreto legislativo 28 agosto 1997, n. 281, è stabilita ogni anno la quota da trasferire agli enti di cui all'articolo 63, comma 5, per il funzionamento dei Centri per la giustizia riparativa e per la prestazione dei relativi servizi, nel limite delle disponibilità del fondo istituito ai sensi del presente comma. 2 2. Le Regioni e le Province autonome, le Città metropolitane, le Province, i Comuni e la Cassa delle Ammende, nel quadro delle rispettive politiche e competenze, possono concorrere, nei limiti delle risorse disponibili nell'ambito dei propri bilanci, al finanziamento dei programmi di giustizia riparativa.", "3. Nel limite delle disponibilità del fondo di cui al comma 1, fermo restando il finanziamento degli interventi necessari a garantire i livelli essenziali delle prestazioni di giustizia riparativa, la determinazione degli importi da assegnare agli enti di cui all'articolo 63, comma 5, tiene conto, sulla base di criteri di proporzionalità, dell'ammontare delle risorse proprie annualmente impiegate dagli stessi enti per il finanziamento dei programmi di giustizia riparativa, opportunamente documentati e rendicontati alla Conferenza nazionale di cui all'articolo 61.", "4. Agli oneri di cui al comma 1, pari a euro 4.438.524 annui a decorrere dall'anno 2022, si provvede mediante corrispondente riduzione del Fondo per l'attuazione della delega per l'efficienza del processo penale di cui all'articolo 1, comma 19, della legge 27 settembre 2021, n. 134.", "5. Il Ministro dell'economia e delle finanze è autorizzato ad apportare, con propri decreti, le occorrenti variazioni di bilancio."], "note": "", "vig": "1-1-2023", "orig": "", "slug": "norma-2022-dlgs-150-art-67", "descr": "Istituisce nello stato di previsione del Ministero della giustizia un Fondo per la giustizia riparativa (4.438.524 euro annui dal 2022). Un decreto annuale Giustizia-Economia, sentita la Conferenza unificata, fissa la quota per i Centri. Regioni, enti locali e Cassa delle ammende possono concorrere.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["organizzazione-centri-giustizia-riparativa", "organizzazione-cassa-delle-ammende", "organizzazione-conferenza-unificata", "norma-2022-dlgs-150-art-63", "norma-2022-dlgs-150-art-61", "norma-2021-legge-134", "norma-2022-legge-197", "dato-2025-finanziamento-fondo-centri", "dato-2021-legge-134-stanziamento-4-4-milioni", "norma-2022-dlgs-150", "norma-2022-dlgs-150-titolo-iv", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "83", "rubrica": "Modifiche al decreto del Presidente della Repubblica 22 settembre 1988, n. 448", "coll": "Titolo V \"Ulteriori interventi e modifiche alle leggi speciali\", Capo VI \"Modifiche in materia di giustizia riparativa in ambito minorile\"", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art83", "testo": ["1. All'articolo 28, comma 2, del decreto del Presidente della Repubblica 22 settembre 1988, n. 448, dopo le parole «persona offesa dal reato» sono aggiunte le seguenti: «, nonché formulare l'invito a partecipare a un programma di giustizia riparativa, ove ne ricorrano le condizioni»."], "note": "Note all'articolo di Normattiva (solo estremi): Si riporta il testo dell'articolo 28 del citato decreto del Presidente della Repubblica 22 settembre 1988, n. 448, come modificato dal presente decreto.", "vig": "30-12-2022", "orig": "Il testo originario è identico.", "slug": "norma-2022-dlgs-150-art-83", "descr": "Aggiunge all'art. 28, c. 2, del d.P.R. 448/1988 (sospensione del processo minorile e messa alla prova) la possibilità per il giudice di formulare, nell'ordinanza di sospensione, l'invito a partecipare a un programma di giustizia riparativa, ove ne ricorrano le condizioni.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["norma-1988-dpr-448-art-28", "norma-2022-dlgs-150-art-46", "norma-2022-dlgs-150-art-92", "norma-2023-dl-123-art-28-c5bis-dpr-448", "norma-2022-dlgs-150", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "84", "rubrica": "Modifiche al decreto legislativo 2 ottobre 2018, n. 121", "coll": "Titolo V \"Ulteriori interventi e modifiche alle leggi speciali\", Capo VI \"Modifiche in materia di giustizia riparativa in ambito minorile\"", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art84", "testo": ["1. Al decreto legislativo 2 ottobre 2018, n. 121, sono apportate le seguenti modificazioni:", "a) all'articolo 1, comma 2, le parole «percorsi di giustizia riparativa e di mediazione con le vittime di reato» sono sostituite dalle seguenti: «i programmi di giustizia riparativa di cui al decreto legislativo attuativo della legge 27 settembre 2021, n. 134»;", "b) dopo l'articolo 1 è inserito il seguente: «Art. 1-bis (Giustizia riparativa). - 1. In qualsiasi fase dell'esecuzione, l'autorità giudiziaria può disporre l'invio dei minorenni condannati, previa adeguata informazione e su base volontaria, ai programmi di giustizia riparativa. 2. Il giudice, ai fini dell'adozione delle misure penali di comunità, delle altre misure alternative e della liberazione condizionale, valuta la partecipazione al programma di giustizia riparativa e l'eventuale esito riparativo. In ogni caso, non tiene conto della mancata effettuazione del programma, dell'interruzione dello stesso o del mancato raggiungimento di un esito riparativo.»."], "note": "Note all'articolo di Normattiva (solo estremi): Si riporta il testo dell'articolo 1 del decreto legislativo 2 ottobre 2018, n. 121 (Disciplina dell'esecuzione delle pene nei confronti dei condannati minorenni, in attuazione della delega di cui all'articolo 1, comma 82, 83 e 85, lettera p), della legge 23 giugno 2017, n. 103, come modificato dal presente decreto.", "vig": "30-12-2022", "orig": "Il testo originario è identico.", "slug": "norma-2022-dlgs-150-art-84", "descr": "Modifica il d.lgs. 121/2018 sull'esecuzione penale minorile: l'art. 1, c. 2, richiama i programmi di giustizia riparativa della riforma; il nuovo art. 1-bis consente all'autorità giudiziaria l'invio dei minorenni condannati ai programmi, su base volontaria, e ne regola la valutazione per misure di comunità, misure alternative e liberazione condizionale.", "stato": "letto sulla pagina (Normattiva, 2026-11-12)", "collegamenti": ["norma-2018-dlgs-121", "norma-2021-legge-134", "norma-2022-dlgs-150-art-46", "norma-op-art-15-bis", "norma-2022-dlgs-150-art-92", "concetto-esito-riparativo", "norma-2022-dlgs-150", "documento-2022-10-19-relazione-illustrativa-dlgs-150", "documento-2023-01-05-relazione-massimario-2-2023"]}, {"n": "92", "rubrica": "Disposizioni transitorie in materia di giustizia riparativa. Servizi esistenti", "coll": "Titolo VI \"Disposizioni transitorie, finali e abrogazioni\"", "urn": "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;150~art92", "testo": ["1. La Conferenza locale per la giustizia riparativa, entro il termine di sei mesi dalla data del 31 dicembre 2023, provvede function home(){
 return `<section class="hero">${testata}<div class="prose"><h1>Che cos'è la giustizia riparativa</h1>
 <p class="intro">Quando c'è un reato, le persone coinvolte restano con domande, danni e conseguenze. La giustizia riparativa offre loro la possibilità di incontrarsi e parlarne, con l'aiuto di mediatori, se tutti lo scelgono liberamente. Non chiede a nessuno di perdonare. In Italia è disciplinata per legge dal 2022 e affianca il processo, senza sostituirlo.</p>
 <p>Qui spieghiamo che cos'è, come si accede e a chi rivolgersi. Per chi vuole approfondire, raccogliamo norme, sentenze, dati, esperienze e le diverse posizioni nel dibattito.</p></div></section>
 <section class="porte" aria-label="Da dove cominciare">
  <a class="porta" href="#come-funziona"><b>Mi riguarda</b>Sono una persona offesa, una persona accusata, un familiare. Voglio sapere cosa succede e a chi rivolgermi.</a>
  <a class="porta pro" href="#le-regole"><b>Voglio capire a fondo</b>Sono un avvocato, uno studente, un operatore. Cerco le norme, le sentenze e i dati.</a>
 </section>
 <section><h2>In cifre <span class="bozza">da verificare</span></h2><div class="numeri">

  <div class="numero"><b>${D.eventi.length}</b>tappe italiane nella linea del tempo, dal 1975 a oggi<small><a href="#linea-del-tempo">Apri la linea del tempo</a> · <a href="#biblioteca">Libri, film e podcast</a></small></div>
 </div></section>
 ${cucitura}
 <section><h2>Le sezioni</h2><div class="sezioni">${SEZIONI.map(([n,t,d,r])=>`<a class="sez" href="#${r||'home'}"${r?'':' aria-disabled="true"'}><span class="etichetta">Sezione ${n}</span><h3>${t}</h3><p>${d}</p>${r?'':'<span class="stato">In preparazione</span>'}</a>`).join('')}</div></section>
 <section class="pericolo prose"><b>Se sei in pericolo adesso</b>, la giustizia riparativa non è la strada giusta. Chiama il <b>112</b>. Per la violenza contro le donne c'è il numero gratuito <b>1522</b>, attivo giorno e notte.</section>`;
}

function comeFunziona(){
 return `<div class="prose"><span class="etichetta">Sezione 2</span><h1>Come funziona</h1>
 <div class="breve"><b>In breve</b><p style="margin:.4rem 0 0">Partecipare è sempre una scelta libera. Si può chiedere di accedere in ogni fase, anche prima della querela o dopo la condanna, e per qualunque reato. Il servizio è gratuito. Chi partecipa può ritirarsi in ogni momento.</p></div>
 <p>Questa sezione accompagnerà il percorso passo per passo, con una guida per ogni persona coinvolta: chi ha subito il reato, chi è accusato, i familiari, chi invia (giudici, avvocati, servizi).</p>
 <p><a href="#programmi"><b>I tipi di programma</b></a>: mediazione, dialogo riparativo, cerchi e gli altri, spiegati uno per uno.</p>
 <p><a href="#domande"><b>Leggi le domande frequenti</b></a>: costa qualcosa? devo incontrare l'altra persona? devo perdonare?</p>
 <p>Intanto puoi leggere le regole su <a href="#art-44">chi può accedere</a>, sul <a href="#art-48">consenso</a> e sulla <a href="#art-50">riservatezza</a>, oppure cercare il <a href="#centri">Centro più vicino</a>.</p></div>`;
}

function regole(){
 const gruppi={};D.articoli.forEach(a=>{(gruppi[a.coll]=gruppi[a.coll]||[]).push(a)});
 const titoliSez={'Capo I, Sezione I':'Definizioni, principi e obiettivi','Capo I, Sezione II':'Accesso ai programmi','Capo I, Sezione III':'Persone minori di età','Capo II, Sezione I':'Diritti dei partecipanti','Capo II, Sezione II':'Doveri e garanzie dei mediatori e dei partecipanti'};
 const titolo=k=>{if(titoliSez[k])return titoliSez[k];const q=k.match(/"([^"]+)"/g);return q?q[q.length-1].replace(/"/g,''):k};
 const etich=k=>k.replace(/\s*"[^"]*"/g,'');
 return `<div class="prose"><span class="etichetta">Sezione 4 · Le regole</span><h1>Il decreto legislativo 150 del 2022</h1>
 <p>Il decreto legislativo 10 ottobre 2022, n. 150, dedica il Titolo IV alla «Disciplina organica della giustizia riparativa» (articoli 42–67). Qui ci sono tutti i 26 articoli del Titolo IV e gli articoli 83, 84, 92 e 93, letti su Normattiva il 12 novembre 2026.</p><p>Le decisioni della Corte costituzionale, della Cassazione e dei tribunali sono nella pagina <a href="#giurisprudenza"><b>Che cosa hanno deciso i giudici</b></a>.</p></div>
 ${Object.entries(gruppi).map(([k,arr])=>`<div class="capo"><span class="etichetta">${esc(etich(k))}</span><h2>${esc(titolo(k))}</h2>${arr.map(a=>`<a class="art-link" href="#art-${a.n}"><span class="n">Art. ${a.n}</span><span>${esc(a.rubrica)}${a.descr?`<small>${esc(a.descr.slice(0,140))}…</small>`:''}</span></a>`).join('')}</div>`).join('')}`;
}

 const i=D.articoli.findIndex(a=>a.n===n); if(i<0) return nonTrovato();
 const a=D.articoli[i], prev=D.articoli[i-1], next=D.articoli[i+1];
 return `<article class="prose">
 <span class="etichetta">Norma · d.lgs. 150/2022 · ${esc(a.coll.replace(/\s*"[^"]*"/g,''))}</span><h1>Art. ${a.n} · ${esc(a.rubrica)}</h1>

function lineaTempo(){
 const src=LT.dove==='mondo'?D.mondo:D.eventi;

 if(LT.anno===null){const ys=Object.keys(per).map(Number);LT.anno=ys.length?Math.max(...ys):2026}
 let html=`<div class="prose"><span class="etichetta">Archivio</span><h1>Linea del tempo</h1>
 <p>${LT.dove==='mondo'?`${D.mondo.length} tappe fuori dall'Italia, scelte perché citate come origine o modello da almeno tre fonti indipendenti, oppure perché sono atti ufficiali.`:`${D.eventi.length} tappe della giustizia riparativa in Italia, dal 1975 al 2026: norme, sentenze, documenti, esperienze ed eventi.`} Scegli un anno, poi un mese.</p></div>
