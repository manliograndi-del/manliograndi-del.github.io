iudicato al RTI \"Insieme\" (sette mediatori), finanziato con il Fondo di solidarietà comunale; mese giugno, anno non indicato (fonte unica)", "ut": "Minori, adulti, comunità", "en": "Comune di Palermo"}, {"s": "centro-messina", "ti": "Centro per la giustizia riparativa nel distretto di Messina", "di": "Messina", "co": "Messina", "re": "Sicilia", "d": "2026-06-17", "st": "istituito", "ind": "Palazzo Satellite, piazza della Repubblica, 4° piano, Messina", "con": "PEC centrogiustiziariparativa@pec.comune.messina.it; e-mail centrogiustiziariparativa@comune.messina.it", "ges": "Amministrazione condivisa tra Comune di Messina e Associazione Spondé ETS, con convenzione presentata il 2026-09-29; numero, data, durata e importo non indicati", "ut": "Non descritta", "en": "Comune di Messina"}, {"s": "centro-catania", "ti": "Centro per la giustizia riparativa nel distretto di Corte d'appello di Catania", "di": "Catania", "co": "Catania", "re": "Sicilia", "d": "2026-07-02", "st": "istituito", "ind": "via Vigo 43, Catania", "con": "Indirizzo indicato come PEC: giustiziariparativa@comune.catania.it", "ges": "Non trovato. La stampa scrive di mediatori e assistenti sociali (in parafrasi)", "ut": "Vittime, autori dell'offesa, membri della comunità (in parafrasi)", "en": "Comune di Catania"}, {"s": "centro-caltanissetta", "ti": "Centro per la giustizia riparativa nel distretto di Corte d'appello di Caltanissetta", "di": "Caltanissetta", "co": "Caltanissetta", "re": "Sicilia", "d": "2026-03-31", "st": "istituito", "ind": "via Alcide De Gasperi 4, 93100 Caltanissetta", "con": "PEC giustiziariparativa@pec.comune.caltanissetta.it; e-mail giustiziariparativa@comune.caltanissetta.it; tel. 0934 74796 per appuntamenti; brochure https://caltanissetta-api.municipiumapp.it/s3/1099/allegati/brochure-cgr.pdf", "ges": "Associazione Spondé ETS (sede legale a Roma), coprogettazione ex art. 55 d.lgs. 117/2017; convenzione firmata il 2026-03-30; 224.000,00 euro sul capitolo 502100; CIG BA66C6DA71; durata non letta", "ut": "Tutte le persone coinvolte in una vicenda di reato: vittima, persona indicata come autore, comunità", "en": "Comune di Caltanissetta"}, {"s": "centro-campobasso", "ti": "Centro per la giustizia riparativa del Comune di Campobasso (previsto)", "di": "Campobasso", "co": "Campobasso", "re": "Molise", "d": "", "st": "previsto", "ind": "", "con": "", "ges": "", "ut": "", "en": "Comune di Campobasso"}, {"s": "centro-sassari", "ti": "Centro per la giustizia riparativa del Comune di Sassari (previsto)", "di": "—", "co": "Sassari", "re": "Sardegna", "d": "", "st": "previsto", "ind": "", "con": "", "ges": "", "ut": "", "en": "Comune di Sassari"}, {"s": "centro-lecce", "ti": "Centro per la giustizia riparativa del Comune di Lecce (previsto)", "di": "Lecce", "co": "Lecce", "re": "Puglia", "d": "", "st": "previsto", "ind": "", "con": "", "ges": "", "ut": "", "en": "Comune di Lecce"}], "faq": [{"t": "Per tutti", "q": [{"n": "1", "d": "Che cos'è la giustizia riparativa?", "r": "È un programma a cui partecipano, se lo vogliono, la vittima, la persona indicata come autore dell'offesa e, se serve, altre persone. Parlano insieme delle conseguenze del reato. Li aiuta un mediatore, una persona imparziale e preparata.", "rif": "art. 42 c. 1 lett. a"}, {"n": "2", "d": "Costa qualcosa?", "r": "No. La legge dice che l'accesso ai programmi «è gratuito». Anche l'interprete è gratuito. I Centri di Torino, Venezia, Brescia, Napoli e Taranto scrivono che il servizio è gratuito.", "rif": "art. 43 c. 3; art. 49 c. 1"}, {"n": "3", "d": "Sono obbligato a partecipare?", "r": "No. La partecipazione è volontaria. Serve il consenso. Il consenso è personale, libero, informato e scritto.", "rif": "art. 43 c. 1 lett. a, d; art. 48 c. 1"}, {"n": "4", "d": "Posso cambiare idea o fermarmi?", "r": "Sì. Il consenso è «sempre revocabile», anche solo con i comportamenti. Torino e Venezia scrivono che ci si può fermare in ogni momento, anche dopo l'inizio.", "rif": "art. 48 c. 1"}, {"n": "5", "d": "Per quali reati si può fare?", "r": "Per tutti. La legge non esclude reati per tipo o per gravità. L'accesso si può limitare solo se il programma crea un pericolo concreto per chi partecipa.", "rif": "art. 44 c. 1; art. 43 c. 4"}, {"n": "6", "d": "È sicuro? Chi decide se si può fare?", "r": "Prima dell'invio il giudice ascolta le parti e controlla che non ci sia pericolo concreto. Poi i mediatori del Centro, dopo colloqui separati, decidono se il percorso si può fare e in che forma.", "rif": "art. 43 c. 4; art. 129-bis c. 3 c.p.p.; art. 54 (da riscontrare con la 04b)"}, {"n": "", "d": "Chi decide quale percorso fare: un incontro con la vittima, un gruppo, dei colloqui?", "r": "Il giudice, o durante le indagini il pubblico ministero, decide solo se mandare le persone al Centro. Non sceglie il tipo di programma. Al Centro almeno due mediatori fanno prima dei colloqui separati con ciascuna persona: spiegano tutti i programmi possibili, ascoltano e verificano che cosa si può fare. La legge prevede tre tipi di programma. Il primo è la mediazione tra chi è indicato come autore e chi ha subito il reato, anche con i familiari, oppure con la vittima di un altro reato. Il secondo è il dialogo riparativo. Il terzo comprende altri programmi di dialogo guidati da mediatori, per esempio gli incontri di gruppo (vedi «Tipi di percorso»). Si fa solo il programma a cui ciascuno dà il proprio consenso per iscritto. L'avvocato consiglia e può essere presente ai colloqui iniziali, ma non decide al posto della persona. Se un incontro può essere pericoloso, per esempio nella violenza in famiglia, il giudice può non mandare al Centro e i mediatori possono ritenere che il programma non si possa fare.", "rif": "art. 129-bis c. 3 c.p.p.; d.lgs. 150/2022, artt. 43 c. 4, 47 c. 3, 48 c. 1, 53, 54", "nuova": true}, {"n": "7", "d": "Quanto tempo ci vuole?", "r": "La legge garantisce «il tempo necessario» e non fissa una durata. Brescia scrive che non ci sono scadenze. Napoli che dipende dal caso. A Torino, quando invia il giudice, il termine è di norma 3–6 mesi.", "rif": "art. 43 c. 1 lett. h"}, {"n": "8", "d": "Chi sono i mediatori?", "r": "Persone formate e imparziali. La legge chiede «indipendenza» ed «equiprossimità»: stare alla stessa distanza da tutti. Venezia scrive che gli incontri sono condotti da almeno due mediatori iscritti all'elenco del Ministero.", "rif": "art. 42 c. 1 lett. a; art. 43 c. 1 lett. g"}, {"n": "9", "d": "Chi saprà quello che dico?", "r": "Mediatori e personale del Centro devono mantenere la riservatezza. Le eccezioni sono poche: consenso di chi parla, pericolo di reati imminenti o gravi, frasi che sono già reato. Chi partecipa non deve diffondere quanto sentito fino alla fine del processo.", "rif": "art. 50 cc. 1–2"}, {"n": "10", "d": "Serve l'avvocato?", "r": "La legge non obbliga ad avere un avvocato per partecipare. Se c'è, riceve anche lui le informazioni. Può essere presente quando si firma il consenso, se lo chiede.", "rif": "art. 47 c. 4; art. 48 c. 6"}, {"n": "11", "d": "Non parlo bene l'italiano. Posso partecipare?", "r": "Sì. Chi non parla o non capisce l'italiano ha diritto a un interprete gratuito, anche se il mediatore conosce la lingua. La relazione del mediatore viene tradotta. A Torino possono partecipare mediatori interculturali.", "rif": "art. 49 cc. 1, 2, 4; art. 47 c. 5"}, {"n": "12", "d": "Dove si fanno gli incontri?", "r": "Di solito nella sede del Centro, in stanze riservate. Il Trentino-Alto Adige ha sedi a Trento e Bolzano. Per chi è in carcere il Centro può entrare nell'istituto o collegarsi a distanza (Torino).", "rif": "art. 43 c. 1 lett. e"}, {"n": "13", "d": "Il percorso prende il posto del processo?", "r": "No. Venezia scrive che la giustizia riparativa affianca il processo e non lo sostituisce. Il processo può andare avanti. Cosa succede al processo dopo il percorso: vedi la pagina sugli effetti.", "rif": "art. 44 c. 2"}]}, {"t": "Chi ha subito il reato", "q": [{"n": "14", "d": "Devo incontrare l'altra persona?", "r": "No. Si comincia con colloqui separati con i mediatori. Un incontro insieme si fa solo se tutti lo vogliono e ci sono le condizioni. Esiste anche una via indiretta, per esempio una lettera portata dal mediatore.", "rif": "art. 43 c. 1 lett. a; art. 53 (da riscontrare con la 04b)"}, {"n": "15", "d": "Devo perdonare?", "r": "No. La legge non parla di perdono. Se si arriva a un accordo, si chiama «esito riparativo». Può essere simbolico, come delle scuse, o materiale, come un risarcimento. Nessuno è obbligato a raggiungerlo.", "rif": "art. 42 c. 1 lett. e; art. 43 c. 1 lett. f"}, {"n": "16", "d": "Posso portare qualcuno?", "r": "Sì. La legge ammette familiari e «persone di supporto» indicate da chi partecipa. Venezia e le linee guida di Torino lo prevedono. Con i mediatori si decide quando e come partecipano.", "rif": "art. 45 c. 1 lett. c"}, {"n": "17", "d": "Come comincio, se non c'è un processo?", "r": "Ci si può rivolgere direttamente al Centro: per i reati a querela anche prima di presentarla, e anche dopo la fine del processo. Si telefona o si scrive. Alcuni Centri hanno un modulo (Taranto, Matera, Napoli).", "rif": "art. 44 cc. 2–3"}, {"n": "18", "d": "Cosa succede ai primi colloqui?", "r": "Il mediatore spiega i programmi, come si svolgono, i possibili esiti, i diritti e i doveri. Ascolta. Se la persona vuole continuare, firma il consenso scritto.", "rif": "art. 47 c. 3; art. 48 cc. 1, 6"}, {"n": "19", "d": "E se l'altra persona non vuole?", "r": "Senza consenso l'incontro diretto non si fa. Il Centro del Trentino-Alto Adige descrive due alternative: una lettera portata dal mediatore, oppure un dialogo con la vittima di un altro reato simile.", "rif": "art. 48 c. 1; art. 53 (da riscontrare con la 04b)"}, {"n": "20", "d": "L'autore è sconosciuto o la vittima è morta. Si può fare qualcosa?", "r": "Se la vittima è morta per il reato, la legge considera vittime anche i familiari che hanno subito un danno. Quando l'altra persona non c'è, il Trentino-Alto Adige propone il dialogo con persone coinvolte in reati simili.", "rif": "art. 42 c. 1 lett. b"}, {"n": "21", "d": "Mi informano di questa possibilità?", "r": "Sì. L'autorità giudiziaria deve informare «senza ritardo». Lo fanno anche polizia, servizi sociali e servizi per le vittime. Alcuni moduli consegnati con la denuncia o la querela contengono questa informazione, altri no.", "rif": "art. 47 cc. 1–2; art. 90-bis c.p.p."}]}, {"t": "Chi è accusato o condannato", "q": [{"n": "", "d": "Nella citazione c'è scritto che posso accedere alla giustizia riparativa. Che cosa vuol dire?", "r": "È un avviso che la legge fa scrivere negli atti che chiudono le indagini e in quelli che mandano a processo. Arriva anche alla persona offesa. Non è un ordine e non vuol dire che il giudice ti manda al Centro: ti informa che puoi chiederlo. Puoi anche non fare niente: se non partecipi non ci sono conseguenze. Se ti interessa, puoi chiedere al giudice di essere mandato al Centro, di persona o tramite l'avvocato con una procura speciale. Puoi anche chiedere informazioni al Centro della tua zona prima di decidere. Chi decide il tipo di percorso è spiegato nella domanda «Chi decide quale percorso fare».", "rif": "artt. 415-bis c. 3 e 429 c. 1 lett. d-bis c.p.p.; art. 129-bis cc. 1-3 c.p.p.; d.lgs. 150/2022, art. 58 c. 2", "nuova": true}, {"n": "22", "d": "Quello che dico può essere usato contro di me?", "r": "No. Le dichiarazioni fatte nel programma non si possono usare nel processo né nell'esecuzione della pena, salvo quanto scritto nella relazione finale. Il mediatore non è obbligato a testimoniare, salvo eccezioni. Nei luoghi del programma non si possono fare intercettazioni.", "rif": "art. 51; art. 52 cc. 1, 3"}, {"n": "23", "d": "Si può fare se il processo è finito?", "r": "Sì. Si può accedere in ogni fase: prima e durante il processo, durante la pena e dopo. Anche dopo un proscioglimento per mancanza di querela o per estinzione del reato.", "rif": "art. 44 c. 2"}, {"n": "24", "d": "Sono in carcere. Posso partecipare?", "r": "Sì. All'inizio della pena l'autorità giudiziaria deve informare. In Trentino-Alto Adige c'è uno sportello nelle carceri di Trento e Bolzano. A Torino il Centro entra nell'istituto o si collega a distanza. Il percorso non è condizione per ottenere benefici.", "rif": "art. 44 c. 2; art. 47 c. 1"}, {"n": "25", "d": "Cosa arriva al giudice?", "r": "Alla fine il mediatore manda una relazione. Dice quali attività si sono fatte e con quale esito, oppure che il percorso non si è fatto o si è interrotto. Il resto rimane riservato, salvo che i partecipanti chiedano di aggiungerlo.", "rif": "art. 57 (da riscontrare con la 04b); art. 51"}, {"n": "26", "d": "Se il percorso non riesce, ci sono conseguenze?", "r": "Il Trentino-Alto Adige scrive che non partecipare, interrompere o non arrivare a un esito «non producono effetti sfavorevoli». A Torino vale il divieto di valutare negativamente il mancato avvio e l'interruzione. Per gli effetti sul processo vedi la pagina dedicata.", "rif": "art. 58 (da riscontrare con la 04b)"}, {"n": "27", "d": "Partecipare vuol dire ammettere di essere colpevole?", "r": "La legge parla di «persona indicata come autore dell'offesa», anche prima di una sentenza. Quello che si dice nel programma non si può usare nel processo.", "rif": "art. 42 c. 1 lett. c; art. 51"}]}, {"t": "Familiari, minori, enti", "q": [{"n": "28", "d": "Sono un familiare. Posso partecipare?", "r": "Sì. Possono partecipare i familiari della vittima e della persona indicata come autore: coniuge, unito civilmente, convivente, persona con legame affettivo stabile, genitori e figli, fratelli e sorelle, persone a carico.", "rif": "art. 42 c. 1 lett. d; art. 45 c. 1 lett. c"}, {"n": "29", "d": "Sono minorenne. Posso partecipare?", "r": "Sì. Sotto i 14 anni decide il genitore, dopo aver ascoltato il ragazzo e con il suo assenso. Dai 14 anni decidono il ragazzo e il genitore. Se il genitore non vuole, il mediatore valuta. Ci sono mediatori preparati per i minori.", "rif": "art. 46 c. 2; art. 48 cc. 2–3"}, {"n": "30", "d": "Il reato ha colpito un'azienda o un ente. Può partecipare?", "r": "Sì. L'ente offeso ha i diritti della vittima. Il consenso lo dà il legale rappresentante o un suo delegato. Possono partecipare anche associazioni ed enti pubblici.", "rif": "art. 42 c. 2; art. 45 c. 1 lett. c; art. 48 c. 5"}, {"n": "31", "d": "Vale anche per una lite, per esempio con i vicini?", "r": "La legge riguarda le questioni nate da un reato. Il Centro di Napoli scrive che il servizio è rivolto a persone coinvolte in un conflitto o in un reato.", "rif": "art. 42 c. 1 lett. a"}]}, {"t": "Avvocati e chi invia", "q": [{"n": "32", "d": "Chi può mandare una persona al Centro?", "r": "L'invio in senso tecnico lo decide il giudice, o il pubblico ministero nelle indagini, anche d'ufficio. La persona o il suo avvocato possono chiederlo. I servizi (UEPE, USSM, servizi sociali) informano e possono proporlo.", "rif": "art. 129-bis cc. 1–3 c.p.p.; art. 47 c. 2"}, {"n": "33", "d": "Come chiede l'invio l'avvocato?", "r": "La richiesta la presenta la parte, personalmente o con procura speciale. A Torino chi la presenta avvisa per e-mail i difensori delle altre parti, e il giudice ascolta le parti prima di decidere. Se il giudice dice no, si impugna con la sentenza.", "rif": "art. 129-bis cc. 2–3 c.p.p.; Cass. SU n. 5166/2026"}, {"n": "34", "d": "L'avvocato può stare agli incontri?", "r": "La legge prevede la sua presenza quando si raccoglie il consenso, se la chiede. In Trentino-Alto Adige può partecipare ai colloqui preliminari, su richiesta. Assiste negli accordi materiali. Le fonti lette non regolano la sua presenza agli incontri tra le parti.", "rif": "art. 48 c. 6; art. 56 (da riscontrare con la 04b)"}]}], "casi": [{"n": "1", "ti": "Reati online su una ragazza minorenne: riparazione per lettera (Milano)", "s": "esperienza-caso-2025-milano-lettere-vittima-minorenne", "meta": ["programma: riparazione indiretta, senza incontro", "esito: simbolico; attenuante", "racconto del 2025-02-12"], "testo": ["Due giovani maggiorenni sono imputati davanti al gup di Milano per pornografia minorile, corruzione di minorenne e minaccia ai danni di una ragazza minorenne. Su loro istanza il giudice li invia al Centro per la giustizia riparativa del Comune di Milano. La ragazza, costituita parte civile, accetta di partecipare ma non di incontrare gli imputati. Il percorso si svolge quindi per lettera: gli imputati scrivono alla vittima, e la vittima scrive una lettera consegnata tramite il suo legale. Con la sentenza del 25 marzo 2024, in rito abbreviato, il giudice applica le attenuanti generiche e la nuova attenuante dell'art. 62, n. 6, c.p. legata all'esito riparativo, concede la sospensione condizionale e dispone la scarcerazione."], "fonti": "G.L. Gatta, Sistema Penale, 2025-02-12; C. Valori, Questione Giustizia, 2025-05-06."}, {"n": "2", "ti": "Maltrattamenti in famiglia: mediazione diretta e accordo (Milano)", "s": "esperienza-caso-2025-milano-maltrattamenti-mediazione-diretta", "meta": ["programma: mediazione diretta", "esito: accordo economico e relazionale; attenuante", "racconto del 2025-05-06"], "testo": ["Un uomo è imputato di maltrattamenti in famiglia e lesioni personali davanti al gup di Milano. Durante il processo partecipa a un programma di giustizia riparativa. Secondo l'articolo di una giudice dello stesso Tribunale, il programma comincia con diversi colloqui individuali e prosegue con una mediazione diretta tra imputato e persona offesa. La relazione dei mediatori riporta cambiamenti in entrambe le parti. L'esito comprende un accordo economico, con la revoca della costituzione di parte civile, e un esito di tipo relazionale. Con la sentenza del 14 novembre 2024 il giudice applica l'attenuante dell'art. 62, n. 6, c.p. e concede la sospensione condizionale della pena."], "fonti": "C. Valori, Questione Giustizia, 2025-05-06. Fonte unica."}, {"n": "3", "ti": "Vernice sulla sede Rai: un accordo e un incontro in una scuola (Milano)", "s": "esperienza-caso-2025-milano-imbrattamento-rai", "meta": ["programma: mediazione diretta disposta d'ufficio", "esito: simbolico; assoluzione per particolare tenuità", "racconto del 2025-05-06"], "testo": ["Alcuni attivisti sono imputati per avere imbrattato la sede Rai di Milano durante una manifestazione ambientalista. Nella fase iniziale del processo il giudice della II sezione penale del Tribunale di Milano invia d'ufficio le parti a un programma di giustizia riparativa. Gli imputati e i rappresentanti della Rai partecipano a una mediazione diretta. Il programma si chiude con un accordo simbolico, che prevede un incontro pubblico in una scuola superiore. Con la sentenza del 5 marzo 2025, depositata il 31 marzo, il Tribunale ritiene l'accordo idoneo a riparare l'offesa e assolve gli imputati per particolare tenuità del fatto (art. 131-bis c.p.)."], "fonti": ". Fonte unica."}, {"n": "4", "ti": "Imbrattamento di un bene culturale: un evento con il Comune (Milano)", "s": "esperienza-caso-2025-milano-imbrattamento-bene-culturale", "meta": ["programma: colloqui e incontro di mediazione", "esito: simbolico; proscioglimento", "racconto del 2025-05-06"], "testo": ["Attivisti di un movimento ecologista sono imputati per avere imbrattato un bene culturale a Milano; la fonte non dice quale. Dopo colloqui preliminari, gli imputati incontrano i rappresentanti del Comune di Milano, persona offesa. Le parti concordano di organizzare insieme un evento pubblico sulla crisi climatica. Secondo la sentenza, riportata in parafrasi, il percorso è stato un'occasione di dialogo e di comprensione reciproca. Con la sentenza del 3 marzo 2025, depositata il 14 aprile, il Tribunale riqualifica il fatto come imbrattamento semplice (art. 639 c.p.) e proscioglie gli imputati per mancanza di querela; il Comune rinuncia alle conclusioni scritte."], "fonti": ". Fonte unica."}, {"n": "5", "ti": "Rapina in un bar: il giudice ammette la richiesta (Trento)", "s": "esperienza-caso-2023-trento-rapina-bar", "meta": ["programma: accesso a un programma, tipo non indicato", "esito: non riportato", "racconto del 2023-12-02"], "testo": ["Nel 2022 un uomo entra in un bar di viale Verona a Trento per prendere una stecca di sigarette da circa 40 euro. Aggredisce il barista, gli stacca con un morso parte dell'orecchio e lo minaccia; la prognosi è di 30 giorni. Imputato di rapina e lesioni, a fine novembre 2023 chiede tramite il difensore l'accesso a un programma di giustizia riparativa. Il difensore della persona offesa si oppone; il giudice dell'udienza preliminare accoglie la richiesta. L'articolo ricorda che il programma non sostituisce il processo. Non dice quale programma, presso quale Centro, se il barista abbia partecipato né come sia finito."], "fonti": "L'Adige, 2023-12-02. Fonte unica. Conflitto: il titolo dice che l'uomo è \"libero\", il testo letto non lo dice in modo esplicito."}, {"n": "6", "ti": "Omicidio stradale: il conducente chiede di incontrare i genitori (Brescia)", "s": "esperienza-caso-2024-ospitaletto-omicidio-stradale", "meta": ["programma: richiesta di accesso", "esito: non riportato", "racconto del 2024-01-25"], "testo": ["Il 15 maggio 2023 a Ospitaletto, in provincia di Brescia, un camionista con un tasso alcolemico elevato investe e uccide un ragazzo di 20 anni che guidava un furgone. Imputato di omicidio stradale, chiede al giudice di essere ammesso a un programma di giustizia riparativa. Secondo il giornale, vuole incontrare i familiari della vittima per confrontarsi su quanto è accaduto. L'avvocato dei genitori chiede tempo per valutare la proposta con loro; il giornale scrive che probabilmente negheranno il consenso. Il giudice non ha ancora deciso. Il processo con rito abbreviato è fissato per il 7 marzo 2024."], "fonti": "P. Prati, Giornale di Brescia, 2024-01-25. Fonte unica. Seguito non trovato."}, {"n": "7", "ti": "Vandalismo in stazione: la società di trasporti propone un corso (Pergine Valsugana)", "s": "esperienza-caso-2025-pergine-vandalismo-stazione", "meta": ["programma: attività concordata con la persona offesa, dentro una messa alla prova", "esito: reato estinto", "racconto del 2025-10-12"], "testo": ["Circa tre anni prima dell'articolo, un ragazzo minorenne imbratta i bagni e svuota un estintore nella stazione di Pergine Valsugana. Il Tribunale per i minorenni di Trento dispone la messa alla prova. Trentino Trasporti, persona offesa, non chiede un risarcimento: d'accordo con il Servizio di giustizia riparativa propone al ragazzo incontri di formazione sulla sicurezza. Il percorso comprende anche un corso di formazione al lavoro, un tirocinio al Centro per l'impiego e attività di volontariato. Secondo l'articolo, il ragazzo all'inizio fatica a rispettare gli impegni, poi partecipa con più impegno. Con l'esito positivo della prova il Tribunale dichiara estinto il reato."], "fonti": "M. Viganò, L'Adige, 2025-10-12. Fonte unica."}, {"n": "8", "ti": "Insulti nella chat di classe: scuse in udienza (Trento)", "s": "esperienza-caso-2025-trento-chat-di-classe", "meta": ["programma: soluzione riparativa promossa in udienza (non un programma di un Centro)", "esito: denuncia ritirata", "racconto del 2025-04-29"], "testo": ["Sei studenti sedicenni di Trento sono imputati di diffamazione per insulti rivolti a un compagno in una chat di classe; il ragazzo li aveva denunciati. Davanti al Tribunale per i minorenni, su iniziativa del presidente del Tribunale, i ragazzi chiedono scusa in udienza e la denuncia viene ritirata. L'udienza si chiude con un abbraccio collettivo e un applauso. I ragazzi propongono un'assemblea di classe per ristabilire un clima sereno, e il procedimento si chiude senza condanne. Il racconto viene da un giudice intervistato dall'ANSA, che descrive quel momento come il più alto della sua carriera (in parafrasi)."], "fonti": "A. Carlino, Orizzonte Scuola, 2025-04-29, che riprende l'ANSA (intervista originale non aperta). Fonte unica."}, {"n": "9", "ti": "Aggressione a un'insegnante: un murale per la scuola (Torino)", "s": "esperienza-caso-2023-torino-murale-scuola", "meta": ["programma: percorso riparativo scolastico", "esito: riparazione materiale", "racconto del 2023-12"], "testo": ["In una scuola di Torino uno studente di 13 anni aggredisce un'insegnante. La scuola chiama l'associazione Asai. Un consiglio di classe straordinario decide un percorso non punitivo di due o tre mesi, un pomeriggio alla settimana fuori dall'orario scolastico. Con una volontaria Asai come tutor e l'insegnante d'arte, il ragazzo dipinge un murale su una parete esterna della scuola. Il murale viene consegnato durante una festa organizzata dalla dirigente; nella restituzione in classe, secondo il racconto, i compagni riconoscono il suo impegno. Lo stesso articolo racconta un secondo caso: un ragazzo delle medie che disturbava le lezioni conduce alcuni giochi in una classe di scuola elementare."], "fonti": "G. Cananzi, Messaggero di Sant'Antonio, dicembre 2023, pp. 18-21 (PDF). Fonte unica. Il nome del ragazzo nella fonte è di fantasia."}, {"n": "10", "ti": "Ragazzi di una baby gang scrivono alla città (Verona)", "s": "esperienza-caso-2024-verona-lettera-aperta-baby-gang", "meta": ["programma: laboratori e riparazione nel progetto \"Tra Zenit e Nadir\"", "esito: lettera di scuse", "racconto del 2024-10-09"], "testo": ["A Verona alcuni ragazzi che facevano parte di una baby gang partecipano al progetto \"Tra Zenit e Nadir\" della Fondazione Don Calabria, sostenuto da Con i Bambini. Secondo l'articolo, il progetto prevede laboratori per riflettere ed esprimere le emozioni, una mediazione con la vittima quando ci sono le condizioni e una riparazione concreta. Alla fine del percorso i ragazzi scrivono una lettera aperta al Comune e alla cittadinanza, in cui riconoscono i torti e chiedono scusa. L'articolo non dice quali reati, né se ci sia stato un procedimento o una mediazione con vittime precise."], "fonti": "M. Birolini, Avvenire, 2024-10-09. Fonte unica."}, {"n": "11", "ti": "Lesioni tra ragazzi: la madre di un'altra vittima propone la riparazione (Milano)", "s": "esperienza-caso-2025-milano-vittima-aspecifica-lesioni", "meta": ["programma: mediazione con vittima aspecifica", "esito: testimonianza in una scuola (prevista)", "racconto del 2025-07-21"], "testo": ["Un ragazzo di Milano ferisce un coetaneo. La vittima non accetta il percorso. Le mediatrici della cooperativa Dike, che lavora con il Centro per la mediazione penale e la giustizia riparativa del Comune di Milano, organizzano allora un incontro con una vittima \"aspecifica\": la madre di un altro ragazzo, aggredito da un coetaneo in un fatto diverso. È la madre a proporre una riparazione simbolica: il ragazzo porterà la sua testimonianza in una scuola. Il caso è raccontato dalle mediatrici in un reportage, senza i nomi delle persone coinvolte."], "fonti": "G. Morelli, L. Pasotti, IrpiMedia, 2025-07-21. Fonte unica."}, {"n": "12", "ti": "Dopo uno scippo: la vittima incontra l'autore di un reato simile (Milano)", "s": "esperienza-caso-2025-milano-scippo-reato-analogo", "meta": ["programma: incontro con l'autore di un reato analogo", "esito: non riportato come accordo", "racconto del 2025-07-21"], "testo": ["Una persona subisce uno scippo e per la paura si chiude in casa. In un programma seguito dalla cooperativa Dike di Milano incontra l'autore di uno scippo analogo, non la persona che l'ha derubata, e gli racconta la sua sofferenza. Secondo la mediatrice intervistata, l'incontro aiuta la vittima a rielaborare quanto ha vissuto. Il reportage non riporta un accordo né effetti su un procedimento."], "fonti": ". Fonte unica. Paragrafo sotto le 80 parole: la fonte non dà altri dettagli."}, {"n": "13", "ti": "La vedova di un carabiniere e la madre del ragazzo condannato (Grosseto)", "s": "esperienza-caso-2025-francardi-sisi-grosseto", "meta": ["programma: incontro diretto non formale (la fonte non cita Centri né mediatori)", "esito: relazionale", "racconto del 2025-11-16"], "testo": ["Il 25 aprile 2011, vicino a Grosseto, un giovane aggredisce due carabinieri durante un controllo. Un appuntato entra in coma e muore tredici mesi dopo; l'altro perde un occhio. Irene Sisi, madre del giovane, scrive una lettera di scuse a Claudia Francardi, moglie del carabiniere. Seguono un primo incontro e un secondo in ospedale. Le due donne diventano amiche e fondano un'associazione per l'educazione alla legalità. Secondo l'articolo, il figlio sconta la pena a Milano, si è laureato in pedagogia ed è educatore in una comunità. Le due donne hanno raccontato la loro storia a un convegno della Caritas diocesana di Prato sulla giustizia riparativa."], "fonti": "M. Marotta, La Nazione (Prato), 2025-11-16. Fonte unica per questo articolo. Nome esatto dell'associazione da riscontrare."}, {"n": "14", "ti": "Agnese Moro e Franco Bonisoli raccontano il loro incontro", "s": "esperienza-caso-2011-genova-moro-bonisoli", "meta": ["programma: percorso di gruppo con tre mediatori (Gruppo dell'Incontro)", "esito: relazionale; testimonianze comuni", "primo racconto letto: 2011-07-12"], "testo": ["Agnese Moro, figlia di Aldo Moro, e Franco Bonisoli, ex brigatista che faceva parte del commando di via Fani, partecipano al percorso tra vittime e responsabili della lotta armata guidato da Guido Bertagna, Adolfo Ceretti e Claudia Mazzucato. Nel 2011 raccontano insieme il loro dialogo a Genova, a Palazzo Tursi, durante la Settimana internazionale dei diritti: Moro dice, in parafrasi, che la condanna non le ha restituito giustizia e il dialogo sì; Bonisoli parla dei debiti che restano da pagare. Tornano a parlarne insieme, tra l'altro, all'Università di Verona il 7 marzo 2024. Secondo IrpiMedia gli incontri si sono svolti in case di comunità e abbazie, e i partecipanti incontrano insieme gli studenti."], "fonti": "Blitz quotidiano, 2011-07-12 (riprende Repubblica.it); Università di Verona; IrpiMedia, 2025-07-21; L'Espresso, 2025-08-20."}, {"n": "15", "ti": "Il figlio di un poliziotto ucciso e un'ex di Prima Linea (Cremona)", "s": "esperienza-caso-2024-cremona-bazzega-grena", "meta": ["programma: percorso di gruppo (Gruppo dell'Incontro)", "esito: relazionale", "racconto del 2024-11"], "testo": ["Giorgio Bazzega è figlio di Sergio Bazzega, maresciallo di Pubblica sicurezza ucciso nel 1976. Grazia Grena ha fatto parte di Prima Linea e oggi presiede un'associazione di volontariato attiva nel carcere di Lodi. Entrambi fanno parte del gruppo raccontato nel \"Libro dell'incontro\". A novembre 2024, a Cremona, nel Festival dei Diritti, raccontano insieme come da una storia di violenza e di dolore sia nata, attraverso un percorso, un'amicizia (in parafrasi). Il percorso di Bazzega, dal lutto agli anni difficili fino all'incontro con il gruppo, è al centro del documentario «L'incontro» di Fabrizio Galatea (2026)."], "fonti": "Diocesi di Cremona; Film Commission Torino Piemonte. Data in conflitto: 2024-11-19 (URL) / 2024-11-23 (testo)."}, {"n": "16", "ti": "Un ergastolano nel Progetto Sicomoro", "s": "esperienza-caso-2025-platania-sicomoro", "meta": ["programma: gruppo di detenuti e vittime di reati analoghi (Sicomoro)", "esito: cambiamento raccontato dall'autore", "racconto del 2025-11-25"], "testo": ["Enrico Platania sconta dal 1997 un ergastolo per reati di mafia commessi a Catania ed è stato detenuto a Catania, Trapani e Tempio Pausania. Dal 2014 partecipa al Progetto Sicomoro di Prison Fellowship Italia, in cui gruppi di detenuti incontrano vittime di reati simili ai loro. In un'intervista ad Avvenire racconta che prima vedeva le vittime come obiettivi e che, ascoltandole, ha pianto a lungo (in parafrasi). Oggi è in semilibertà e insegna italiano a giovani migranti con una cooperativa. L'articolo non collega la semilibertà al progetto."], "fonti": "G. Paolucci, Avvenire, 2025-11-25. Fonte unica."}, {"n": "17", "ti": "Una madre che ha perso il figlio entra in carcere", "s": "esperienza-caso-2018-cipollone-sicomoro", "meta": ["programma: Progetto Sicomoro, otto incontri in carcere", "esito: cambiamento raccontato dalla vittima", "racconto: anno da verificare (2018?)"], "testo": ["Il figlio di Elisabetta Cipollone, Andrea, è stato ucciso da un'auto che correva a oltre 120 chilometri all'ora in un centro abitato. Su proposta di Marcella Reni, di Prison Fellowship Italia, partecipa al Progetto Sicomoro: otto incontri in carcere con persone detenute per reati diversi dal suo caso. Racconta che dopo il primo incontro la \"corazza\" che si era costruita ha cominciato a sgretolarsi (in parafrasi). La testimonianza è pubblicata nella rivista della Caritas Ticino."], "fonti": "D. Balbo, rivista Caritas Ticino, pp. 44-45. Fonte unica. Anno della rivista ricavato dall'URL (\"riv_1804\"): calcolo, non fonte."}, {"n": "18", "ti": "Femminicidio: il condannato chiede il programma, la famiglia rifiuta (Milano)", "s": "esperienza-caso-2024-rifiuto-famiglia-femminicidio", "meta": ["programma: richiesta di accesso; invio a un Centro per la verifica", "esito: nessun programma con i familiari", "racconto del 2024-03-12"], "testo": ["Un uomo condannato per l'omicidio della ex compagna, commesso nel gennaio 2022 a Rescaldina, chiede tramite i difensori di accedere a un programma di giustizia riparativa. Secondo Il Giorno, i giudici autorizzano l'invio della richiesta a uno dei Centri previsti dalla legge, che deve verificare se il programma è fattibile. I familiari della vittima si oppongono a ogni incontro o dialogo mediato. L'articolo precisa che il programma non comporta premi o sconti di pena. Nel 2023 la Corte d'Assise di Busto Arsizio aveva previsto, se i familiari non avessero voluto partecipare, un programma con una vittima aspecifica. Nel 2026 Il Post cita il caso tra quelli in cui la famiglia ha rifiutato."], "fonti": "A. Gianni, Il Giorno, 2024-03-12; Maggio, Parisi, Sistema Penale, 2023-10-19; Il Post, 2026-10-12. Noto in cronaca come \"caso Maltesi\": decidere in redazione se usare il nome."}, {"n": "19", "ti": "Omicidio per un paio di cuffie: ammesso il programma, la famiglia dice no (Milano)", "s": "esperienza-caso-2026-rozzano-vittima-surrogata", "meta": ["programma: ammesso; ipotesi di vittima surrogata", "esito: non ancora avviato", "racconto del 2026-07-25"], "testo": ["Nella notte dell'11 ottobre 2024 a Rozzano un ragazzo di 19 anni uccide con un coltello un uomo di 31 anni che tornava dal lavoro, per rubargli un paio di cuffie da 14 euro. In appello la condanna a 27 anni è confermata. Su richiesta dei difensori, la Corte d'assise d'appello di Milano ammette il condannato a un programma di giustizia riparativa, da valutare con il Centro di Milano. La famiglia della vittima dichiara che non darà il consenso; si ipotizza perciò una vittima surrogata, cioè una persona che ha subito un reato diverso. Il programma corre accanto alla pena e non la sostituisce. Secondo l'articolo non è ancora iniziato e il condannato potrebbe essere ritenuto non idoneo."], "fonti": "J. Castagliuolo, Il Giorno, 2026-07-25. Fonte unica."}, {"n": "20", "ti": "Il giudice dispone il programma, ma non c'è un Centro (Civitavecchia)", "s": "esperienza-caso-2025-civitavecchia-centro-mancante", "meta": ["programma: disposto con il consenso delle parti", "esito: non attuato", "racconto del 2025-08-20"], "testo": ["Un uomo è imputato davanti al Tribunale di Civitavecchia per maltrattamenti nei confronti della madre. Con il consenso delle parti, il giudice dispone un programma di giustizia riparativa. Il programma dovrebbe svolgersi nel distretto della Corte d'appello di Roma, ma secondo il difensore lì non esistono ancora i Centri pubblici previsti dalla legge presso gli enti locali. Per questo il programma non è stato attuato. Il difensore sostiene che in questo modo il diritto previsto dalla legge resta senza effetto (in parafrasi)."], "fonti": "M. Roberti, L'Espresso, 2025-08-20. Fonte unica. Situazione dei Centri del Lazio da riscontrare con la Ricerca 05."}], "biblio": [{"t": "Libri", "o": [{"s": "opera-2015-bertagna-ceretti-mazzucato-libro-dell-incontro", "tipo": "libro", "ti": "Il libro dell'incontro. Vittime e responsabili della lotta armata a confronto", "au": "G. Bertagna, A. Ceretti, C. Mazzucato (a cura di)", "a": "2015", "ed": "il Saggiatore", "dove": "libreria, biblioteche; ebook 2017", "de": "Materiali, lettere e stralci degli incontri, dal 2007, tra ex militanti della lotta armata e vittime o familiari, con tre mediatori; 466 pagine"}, {"s": "opera-2011-reni-paris-tra-le-mura-dell-anima", "tipo": "libro", "ti": "Tra le mura dell'anima", "au": "Marcella Reni, Carlo Paris", "a": "2011", "ed": "non verificato", "dove": "da verificare (biblioteche)", "de": "Romanzo sull'incontro nel carcere di Milano-Opera tra sette detenuti di alta sicurezza e sette vittime; presenta Prison Fellowship e il Progetto Sicomoro"}, {"s": "opera-2013-colombo-perdono-responsabile", "tipo": "libro", "ti": "Il perdono responsabile (ed. 2020: «Perché il carcere non serve a nulla»)", "au": "Gherardo Colombo", "a": "2013 (ed. 2020)", "ed": "Ponte alle Grazie", "dove": "libreria, biblioteche", "de": "Un ex magistrato discute l'utilità del carcere e presenta la giustizia riparativa come percorso di responsabilizzazione che coinvolge vittime e condannati"}, {"s": "opera-2025-bove-respiro", "tipo": "libro", "ti": "Respiro. Il carcere oggi tra condanna e riscatto", "au": "Luisa Bove", "a": "2025", "ed": "ITL libri", "dove": "libreria; estratto gratuito sul sito dell'editore", "de": "Il carcere raccontato da operatori ed ex detenuti; una parte sul percorso riparativo del Tavolo dell'Innominato di Lecco"}, {"s": "opera-2021-lodigiani-mannozzi-tre-storie-di-fata-g", "tipo": "libro (per bambini)", "ti": "Tre storie di Fata G.", "au": "G.A. Lodigiani, G. Mannozzi; ill. E. Bonfigli", "a": "2021 (data della presentazione)", "ed": "non verificato", "dove": "da verificare", "de": "Storie illustrate per bambini sui valori della giustizia riparativa: dialogo, ascolto, cura dell'altro"}]}, {"t": "Film e documentari", "o": [{"s": "opera-2026-galatea-l-incontro", "tipo": "documentario", "ti": "L'incontro", "au": "Fabrizio Galatea", "a": "2026", "ed": "Zenit Arti Audiovisive, Les Films d'Ici, con AAMOD; distribuzione Wanted", "dove": "sala, uscita indicata al 2026-12-15 (fonte unica)", "de": "Giorgio Bazzega, figlio di una vittima delle Brigate Rosse (1976), e il suo percorso nel Gruppo dell'Incontro"}, {"s": "opera-2025-abbraccio-che-ripara-documentario", "tipo": "documentario", "ti": "L'abbraccio che ripara - Perdonare un delitto", "au": "Flavio Maspes (regia); Niccolò Agliardi", "a": "2025", "ed": "Sky TG24", "dove": "Sky TG24, Now, Sky Documentaries", "de": "Documentario tratto dal podcast: la storia di Lucia Di Mauro Montanino e di Antonio"}, {"s": "opera-2021-una-donna-chiamata-maixabel-film", "tipo": "film", "ti": "Una donna chiamata Maixabel (Maixabel)", "au": "Icíar Bollaín", "a": "2021", "ed": "distribuzione italiana Movies Inspired", "dove": "sala dal 2023-07-13; Amazon Prime Video; noleggio digitale", "de": "La vedova di Juan María Jáuregui, ucciso dall'ETA nel 2000, incontra in carcere uno degli autori dell'omicidio"}, {"s": "opera-2023-je-verrai-toujours-vos-visages-film", "tipo": "film", "ti": "Je verrai toujours vos visages (All Your Faces)", "au": "Jeanne Herry", "a": "2023", "ed": "Trésor Films (non verificato)", "dove": "nessuna distribuzione italiana trovata; proiezioni con sottotitoli", "de": "Condannati e vittime in percorsi di giustizia riparativa in Francia, seguiti da professionisti e volontari"}, {"s": "opera-2018-the-meeting-film", "tipo": "film", "ti": "The Meeting", "au": "Alan Gilsenan", "a": "2018 (solo risultato di ricerca)", "ed": "non verificata", "dove": "nessuna distribuzione italiana trovata", "de": "Ailbhe Griffith interpreta sé stessa nell'incontro riparativo con l'uomo che l'aveva aggredita sessualmente"}]}, {"t": "Podcast e audio", "o": [{"s": "opera-avvenire-podcast-incontri-strade-giustizia-riparativa", "tipo": "podcast", "ti": "Incontri. Strade di giustizia riparativa", "au": "Costanza Oliva, Viviana Daloiso", "a": "2025", "ed": "Festival della Missione con Avvenire", "dove": "avvenire.it/podcast e piattaforme", "de": "Sei storie di dialogo dopo un reato o un conflitto: Bataclan, Montefiore, Gustavo e Manuela, Amel, Antonio Tango, Diane Foley"}, {"s": "opera-2025-agliardi-abbraccio-che-ripara", "tipo": "podcast", "ti": "L'abbraccio che ripara - Perdonare un delitto", "au": "Niccolò Agliardi; regia e musiche Tommaso Ruggeri", "a": "2025", "ed": "Kayros Onlus, Vois, Fondazione Cariplo; Sky TG24", "dove": "Sky TG24 Insider; dal 2025-02-27 piattaforme podcast", "de": "Otto episodi sulla storia di Lucia Di Mauro Montanino e del suo incontro con Antonio, autore del delitto a 17 anni"}]}, {"t": "Video di incontri pubblici (archivio Radio Radicale)", "o": [{"s": "opera-2016-07-05-radio-radicale-presentazione-libro-dell-incontro", "tipo": "video", "ti": "Il libro dell'incontro - Presentazione", "au": "Radio Radicale", "a": "2016", "ed": "Il Saggiatore, Istituto Luigi Sturzo, Roma", "dove": "radioradicale.it (libero)", "de": "Presentazione con A. Moro, A. Faranda, F. Bonisoli, M. Milani, G. Ricci, L. Ghizzoni Evangelista, C. Mazzucato, G. Bertagna; 2 h 7 min"}, {"s": "opera-2017-01-19-radio-radicale-presentazione-libro-incontro-senato", "tipo": "video", "ti": "Presentazione del «Libro dell'incontro» al Senato", "au": "Radio Radicale", "a": "2017", "ed": "Senato della Repubblica", "dove": "radioradicale.it (libero)", "de": "Con A. Moro, A. Coi, M. Milani, L. Ghizzoni Evangelista, G. Grena, L. Tarantelli, G. Ricci, A. Ceretti; 2 h 11 min"}, {"s": "opera-2017-06-10-radio-radicale-responsabilita-narrative", "tipo": "video", "ti": "Responsabilità narrative. Dagli anni di piombo alla giustizia riparativa", "au": "Radio Radicale", "a": "2017", "ed": "LIDU, Roma", "dove": "radioradicale.it (libero)", "de": "Convegno con un intervento di Guido Bertagna sui percorsi tra vittime e responsabili della lotta armata; 5 h 22 min"}, {"s": "opera-2018-01-18-radio-radicale-incontri-celimontani-vittime-responsabili", "tipo": "video", "ti": "Incontri Celimontani - Vittime e responsabili: un dialogo possibile", "au": "Radio Radicale", "a": "2018", "ed": "Monastero di San Gregorio al Celio, Roma", "dove": "radioradicale.it (libero)", "de": "Dialogo tra Agnese Moro e Adriana Faranda; 1 h 55 min"}, {"s": "opera-2023-01-13-radio-radicale-convegno-giustizia-riparativa-forli", "tipo": "video", "ti": "La giustizia riparativa", "au": "Radio Radicale", "a": "2023", "ed": "Camera penale della Romagna, Forlì", "dove": "radioradicale.it (libero)", "de": "Convegno con Agnese Moro, Maria Grazia Grena, Marcello Bortolato; 4 h 46 min"}, {"s": "opera-2024-11-22-radio-radicale-delitto-castigo-perdono", "tipo": "video", "ti": "Delitto, castigo, perdono. Dialogo su pena, giustizia e riconciliazione", "au": "Radio Radicale", "a": "2024", "ed": "Corte di Appello di Roma, Cassazione, Cortile dei Gentili", "dove": "radioradicale.it (libero)", "de": "Testimonianze di Agnese Moro, Antonietta Fiorillo, Gloria Salerno; relazione di Claudia Mazzucato; 3 h 8 min"}]}], "glos": [{"t": "Le parole della legge", "v": [{"ti": "Giustizia riparativa", "slug": "concetto-giustizia-riparativa", "semplice": "Un percorso a cui chi ha subito un reato, chi ne è accusato e altre persone della comunità scelgono di partecipare. Insieme, con l'aiuto di un mediatore, affrontano le conseguenze del reato. Nessuno è obbligato a partecipare.", "testo": "«ogni programma che consente alla vittima del reato, alla persona indicata come autore dell'offesa e ad altri soggetti appartenenti alla comunità di partecipare liberamente, in modo consensuale, attivo e volontario, alla risoluzione delle questioni derivanti dal reato, con l'aiuto di un terzo imparziale, adeguatamente formato, denominato mediatore»", "fonte": "d.lgs. 150/2022, art. 42, c. 1, lett. a)", "inglese": "restorative justice", "nota": "Le definizioni dell'ONU (2002), della direttiva 2012/29/UE e del Consiglio d'Europa (2018) sono confrontate nella Ricerca 07, tabella 3.3. Il Consiglio d'Europa dice: «\"Restorative justice\" refers to any process which enables those harmed by crime, and those responsible for that harm, if they freely consent, to participate actively in the resolution of matters arising from the offence» (CM/Rec(2018)8, regola 3; testo da riscontrare, Ricerca 15)."}, {"ti": "Vittima del reato", "slug": "concetto-vittima-del-reato", "semplice": "La persona che ha subito un danno dal reato, di qualunque tipo. Se la persona è morta a causa del reato, sono vittime anche i suoi familiari che hanno subito un danno per quella morte. Gli stessi diritti valgono anche per un ente, per esempio un'associazione o un'azienda offesa dal reato.", "testo": "«la persona fisica che ha subito direttamente dal reato qualunque danno patrimoniale o non patrimoniale, nonché il familiare della persona fisica la cui morte è stata causata dal reato e che ha subito un danno in conseguenza della morte di tale persona» (c. 1, lett. b). «I diritti e le facoltà attribuite alla vittima del reato sono riconosciuti anche al soggetto giuridico offeso dal reato» (c. 2).", "fonte": "d.lgs. 150/2022, art. 42, c. 1, lett. b), e c. 2"}, {"ti": "Persona indicata come autore dell'offesa", "slug": "concetto-persona-indicata-come-autore-dell-offesa", "semplice": "È la persona accusata del reato, in qualunque momento: prima della querela, durante le indagini o il processo, dopo la condanna, oppure quando il processo si è chiuso senza una decisione sul fatto. La legge non dice \"colpevole\", perché la giustizia riparativa può cominciare prima di una condanna.", "testo": "sei ipotesi: «1) la persona indicata come tale dalla vittima, anche prima della proposizione della querela; 2) la persona sottoposta alle indagini; 3) l'imputato; 4) la persona sottoposta a misura di sicurezza personale; 5) la persona condannata con pronuncia irrevocabile; 6) la persona nei cui confronti è stata emessa una sentenza di non luogo a procedere o di non doversi procedere, per difetto della condizione di procedibilità, anche ai sensi dell'articolo 344-bis del codice di procedura penale, o per intervenuta causa estintiva del reato»", "fonte": "d.lgs. 150/2022, art. 42, c. 1, lett. c)", "dnc": "imputato (è solo una delle sei ipotesi)"}, {"ti": "Familiare", "slug": "concetto-familiare", "semplice": "Il coniuge, il partner unito civilmente o convivente, chi ha un legame affettivo stabile, i genitori e i figli (e così via in linea retta), i fratelli e le sorelle, le persone a carico. Vale sia per la vittima sia per la persona accusata.", "testo": "«il coniuge, la parte di un'unione civile ai sensi dell'articolo 1, comma 2, della legge 20 maggio 2016, n. 76, il convivente di fatto di cui all'articolo 1, comma 36, della stessa legge, la persona che è legata alla vittima o alla persona indicata come autore dell'offesa da un vincolo affettivo stabile, nonché i parenti in linea retta, i fratelli, le sorelle e le persone fiscalmente a carico della vittima o della persona indicata come autore dell'offesa»", "fonte": "d.lgs. 150/2022, art. 42, c. 1, lett. d)"}, {"ti": "Esito riparativo", "slug": "concetto-esito-riparativo", "semplice": "L'accordo a cui le persone arrivano alla fine del percorso, se ci arrivano. Mostra che si sono riconosciute a vicenda e che un rapporto si può ricostruire. Può essere simbolico, materiale o tutti e due.", "testo": "«qualunque accordo, risultante dal programma di giustizia riparativa, volto alla riparazione dell'offesa e idoneo a rappresentare l'avvenuto riconoscimento reciproco e la possibilità di ricostruire la relazione tra i partecipanti»", "fonte": "d.lgs. 150/2022, art. 42, c. 1, lett. e); art. 56", "inglese": "restorative outcome", "nota": "L'ONU (ECOSOC 2002/12, par. 3) dice: «\"Restorative outcome\" means an agreement reached as a result of a restorative process.» (Ricerca 15)."}, {"ti": "Esito simbolico", "slug": "concetto-esito-simbolico", "semplice": "Un esito fatto di parole e di gesti: per esempio scuse, dichiarazioni, impegni a comportarsi in un certo modo, anche verso la comunità.", "testo": "«L'esito simbolico può comprendere dichiarazioni o scuse formali, impegni comportamentali anche pubblici o rivolti alla comunità, accordi relativi alla frequentazione di persone o luoghi.»", "fonte": "d.lgs. 150/2022, art. 56, c. 2", "dnc": "esito materiale"}, {"ti": "Esito materiale", "slug": "concetto-esito-materiale", "semplice": "Un esito concreto: per esempio risarcire il danno, restituire qualcosa, rimediare alle conseguenze del reato.", "testo": "«L'esito materiale può comprendere il risarcimento del danno, le restituzioni, l'adoperarsi per elidere o attenuare le conseguenze dannose o pericolose del reato o evitare che lo stesso sia portato a conseguenze ulteriori.»", "fonte": "d.lgs. 150/2022, art. 56, c. 3", "dnc": "esito simbolico"}, {"ti": "Servizi per la giustizia riparativa", "slug": "concetto-servizi-per-la-giustizia-riparativa", "semplice": "Tutto il lavoro che serve per preparare, coordinare, gestire e offrire i percorsi.", "testo": "«tutte le attività relative alla predisposizione, al coordinamento, alla gestione e all'erogazione di programmi di giustizia riparativa»", "fonte": "d.lgs. 150/2022, art. 42, c. 1, lett. f)"}, {"ti": "Centro per la giustizia riparativa", "slug": "concetto-centro-per-la-giustizia-riparativa", "semplice": "Il servizio pubblico dove si svolgono i percorsi. I Centri sono istituiti presso gli enti locali (art. 63). Vedi la pagina dei Centri.", "testo": "«la struttura pubblica di cui al capo V, sezione II, cui competono le attività necessarie all'organizzazione, gestione, erogazione e svolgimento dei programmi di giustizia riparativa»", "fonte": "d.lgs. 150/2022, art. 42, c. 1, lett. g); art. 63"}]}, {"t": "I principi", "v": [{"ti": "Partecipazione volontaria", "slug": "concetto-partecipazione-volontaria", "semplice": "Si partecipa solo se lo si sceglie, e in modo attivo. Vale per la vittima, per la persona accusata e per chiunque altro partecipi.", "testo": "«la partecipazione attiva e volontaria della persona indicata come autore dell'offesa e della vittima del reato e degli altri eventuali partecipanti alla gestione degli effetti pregiudizievoli causati dall'offesa»", "fonte": "d.lgs. 150/2022, art. 43, c. 1, lett. a)"}, {"ti": "Equa considerazione", "slug": "concetto-equa-considerazione", "semplice": "Il percorso tiene conto allo stesso modo degli interessi della vittima e di quelli della persona accusata.", "testo": "«l'equa considerazione dell'interesse della vittima del reato e della persona indicata come autore dell'offesa»", "fonte": "d.lgs. 150/2022, art. 43, c. 1, lett. b)", "nota": "Secondo la Ricerca 17 l'espressione coincide con una richiesta del parere del gruppo M5S sullo schema A.G. 414 (da riscontrare)."}, {"ti": "Consenso", "slug": "concetto-consenso", "semplice": "Prima di cominciare, ogni partecipante dà il suo consenso, per iscritto. Deve sapere a che cosa sta dicendo sì. Può ritirarlo quando vuole.", "testo": "«Il consenso alla partecipazione ai programmi di giustizia riparativa è personale, libero, consapevole, informato ed espresso in forma scritta. È sempre revocabile anche per fatti concludenti.»", "fonte": "d.lgs. 150/2022, art. 43, c. 1, lett. d); art. 48, c. 1"}, {"ti": "Revoca del consenso", "slug": "concetto-revoca-del-consenso", "semplice": "Chi partecipa può smettere in ogni momento. Può dirlo, oppure semplicemente comportarsi in un modo che mostra che non vuole continuare.", "testo": "vedi Consenso: «È sempre revocabile anche per fatti concludenti.»", "fonte": "d.lgs. 150/2022, art. 48, c. 1", "inglese": "withdrawal of consent"}, {"ti": "Riservatezza", "slug": "concetto-dovere-di-riservatezza", "semplice": "Quello che si dice nel percorso resta nel percorso. I mediatori e il personale del Centro non possono rivelarlo, salvo che i partecipanti siano d'accordo o in pochi casi previsti dalla legge.", "testo": "principio: «la riservatezza sulle dichiarazioni e sulle attività svolte nel corso dei programmi di giustizia riparativa» (art. 43, c. 1, lett. e). Il dovere di mediatori e personale è nell'art. 50 (parafrasi della Ricerca 12).", "fonte": "d.lgs. 150/2022, art. 43, c. 1, lett. e); art. 50", "inglese": "confidentiality", "dnc": "segreto del mediatore"}, {"ti": "Ragionevolezza e proporzionalità degli esiti", "slug": "concetto-ragionevolezza-proporzionalita-esiti", "semplice": "L'accordo finale deve essere ragionevole e misurato. Non può chiedere a nessuno più di quanto sia giusto.", "testo": "«la ragionevolezza e proporzionalità degli eventuali esiti riparativi consensualmente raggiunti»", "fonte": "d.lgs. 150/2022, art. 43, c. 1, lett. f)"}, {"ti": "Equiprossimità", "slug": "concetto-equiprossimita", "semplice": "Il mediatore non sta da una parte. Sta vicino a ciascuna persona allo stesso modo.", "testo": "«l'indipendenza dei mediatori e la loro equiprossimità rispetto ai partecipanti ai programmi di giustizia riparativa»", "fonte": "d.lgs. 150/2022, art. 43, c. 1, lett. g)", "nota": "La Ricerca 07 non ha trovato chi ha introdotto la parola. Bortolato la spiega dicendo che il mediatore \"sta nel mezzo\", \"accanto a ogni partecipante\" (citazione da riscontrare).", "dnc": "neutralità"}, {"ti": "Tempo necessario", "slug": "concetto-tempo-necessario", "semplice": "Ogni percorso deve avere il tempo che gli serve.", "testo": "«la garanzia del tempo necessario allo svolgimento di ciascun programma»", "fonte": "d.lgs. 150/2022, art. 43, c. 1, lett. h)"}, {"ti": "Gratuità e accesso senza preclusioni", "slug": "concetto-accesso-senza-preclusioni", "semplice": "I percorsi sono gratuiti. Si possono chiedere per qualunque reato, anche grave, e in ogni momento: prima della querela per i reati che la richiedono, durante il processo, durante la pena e anche dopo.", "testo": "l'accesso «è gratuito» (art. 43, c. 3). I programmi «sono accessibili senza preclusioni in relazione alla fattispecie di reato o alla sua gravità» (art. 44, c. 1).", "fonte": "d.lgs. 150/2022, art. 43, c. 3; art. 44", "nota": "Per i detenuti al 41-bis vale un'eccezione introdotta dal d.l. 92/2024 (Ricerca 27)."}, {"ti": "Pericolo concreto per i partecipanti", "slug": "concetto-pericolo-concreto", "semplice": "L'accesso va sempre favorito. Si può limitare solo se il percorso stesso mette in pericolo reale chi partecipa.", "testo": "«L'accesso ai programmi di giustizia riparativa è sempre favorito, senza discriminazioni e nel rispetto della dignità di ogni persona. Può essere limitato soltanto in caso di pericolo concreto per i partecipanti, derivante dallo svolgimento del programma.»", "fonte": "d.lgs. 150/2022, art. 43, c. 4"}]}, {"t": "Il percorso in pratica", "v": [{"ti": "Invio al Centro", "slug": "concetto-invio-al-centro", "semplice": "È la decisione con cui un giudice o un pubblico ministero manda le persone al Centro per valutare un percorso. Il Centro poi sente le persone, e il percorso parte solo se tutti sono d'accordo.", "testo": "Provvedimento dell'autorità giudiziaria, anche d'ufficio: ordinanza del giudice o, nelle indagini, decreto del pubblico ministero (parafrasi della Ricerca 08).", "fonte": "art. 129-bis c.p.p.; Linee guida DGMC 2026 (tramite Ricerca 08)", "inglese": "referral", "dnc": "accesso diretto al Centro", "nota": "Il rapporto GREVIO 2025 sull'Italia scrive che i giudici inviano ai Centri «without the consent of the victim» (Ricerche 15 e 26). L'invio e la partecipazione sono due momenti diversi: per partecipare il consenso serve sempre."}, {"ti": "Accesso diretto al Centro", "slug": "concetto-accesso-diretto-al-centro", "semplice": "Ci si può rivolgere al Centro di propria iniziativa, senza passare dal giudice. Per i reati per cui serve la querela, si può fare anche prima di presentarla.", "testo": "per i delitti a querela si può accedere «anche prima che la stessa sia stata proposta» (art. 44, c. 3). Il resto è una parafrasi della Ricerca 08 sulle linee guida.", "fonte": "d.lgs. 150/2022, art. 44, c. 3; Ricerca 08", "inglese": "self-referral", "dnc": "invio al Centro"}, {"ti": "Colloquio preliminare", "slug": "concetto-colloquio-preliminare", "semplice": "Prima di ogni incontro, i mediatori parlano con ogni persona da sola. Spiegano come funziona, ascoltano, raccolgono il consenso e valutano se il percorso si può fare.", "testo": "parafrasi della Ricerca 08 dalla Carta del Centro di Trento-Alto Adige (2024, p. 8) e dal vademecum Brunelli e altre (p. 26).", "fonte": "d.lgs. 150/2022, art. 54; Ricerca 08", "inglese": "preliminary meeting"}, {"ti": "Mediazione", "slug": "programma-mediazione-autore-vittima", "semplice": "L'incontro tra chi ha subito il reato e chi ne è accusato, con almeno due mediatori. Può allargarsi ai familiari. È uno dei programmi previsti dalla legge.", "testo": "«la mediazione tra la persona indicata come autore dell'offesa e la vittima del reato, anche estesa ai gruppi parentali, ovvero tra la persona indicata come autore dell'offesa e la vittima di un reato diverso da quello per cui si procede»", "fonte": "d.lgs. 150/2022, art. 53, c. 1, lett. a)", "inglese": "victim-offender mediation", "dnc": "mediazione civile, mediazione familiare"}, {"ti": "Dialogo riparativo", "slug": "programma-dialogo-riparativo", "semplice": "Un altro programma previsto dalla legge. La legge lo nomina ma non lo definisce.", "testo": "«il dialogo riparativo»", "fonte": "d.lgs. 150/2022, art. 53, c. 1, lett. b)", "nota": "Le forme che il dialogo riparativo prende nei Centri sono descritte nella Ricerca 09."}, {"ti": "Mediazione indiretta", "slug": "concetto-mediazione-indiretta", "semplice": "Un percorso in cui le persone non si incontrano. I mediatori portano lettere o messaggi dall'una all'altra.", "testo": "parafrasi della Ricerca 08 (Carta del Centro di Trento-Alto Adige 2024, § 2.2; linee DGM 2008; indagine AGIA 2023).", "fonte": "Ricerca 08", "inglese": "indirect mediation; shuttle mediation"}, {"ti": "Vittima surrogata (o aspecifica)", "slug": "concetto-vittima-surrogata", "semplice": "Una persona che ha subito un reato simile, ma non quello di cui si parla. Partecipa al posto della vittima diretta, per esempio quando questa non vuole o non può.", "testo": "la legge prevede la mediazione con «la vittima di un reato diverso da quello per cui si procede» (art. 53, c. 1, lett. a). Bortolato la descrive come \"la vittima di un reato e non del reato\" (citazione da riscontrare, Ricerca 07).", "fonte": "d.lgs. 150/2022, art. 53, c. 1, lett. a)", "nota": "Secondo la Ricerca 00, Bouchard ne ha segnalato il rischio di una seconda vittimizzazione."}, {"ti": "Persona di supporto", "slug": "concetto-persona-di-supporto", "semplice": "Una persona di fiducia, scelta dalla vittima o dalla persona accusata, che può partecipare al percorso.", "testo": "parafrasi della Ricerca 08 sull'art. 45, c. 1, lett. c), d.lgs. 150/2022 («altri soggetti appartenenti alla comunità»).", "fonte": "d.lgs. 150/2022, art. 45; Ricerca 08", "inglese": "support person"}, {"ti": "Co-mediazione", "slug": "concetto-co-mediazione", "semplice": "I percorsi sono guidati da almeno due mediatori insieme.", "testo": "i programmi «vengono svolti da almeno due mediatori» (art. 53, c. 1).", "fonte": "d.lgs. 150/2022, art. 53, c. 1", "inglese": "co-mediation"}, {"ti": "Relazione del mediatore", "slug": "concetto-relazione-del-mediatore", "semplice": "Alla fine, i mediatori mandano al giudice una relazione breve. Dice che cosa si è fatto e se c'è stato un esito, oppure che il percorso non si è fatto o si è interrotto. Non racconta quello che le persone si sono dette.", "testo": "parafrasi della Ricerca 08 (Linee guida di Torino, pp. 11-12; Carta del Centro di Trento-Alto Adige, p. 12; art. 57 d.lgs. 150/2022).", "fonte": "d.lgs. 150/2022, art. 57; Ricerca 08"}, {"ti": "Sospensione del procedimento", "slug": "concetto-sospensione-per-programma-riparativo", "semplice": "Per i reati per cui serve la querela, il giudice può fermare il processo fino a centottanta giorni, se l'imputato lo chiede, per lasciare tempo al percorso. Nel frattempo si fermano anche i termini di prescrizione.", "testo": "«Nel caso di reati perseguibili a querela soggetta a remissione, il giudice, a richiesta dell'imputato, può disporre con ordinanza la sospensione del processo per un periodo non superiore a centottanta giorni, al fine di consentire lo svolgimento del programma di giustizia riparativa.»", "fonte": "art. 129-bis, c. 4, c.p.p., testo vigente dal 2024-04-04 (d.lgs. 31/2024), letto su Normattiva (Ricerca 04c)", "nota": "Prima dell'azione penale decide il giudice per le indagini preliminari, sentito il pubblico ministero (c. 4-bis). Il c. 4-ter sospende la prescrizione e i termini dell'art. 344-bis (parafrasi della Ricerca 04c)."}, {"ti": "Remissione tacita di querela", "slug": "concetto-remissione-tacita-di-querela", "semplice": "Se chi ha presentato la querela partecipa a un percorso che si chiude con un esito riparativo, la legge considera la querela ritirata, e il reato si estingue. Se l'accordo contiene impegni della persona accusata, conta solo quando sono stati rispettati.", "testo": "parafrasi della Ricerca 10 sull'art. 152 c.p. come modificato dal d.lgs. 150/2022.", "fonte": "art. 152, terzo comma, n. 2, c.p., letto su Normattiva (Ricerca 04c)"}, {"ti": "Impegni comportamentali", "slug": "concetto-impegni-comportamentali", "semplice": "Promesse che la persona accusata prende nell'accordo finale, per esempio sul proprio comportamento. Il giudice ne tiene conto quando sono state rispettate.", "testo": "«Qualora l'esito riparativo comporti l'assunzione da parte dell'imputato di impegni comportamentali» (citazione della Ricerca 10, da riscontrare); il resto è parafrasi.", "fonte": "artt. 62 n. 6 e 152 c.p. (tramite Ricerca 10)"}]}, {"t": "Chi conduce i percorsi", "v": [{"ti": "Mediatore esperto", "slug": "concetto-mediatore-esperto", "semplice": "La persona che guida i percorsi. Ha una formazione specifica, ha superato una prova finale ed è iscritta in un elenco del Ministero della giustizia.", "testo": "artt. 59-60 d.lgs. 150/2022; d.m. 9 giugno 2023 (Ricerca 12).", "fonte": "d.lgs. 150/2022, artt. 59-60", "dnc": "mediatore familiare, mediatore civile e commerciale"}, {"ti": "Mediatore esperto formatore", "slug": "concetto-mediatore-esperto-formatore", "semplice": "Un mediatore con una qualifica in più. Cura la formazione pratica nei Centri e fa parte delle commissioni d'esame.", "testo": "parafrasi della Ricerca 12.", "fonte": "d.lgs. 150/2022, art. 59, c. 7; d.m. elenco, art. 10", "inglese": "trainer mediator (da verificare)"}, {"ti": "Formazione continua", "slug": "concetto-formazione-continua-mediatori", "semplice": "Per restare nell'elenco, i mediatori devono aggiornarsi ogni anno.", "testo": "almeno 30 ore secondo la legge, almeno 60 secondo il d.m. (parafrasi della Ricerca 12; la differenza va spiegata nel testo).", "fonte": "d.lgs. 150/2022, art. 59, c. 4; d.m. formazione, art. 10"}, {"ti": "Prova di ammissione e prova finale", "slug": "concetto-prova-finale-mediatori", "semplice": "Per diventare mediatore esperto serve una laurea. Poi si passa un colloquio di ammissione, si fa il corso e si supera una prova finale davanti a una commissione.", "testo": "parafrasi della Ricerca 12. Ammissione: colloquio pubblico su curriculum e lettera motivazionale. Prova finale: prova teorica e simulazione pratica davanti ad almeno cinque membri.", "fonte": "d.lgs. 150/2022, art. 59, cc. 8-9; d.m. formazione, artt. 8-9", "nota": "Voce che riunisce due schede (concetto-prova-di-ammissione-mediatori e concetto-prova-finale-mediatori)."}, {"ti": "Supervisione", "slug": "concetto-supervisione-mediatori", "semplice": "I mediatori discutono i loro casi con colleghi più esperti, per ricevere sostegno e per controllare la qualità del lavoro.", "testo": "la CM/Rec(2018)8 chiede formazione dei responsabili sulla supervisione dei casi (regole 38 e 44, parafrasi della Ricerca 12).", "fonte": "CM/Rec(2018)8, regole 38 e 44", "inglese": "case supervision"}, {"ti": "Segreto del mediatore", "slug": "concetto-segreto-del-mediatore", "semplice": "Il mediatore non può essere obbligato a testimoniare su quello che ha sentito nel percorso, salvo eccezioni.", "testo": "parafrasi della Ricerca 12 (art. 52; si applica l'art. 200 c.p.p. in quanto compatibile).", "fonte": "d.lgs. 150/2022, art. 52", "dnc": "riservatezza"}, {"ti": "Incompatibilità del mediatore", "slug": "concetto-incompatibilita-mediatore-esperto", "semplice": "Alcune persone non possono fare i mediatori, o non possono seguire certi casi: per esempio chi ha cariche politiche o è magistrato onorario nello stesso distretto.", "testo": "parafrasi della Ricerca 12 (d.m. elenco, art. 19, modificato dal d.m. 15 dicembre 2023).", "fonte": "d.m. 9 giugno 2023, art. 19"}, {"ti": "Mediatori dei servizi minorili e degli UEPE", "slug": "concetto-mediatori-ussm-uepe-art-93", "semplice": "Funzionari dei servizi della giustizia minorile o degli uffici per l'esecuzione penale esterna, con formazione ed esperienza, inseriti nell'elenco con una regola transitoria.", "testo": "parafrasi della Ricerca 12.", "fonte": "d.lgs. 150/2022, art. 93, c. 1, lett. c)"}, {"ti": "Mediatore familiare", "slug": "concetto-mediatore-familiare", "semplice": "Un'altra professione: aiuta le coppie che si separano. Non è un mediatore della giustizia riparativa.", "testo": "parafrasi della Ricerca 12 (d.m. 27 ottobre 2023, n. 151).", "fonte": "d.m. 151/2023", "dnc": "mediatore esperto"}, {"ti": "Mediatore civile e commerciale", "slug": "concetto-mediatore-civile", "semplice": "Un'altra professione: aiuta a risolvere liti di soldi, contratti, eredità. Non è un mediatore della giustizia riparativa.", "testo": "parafrasi della Ricerca 12 (d.lgs. 28/2010; d.m. 150/2023).", "fonte": "d.m. 24 ottobre 2023, n. 150", "dnc": "mediatore esperto"}]}, {"t": "Parole dei testi internazionali", "v": [{"ti": "Programma di giustizia riparativa (ONU)", "slug": "concetto-programma-di-giustizia-riparativa", "semplice": "Per l'ONU è ogni programma che usa processi riparativi e cerca di arrivare a esiti riparativi.", "testo": "«\"Restorative justice programme\" means any programme that uses restorative processes and seeks to achieve restorative outcomes.»", "fonte": "ECOSOC 2002/12, Basic Principles, par. 1 (Ricerca 15)", "inglese": "restorative justice programme"}, {"ti": "Facilitatore", "slug": "concetto-facilitatore", "semplice": "È la parola usata nei testi internazionali per chi guida l'incontro. La legge italiana dice \"mediatore\".", "testo": "«\"Facilitator\" means a person whose role is to facilitate, in a fair and impartial manner,» (il seguito è parafrasato dalla Ricerca 15)", "fonte": "ECOSOC 2002/12, par. 5; CM/Rec(2018)8, regola 3", "inglese": "facilitator"}, {"ti": "Mediazione penale (Unione europea, 2001)", "slug": "concetto-mediazione-penale", "semplice": "La prima definizione europea, del 2001: la ricerca di una soluzione concordata tra vittima e autore, prima o durante il processo, con l'aiuto di un mediatore.", "testo": "«la ricerca, prima o durante il procedimento penale, di una soluzione negoziata tra la vittima e l'autore del reato» (il seguito è parafrasato dalla Ricerca 15)", "fonte": "Decisione quadro 2001/220/GAI, art. 1, lett. e)", "inglese": "mediation in criminal cases", "nota": "La decisione quadro è stata sostituita dalla direttiva 2012/29/UE."}, {"ti": "Divieto di metodi alternativi obbligatori", "slug": "concetto-metodi-alternativi-obbligatori", "semplice": "La Convenzione di Istanbul vieta che nei casi di violenza contro le donne e di violenza domestica una persona sia obbligata a passare per una mediazione o una conciliazione.", "testo": "«Parties shall take the necessary legislative or other measures to prohibit mandatory alternative dispute resolution processes, including mediation and conciliation» (testo da riscontrare, Ricerche 15 e 26)", "fonte": "Convenzione di Istanbul (CETS 210), art. 48, par. 1", "inglese": "mandatory alternative dispute resolution processes"}, {"ti": "Processo quasi-riparativo", "slug": "concetto-processo-quasi-riparativo", "semplice": "Per l'ONU sono programmi che somigliano alla giustizia riparativa ma spesso non coinvolgono la vittima, come certi comitati di cittadini.", "testo": "UNODC 2020 raggruppa nella sez. 3.3 i «Quasi-restorative justice processes», tra cui i community panels and boards (p. 37). Parafrasi e citazione dalla Ricerca 09.", "fonte": "UNODC, Handbook on Restorative Justice Programmes, 2a ed. 2020", "inglese": "quasi-restorative process"}, {"ti": "Vittima secondaria (indiretta)", "slug": "concetto-vittima-secondaria", "semplice": "Persone della famiglia o del territorio colpite indirettamente dal reato. In alcuni Centri possono partecipare a una mediazione allargata.", "testo": "parafrasi della Ricerca 09 dalla Carta del Centro di Trento-Alto Adige 2024.", "fonte": "Ricerca 09", "inglese": "secondary victim; indirect victim", "dnc": "vittima secondaria in senso di vittimizzazione secondaria (il danno causato alla vittima dal processo)"}, {"ti": "Pratiche riparative", "slug": "concetto-pratiche-riparative", "semplice": "Un modo di lavorare con i gruppi (per esempio a scuola) che usa gli stessi strumenti della giustizia riparativa, anche quando non c'è un reato.", "testo": "Secondo Wachtel (IIRP 2016) le restorative practices sono \"a social science that studies how to build social capital\"; la giustizia riparativa ne è \"a subset\" (citazioni da riscontrare, Ricerca 07).", "fonte": "opera-2016-wachtel-defining-restorative", "inglese": "restorative practices"}, {"ti": "Città riparativa", "slug": "concetto-citta-riparativa", "semplice": "Un progetto in cui una città intera usa i cerchi e l'ascolto riparativo, con detenuti, magistrati, avvocati, volontari, studenti e cittadini.", "testo": "parafrasi della Ricerca 09 (esempio di Tempio Pausania).", "fonte": "Ricerca 09", "inglese": "restorative city"}, {"ti": "Oggetto della parola", "slug": "concetto-talking-piece", "semplice": "Nei cerchi, un oggetto che passa di mano in mano. Parla solo chi lo tiene.", "testo": "parafrasi della Ricerca 09 (programma New Leaf di Prison Fellowship International).", "fonte": "Ricerca 09", "inglese": "talking piece"}]}, {"t": "Parole degli studiosi", "v": [{"ti": "Restituzione creativa", "slug": "concetto-restituzione-creativa", "semplice": "Un'idea di Albert Eglash, del 1958: chi ha commesso un reato, con un sostegno, trova da sé un modo costruttivo per rimediare.", "testo": "parafrasi della Ricerca 07 (tramite L. Mirsky, IIRP).", "fonte": "opera-1958-eglash-creative-restitution", "inglese": "creative restitution"}, {"ti": "Il conflitto come proprietà delle parti", "slug": "concetto-conflitto-come-proprieta", "semplice": "Secondo Nils Christie (1977), lo Stato ha tolto i conflitti alle persone coinvolte. Andrebbero restituiti a loro.", "testo": "«conflicts have been taken away from the parties directly involved» (da riscontrare)", "fonte": "opera-1977-christie-conflicts-as-property", "inglese": "conflicts as property"}, {"ti": "Cambiare lenti", "slug": "concetto-cambiare-lenti", "semplice": "Secondo Howard Zehr (1990), il reato va guardato come un danno fatto a persone e relazioni, che crea l'obbligo di rimediare.", "testo": "«Crime is a violation of people and relationships. It creates obligations to make things right» (citato da terzi, da riscontrare)", "fonte": "opera-1990-zehr-changing-lenses", "inglese": "changing lenses"}, {"ti": "Restituzione come paradigma", "slug": "concetto-restituzione-come-paradigma", "semplice": "Secondo Randy Barnett (1977), al posto della punizione si potrebbe mettere al centro la restituzione alla vittima.", "testo": "«a new paradigm of criminal justice-restitution» (abstract, da riscontrare)", "fonte": "opera-1977-barnett-restitution-new-paradigm-criminal-justice", "inglese": "restitution paradigm"}, {"ti": "Vergogna reintegrativa", "slug": "concetto-reintegrative-shaming", "semplice": "Un'idea di John Braithwaite (1989): disapprovare il gesto, ma trattare la persona come fondamentalmente buona. Il contrario è la stigmatizzazione.", "testo": "parafrasi della Ricerca 07. Secondo Daly e Hayes è alla base del conferencing di Wagga Wagga.", "fonte": "opera-1989-braithwaite-crime-shame-reintegration", "inglese": "reintegrative shaming"}, {"ti": "Regolazione responsiva", "slug": "concetto-regolazione-responsiva", "semplice": "Secondo Braithwaite, si comincia con le risposte più leggere e dialoganti, e si sale verso quelle più dure solo se servono. Si disegna come una piramide.", "testo": "«Responsive regulation is about 'tripartism' in regulation» (da riscontrare); il resto è parafrasi della Ricerca 07.", "fonte": "opera-1992-ayres-braithwaite-responsive-regulation", "inglese": "responsive regulation"}, {"ti": "Modello massimalista", "slug": "concetto-modello-massimalista", "semplice": "Per alcuni studiosi è giustizia riparativa ogni azione che ripara il danno del reato, anche se le persone non si incontrano.", "testo": "«Restorative justice is every action that is primarily oriented toward doing justice by repairing the harm caused by a crime» (Bazemore e Walgrave 1999, abstract; il testo esatto è in conflitto, Ricerca 07)", "fonte": "opera-1999-bazemore-walgrave-restorative-juvenile-justice", "inglese": "maximalist model", "dnc": "modello purista"}, {"ti": "Modello purista", "slug": "concetto-modello-purista", "semplice": "Per altri studiosi è giustizia riparativa solo un processo volontario in cui le persone coinvolte decidono insieme.", "testo": "parafrasi della Ricerca 07 (McCold 2000).", "fonte": "opera-2000-mccold-holistic-vision-restorative-juvenile-justice", "inglese": "purist model", "dnc": "modello massimalista", "nota": "Walgrave usa \"minimaliste\" per una posizione simile. Le fonti lette non dicono se le due parole sono sinonimi (Ricerca 07, conflitto 5)."}, {"ti": "Tre concezioni della giustizia riparativa", "slug": "concetto-concezioni-giustizia-riparativa", "semplice": "Secondo Daniel Van Ness si può intendere la giustizia riparativa in tre modi: come incontro, come riparazione del danno, come trasformazione delle relazioni.", "testo": "«the encounter conception: people with a stake in a crime or misconduct come together» (da riscontrare); il resto è parafrasi della Ricerca 07.", "fonte": "opera-2007-johnstone-van-ness-handbook-restorative-justice", "inglese": "encounter, reparative, transformative conceptions"}, {"ti": "Mito delle origini", "slug": "concetto-mito-delle-origini", "semplice": "Kathleen Daly critica l'idea che la giustizia riparativa sia la forma più antica di giustizia. Secondo lei è un racconto costruito da chi la sostiene.", "testo": "i sostenitori costruiscono «'origin myths' about restorative justice» (da riscontrare)", "fonte": "opera-2002-daly-restorative-justice-real-story", "inglese": "origin myth"}, {"ti": "Indigenizzazione", "slug": "concetto-indigenizzazione", "semplice": "Juan Tauri critica il fatto che lo Stato prenda forme di giustizia dei popoli indigeni e le adatti ai propri processi.", "testo": "parafrasi della Ricerca 07.", "fonte": "opera-1998-tauri-family-group-conferencing-indigenisation", "inglese": "indigenisation"}, {"ti": "Giustizia trasformativa", "slug": "concetto-giustizia-trasformativa", "semplice": "Un approccio che vuole cambiare il modo in cui si comportano le famiglie e le comunità intorno alla vittima e all'autore. Mette al primo posto l'autonomia della vittima.", "testo": "parafrasi della Ricerca 07 (Coker 2002).", "fonte": "opera-2002-coker-transformative-justice", "inglese": "transformative justice", "dnc": "giustizia riparativa"}, {"ti": "Paradigma riparativo", "slug": "concetto-paradigma-riparativo", "semplice": "Secondo Roberto Bartoli la giustizia riparativa è un modo di pensare diverso da quello della punizione, non una sua variante.", "testo": "«La giustizia riparativa è un paradigma altro da quello punitivo» (Bartoli 2022, p. 1)", "fonte": "opera-2022-bartoli-breve-introduzione-giustizia-riparativa"}, {"ti": "Fraternità e diritto fraterno", "slug": "concetto-diritto-fraterno", "semplice": "Secondo Bartoli il fondamento della giustizia riparativa è la fraternità. Riprende l'idea di \"diritto fraterno\" di Eligio Resta.", "testo": "«il fondamento ultimo della giustizia riparativa a me pare la fraternità, se non addirittura l'amore» (Bartoli 2022)", "fonte": "opera-2022-bartoli-breve-introduzione-giustizia-riparativa", "inglese": "fraternal law (non verificato)"}], "intro": "Queste voci riportano idee di autori. Sono sempre attribuite e non sono definizioni di legge. Le citazioni vengono dalla Ricerca 07 e vanno riscontrate sulle opere."}], "prog": [{"s": "programma-mediazione-autore-vittima", "ti": "Mediazione tra persona indicata come autore dell'offesa e vittima", "en": "victim-offender mediation (VOM); victim-offender reconciliation programme (VORP)", "chi": "persona indicata come autore dell'offesa; vittima del reato; persone di supporto (art. 55); almeno due mediatori", "come": "Incontro tra chi ha commesso il reato e chi lo ha subito, preparato da colloqui separati e guidato da almeno due mediatori; può chiudersi con un esito simbolico o materiale.", "quando": "in ogni stato e grado, in esecuzione e dopo (art. 44)", "base": "d.lgs. 150/2022, art. 53, c. 1, lett. a); artt. 54-57; ECOSOC 2002/12 par. 2; CM/Rec(2018)8 par. 5", "dove": "tutti i Centri (es. Trentino-Alto Adige, Bologna, Monza, Verona, Taranto, Matera)"}, {"s": "programma-mediazione-gruppi-parentali", "ti": "Mediazione estesa ai gruppi parentali", "en": "extended mediation (termine non trovato in fonti ufficiali)", "chi": "autore; vittima; familiari di entrambi; per la Carta TAA anche vittime secondarie e soggetti del territorio; almeno due mediatori", "come": "Mediazione a cui partecipano anche i familiari di autore e vittima; nei Centri si chiama spesso «mediazione allargata». La legge non la definisce.", "quando": "quando familiari o territorio sono toccati dal reato", "base": "d.lgs. 150/2022, art. 53, c. 1, lett. a); art. 45", "dove": "Trentino-Alto Adige; Torino; Lazio (2021-2023); Taranto e Matera (dichiarata)"}, {"s": "programma-mediazione-aspecifica", "ti": "Mediazione con la vittima di un reato diverso (\"aspecifica\" o con \"vittima surrogata\")", "en": "surrogate victim mediation; victim surrogate programme (UNODC 2020, p. 23)", "chi": "persona indicata come autore; vittima di un reato analogo non legata al caso; almeno due mediatori", "come": "Incontro tra l'autore e una persona che ha subito un reato dello stesso tipo, ma non da lui; si usa quando la vittima diretta non c'è o non vuole.", "quando": "vittima diretta assente, contraria o incontro inopportuno; molto tempo trascorso", "base": "d.lgs. 150/2022, art. 53, c. 1, lett. a), seconda parte", "dove": "Trentino-Alto Adige; Milano; Padova; Monza; Venezia; San Fermo della Battaglia; carceri"}, {"s": "programma-dialogo-riparativo", "ti": "Dialogo riparativo", "en": "restorative dialogue", "chi": "non definiti dalla legge; autore, vittima, a volte familiari e comunità (Monza, stampa); almeno due mediatori", "come": "Programma nominato dall'art. 53, lett. b), senza definizione ufficiale; i commentatori lo descrivono come dialogo diretto o indiretto, a volte di gruppo.", "quando": "non indicato dalle fonti", "base": "d.lgs. 150/2022, art. 53, c. 1, lett. b)", "dove": "Monza («di gruppo»); Venezia («allargati»); Bari; Cagliari; Taranto; Matera (dichiarato)"}, {"s": "programma-altri-programmi-dialogici", "ti": "Ogni altro programma dialogico guidato da mediatori", "en": "other dialogue-based programmes", "chi": "vittima; autore; familiari; comunità; almeno due mediatori", "come": "Categoria aperta dell'art. 53, lett. c): comprende cerchi, conferenze, victim panel e altri progr
