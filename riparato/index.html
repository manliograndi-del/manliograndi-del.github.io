 D.centri.forEach(c=>add('Centri',c.ti,'#centri',[c.co,c.di,c.re,c.ind,c.ges].filter(Boolean).join(' ')));
 D.eventi.forEach(e=>add('Linea del tempo',e.ti,'#linea-del-tempo',''));
 (D.mondo||[]).forEach(e=>add('Linea del tempo · Nel mondo',e.ti,'#linea-del-tempo',e.pa?nomePaese(e.pa):''));
 D.biblio.forEach(g=>g.o.forEach(o=>add('Biblioteca',o.ti,'#biblioteca',o.au+' '+o.de)));
 D.dib.pos.forEach(p=>add('Il dibattito',p.chi,'#dibattito-'+p.k[0],p.x));
 D.num.forEach(g=>g.r.forEach(r=>add('Dati',r['cosa misura'],'#dati-italia',r['valore']+' '+(r['periodo']||'')+' '+(r['ente']||''))));
 D.reati.forEach(g=>g.r.forEach(r=>add('Per quali reati',r.re,'#dati-reati',g.t+' · '+r.per)));
 D.costi.forEach(g=>g.r.forEach(r=>add('Quanto costa',r['cosa misura'],'#dati-costi',r['valore']+' '+(r['unità']||'')+' '+(r['ente']||''))));
 D.studi.concat(D.studi_it).forEach(g=>g.r.forEach(r=>add('Studi',(r['autori']||r['autori o ente']||'')+' ('+(r['anno']||'')+')','#dati-studi',r['risultato principale']||'')));
 return INDICE=I;
}
function risultati(q){
 const w=norm(q).split(/\s+/).filter(x=>x.length>1);if(!w.length)return '';
 const r=indice().filter(i=>w.every(x=>i.n.includes(x)));
 const pezzo=i=>{const n=norm(i.x),j=n.indexOf(w[0]);if(j<0)return i.x.slice(0,140);const a=Math.max(0,j-60);return (a?'…':'')+i.x.slice(a,a+160)+'…'};
 return `<p style="color:var(--muted)">${r.length} risultati${r.length>60?', mostrati i primi 60':''}.</p>`+r.slice(0,60).map(i=>`<a class="risultato" href="${i.h}"><small>${esc(i.k)}</small><b>${esc(i.t)}</b><small>${esc(pezzo(i))}</small></a>`).join('');
}
function cerca(){
 return `<div class="prose"><h1>Cerca nel sito</h1>
 <p>La ricerca guarda le parole in tutte le pagine: glossario, domande, articoli di legge, programmi, decisioni dei giudici, esperienze, Paesi, Centri, linea del tempo e biblioteca. Funziona nel tuo browser e non usa servizi esterni.</p>
 <p><label for="cq"><b>Che cosa cerchi?</b></label><br><input id="cq" type="search" autocomplete="off" value="${esc(CQ)}" placeholder="per esempio: querela, minori, Belgio"></p>
 <div id="cr">${risultati(CQ)}</div></div>`;
}
V.addEventListener('input',e=>{if(e.target.id!=='cq')return;CQ=e.target.value;V.querySelector('#cr').innerHTML=risultati(CQ);});
const DATI_P=[['dati','In sintesi'],['dati-italia','Numeri in Italia'],['dati-costi','Quanto costa'],['dati-reati','Per quali reati'],['dati-studi','Studi']];
const cifra=r=>`<div class="cifra"><div class="v">${esc(r['valore'])}</div><div>${esc(r['cosa misura'])}<small>${esc(r['unità']||'')}${r['periodo']?' · '+esc(r['periodo']):''}${r['ambito territoriale']?' · '+esc(r['ambito territoriale']):''}</small><small>Fonte: ${esc(r['ente']||'')}${r['documento e pagina']?', '+esc(r['documento e pagina']):''} · ${esc(r['tipo']||'')}</small></div></div>`;
const studio=r=>`<div class="studio"><p><b>${esc(r['autori']||r['autori o ente']||'')}</b> (${esc(r['anno']||'')}) · ${esc(r['disegno']||'')}</p><p>${esc(r['risultato principale']||'')}</p><small>${esc(r['Paesi']||r['luogo']||'')}${r['campione']?' · campione: '+esc(r['campione']):''}${r['limiti dichiarati']?' · limiti dichiarati: '+esc(r['limiti dichiarati']):''}</small></div>`;
const gruppo=(g,f,aperto)=>`<details class="faq"${aperto?' open':''}><summary>${esc(g.t)} (${g.r.length})</summary>${corto(g.r,f)}</details>`;
const testaDati=(qui,tit)=>`<span class="etichetta">Sezione 6 · Dati e ricerca</span>${schede(DATI_P,qui)}<h1>${tit}</h1>`;
function dati(){
 const porta=(h,t,b)=>`<a class="porta-d" href="#${h}"><b>${t} →</b>${b}</a>`;
 return `<div class="prose">${testaDati('dati','I numeri e gli studi')}
 <p>Qui ci sono le cifre ufficiali sulla giustizia riparativa in Italia e i risultati degli studi, italiani e stranieri. Ogni cifra è scritta come nella fonte, senza calcoli nostri. Quando due fonti danno numeri diversi, li riportiamo entrambi. <span class="bozza">da riscontrare</span></p>
 ${porta('dati-italia','Numeri in Italia',`<span>${D.num.reduce((a,g)=>a+g.r.length,0)} cifre: Centri, mediatori, Fondo, percorsi.</span>`)}
 ${porta('dati-costi','Quanto costa',`<span>${D.costi.reduce((a,g)=>a+g.r.length,0)} cifre: stanziamenti, costo dei Centri, costi e benefici all'estero.</span>`)}
 ${porta('dati-reati','Per quali reati',`<span>${D.reati.reduce((a,g)=>a+g.r.length,0)} cifre in ${D.reati.length} tabelle: Italia prima e dopo la riforma, altri Paesi.</span>`)}
 ${porta('dati-studi','Che cosa dicono gli studi',`<span>${D.studi.concat(D.studi_it).reduce((a,g)=>a+g.r.length,0)} studi, nel mondo e in Italia.</span>`)}</div>`;
}
function datiItalia(){
 return `<div class="prose">${testaDati('dati-italia','I numeri in Italia')}
 <div class="breve"><b>In breve</b><p style="margin:.4rem 0 0">Nell'elenco ufficiale dei mediatori esperti ci sono 375 iscritti (conteggio del 12 novembre 2026). Il decreto di riparto del Fondo per il 2025 assegna 224.000 euro a ciascun ente che ospita un Centro. Sul numero di percorsi svolti dopo la riforma i dati nazionali mancano.</p></div>
 <details class="faq"><summary>Perché i numeri dei Centri non coincidono</summary><p>Le fonti contano cose diverse. 35 sono gli enti che hanno firmato i protocolli con il Ministero; 36 i servizi ammessi al riparto del Fondo e le voci dell'elenco ministeriale ad agosto 2026; 37 i Centri «già avviati» e 40 quelli previsti secondo il viceministro Sisto (ottobre 2026); 34-36 l'obiettivo del Ministero per il 2026. Anche per i fondi lo stesso decreto del 2025 riporta due totali: 8.966.598 euro nell'articolo 1 e 8.064.000 euro nella tabella allegata. Li riportiamo tutti, ciascuno con la sua fonte.</p></details>
 <details class="faq"><summary>I dati che mancano</summary><p>Non abbiamo trovato cifre nazionali su quante persone vengono inviate ai Centri dai giudici, quante chiedono di accedere da sole, quanti percorsi si concludono e con quale esito, per quali reati e in quale fase del processo. La legge prevede una relazione annuale della Conferenza nazionale al Parlamento (art. 61): nelle pagine lette non risulta pubblicata. Ci sono solo una dichiarazione del viceministro (585 persone in carico in 22 Centri, 432 minorenni in 37 Centri, ottobre 2026) e pochi dati locali (Milano, Como, Trentino-Alto Adige).</p></details>
 ${D.num.map((g,i)=>gruppo(g,cifra,i===0)).join('')}</div>`;
}
function datiCosti(){
 return `<div class="prose">${testaDati('dati-costi','Quanto costa')}
 <div class="breve"><b>In breve</b><p style="margin:.4rem 0 0">Il Fondo per la giustizia riparativa vale 8.966.598 euro l'anno nel bilancio 2024-2026; nel 2024 un decreto-legge lo ha ridotto di 8.966.500 euro (fonte unica). La cifra iniziale del 2022, 4.438.524 euro, era calcolata soprattutto sul compenso di 290 mediatori a 17,63 euro l'ora. Oggi ogni ente che ospita un Centro riceve fino a 224.000 euro l'anno; Verona e un servizio in Sardegna pagano i mediatori 25 euro l'ora. Nessuna fonte italiana dichiara quanto costa un singolo percorso. Non abbiamo trovato quanto è stato effettivamente speso.</p><p style="margin:.6rem 0 0">All'estero il costo per caso va da 515 euro (Finlandia, 2023) a 1.350 euro per percorso concluso con accordo (Paesi Bassi) e a qualche migliaio di sterline negli esperimenti inglesi. Le analisi di costi e benefici danno risultati diversi a seconda del programma: per esempio, nello Stato di Washington i benefici superano i costi per i minori ma non per gli adulti. Molte contano come beneficio solo i reati evitati.</p></div>
 ${D.costi.map(g=>gruppo(g,cifra,false)).join('')}</div>`;
}
function datiReati(){
 return `<div class="prose">${testaDati('dati-reati','Per quali reati')}
 <div class="breve"><b>In breve</b><p style="margin:.4rem 0 0">In Italia, dopo la riforma, non c'è una statistica dei percorsi divisi per reato, né nazionale né di un singolo Centro. C'è un solo conteggio, riportato in una nota di dottrina: a Milano, su 30 casi inviati, 11 riguardavano maltrattamenti in famiglia, 4 atti persecutori e 2 violenze sessuali; per gli altri 13 il reato non è indicato. Palermo elenca i reati senza cifre, dal furto all'omicidio, e dice in quale fase arrivano le richieste: 28 su 44 durante l'esecuzione della pena.</p><p style="margin:.6rem 0 0">All'estero le statistiche complete mostrano un quadro vario. In Germania (2010) quasi metà dei reati riguarda lesioni e violenza fisica, poi ingiurie, minacce e danneggiamenti. In Irlanda (2019) un quarto dei casi riguarda la circolazione stradale. Nei Paesi Bassi (2024) il 40% riguarda la violenza e il 29% i reati sessuali. Le fonti usano categorie diverse e non vanno sommate.</p></div>
 <details class="faq"><summary>Come leggere queste tabelle</summary><p>Ogni tabella è riportata com'è nella fonte, con le sue categorie di reato. Alcune contano i reati, altre i casi, le persone o gli invii. Le percentuali segnate «calcolo, non fonte» sono calcolate da noi sulle cifre della fonte. Le tabelle «Italia prima della riforma» danno spesso i reati di <b>tutti</b> i procedimenti di un ufficio (messa alla prova, giudice di pace), non dei soli casi con un percorso riparativo: sono dati di contesto.</p></details>
 ${[['A','Italia dopo la riforma'],['B','Italia prima della riforma (dati di contesto)'],['C','Nel mondo']].map(([k,n])=>`<h3 style="margin-top:1.6rem">${n}</h3>`+D.reati.filter(g=>g.p===k).map(g=>`<details class="faq"><summary>${esc(g.t)} (${g.r.length})</summary>${corto(g.r,r=>`<div class="rr"><div class="rr-n">${esc(r.re)}</div><div class="rr-v">${r.n&&r.n!=='—'?esc(r.n):''}${r.pc&&r.pc!=='—'&&r.pc!=='n.d.'?`<span>${esc(/^[\d,.]+$/.test(r.pc)?r.pc+'%':r.pc)}</span>`:''}</div><small>${esc(r.per)} · su ${esc(r.tot)}${r.am&&r.am!=='non indicato'?' · '+esc(r.am):''} · ${esc(r.doc)}</small></div>`)}${g.n?`<p class="rif">Nota della fonte: ${esc(g.n)}</p>`:''}</details>`).join('')).join('')}
</div>`;
}
function datiStudi(){
 return `<div class="prose">${testaDati('dati-studi','Che cosa dicono gli studi')}
 <h2 style="margin-top:1.4rem">Nel mondo</h2>
 <div class="breve"><b>In breve</b><p style="margin:.4rem 0 0">Le revisioni degli studi, per lo più di Paesi di lingua inglese, trovano in media una piccola riduzione dei nuovi reati, più chiara per i reati violenti e vicina a zero per quelli contro il patrimonio. Le vittime che partecipano sono in media più soddisfatte. Sugli effetti per la salute delle vittime i risultati sono meno coerenti. Chi partecipa lo sceglie, e questo rende difficile il confronto con chi non partecipa.</p></div>
 ${D.studi.map(g=>gruppo(g,studio,false)).join('')}
 <h2 style="margin-top:2.5rem">In Italia</h2>
 <div class="breve"><b>In breve</b><p style="margin:.4rem 0 0">Gli studi italiani con dati riguardano soprattutto i minori: per esempio un censimento dei primi servizi, pubblicato nel 2002, conta 566 mediazioni riuscite su 957 ragazzi inviati. Per gli adulti e per le vittime non è stata trovata nessuna valutazione italiana dei risultati. Dopo la riforma ci sono indagini sugli operatori, non sui magistrati.</p></div>
 ${D.studi_it.map(g=>gruppo(g,studio,false)).join('')}</div>`;
}
V.addEventListener('click',e=>{const a=e.target.closest('[data-vai]');if(!a)return;e.preventDefault();const s=V.querySelector('#'+a.dataset.vai);if(s)s.scrollIntoView({behavior:'smooth'});});
const ORI=[['favorevole','A favore','favorevole'],['favorevole con riserve','A favore, con riserve','riserve'],['critica','Critiche','critica'],['neutra','Altre voci','neutra']];
function contaOri(lista){return ORI.map(([o,l])=>[l,lista.filter(p=>p.o===o).length]).filter(x=>x[1])}
function dibattito(){
 const P=D.dib.pos,n=o=>P.filter(p=>p.o===o).length;
 return `<div class="prose"><span class="etichetta">Sezione 7 · Il dibattito</span><h1>Il dibattito</h1>
 <p class="intro">La maggior parte dei materiali su questo argomento è a favore della giustizia riparativa. Ma ci sono anche voci critiche, e qui le riportiamo accanto alle altre.</p>
 <p>Abbiamo raccolto ${P.length} prese di posizione pubbliche, dal 2021 a oggi: di avvocati, magistrati, studiosi, associazioni di vittime, centri antiviolenza, garanti, organizzazioni religiose, Governo, partiti e familiari di vittime. Ogni voce è riportata con le parole di chi l'ha espressa, senza commenti e senza etichette: in ogni tema le voci sono in ordine di data. Una voce può comparire in più temi. <span class="bozza">da riscontrare</span></p>
 <h2 style="margin-top:2rem">I temi</h2>
 ${D.dib.temi.map(tm=>{const l=P.filter(p=>p.k.includes(tm.k));return `<a class="tema-link" href="#dibattito-${tm.k}"><b>${esc(tm.t)}</b><small>${l.length} voci</small></a>`}).join('')}</div>`;
}
function dibattitoTema(k){
 const tm=D.dib.temi.find(x=>x.k===k);if(!tm)return nonTrovato();
 const l=D.dib.pos.filter(p=>p.k.includes(k)).sort((a,b)=>(a.d>b.d?1:-1));
 const voce=p=>`<div class="voce-dib"><p><b>${esc(p.chi)}</b> <small>· ${p.d?dataIt(p.d.slice(0,10)):''}${p.can?' · '+esc(p.can):''}</small></p><p>${esc(p.x)}</p>${p.f?`<small>Fonte: ${p.u?`<a href="${esc(p.u)}" rel="noopener" target="_blank">${esc(p.f)}</a>`:esc(p.f)}</small>`:''}</div>`;
 return `<div class="prose"><span class="etichetta">Sezione 7 · Il dibattito</span><h1>${esc(tm.t)}</h1>
 <p>${l.length} voci, in ordine di data. Le citazioni tra «» vanno riscontrate sulla fonte. <span class="bozza">da riscontrare</span></p>
 ${l.map(voce).join('')}
 <p style="margin-top:2rem"><a href="#dibattito">← Tutti i temi</a></p></div>`;
}
function nonTrovato(){return `<div class="prose"><h1>Pagina in preparazione</h1><p><a href="#home">Torna all'inizio</a></p></div>`}
const ROTTE={home,dati,'dati-italia':datiItalia,'dati-costi':datiCosti,'dati-reati':datiReati,'dati-studi':datiStudi,dibattito,domande,esperienze,biblioteca,glossario,programmi,giurisprudenza,cerca,'nel-mondo':nelMondo,'come-funziona':comeFunziona,'le-regole':regole,'linea-del-tempo':lineaTempo,centri};
const MENU={
 capire:[['home',"Che cos'è"],['glossario','Glossario'],['esperienze','Esperienze in Italia']],
 accedere:[['come-funziona','Come funziona'],['programmi','Tipi di percorso'],['domande','Domande frequenti'],['centri','Centri e mediatori']],
 approfondire:[['le-regole','La legge articolo per articolo'],['giurisprudenza','Sentenze'],['dati','Dati e costi'],['dibattito','Il dibattito'],['nel-mondo','Nel mondo']],
 archivio:[['linea-del-tempo','Linea del tempo'],['biblioteca','Libri, film e podcast']]};
let GRUPPO_PAG=null,PAG='home';
const SOTTO=document.getElementById('sotto');
function mostraSotto(g){
 SOTTO.innerHTML=g?MENU[g].map(([r,n])=>`<a href="#${r}"${r===PAG?' aria-current="page"':''}>${n}</a>`).join(''):'';
 document.querySelectorAll('nav.menu button').forEach(b=>{b.setAttribute('aria-expanded',b.dataset.g===g);b.classList.toggle('attivo',b.dataset.g===GRUPPO_PAG)});
 const c=SOTTO.querySelector('[aria-current]');if(c)SOTTO.scrollLeft=Math.max(0,c.offsetLeft-24);
}
document.querySelectorAll('nav.menu button').forEach(b=>b.addEventListener('click',()=>{const g=b.dataset.g;if(g===GRUPPO_PAG)mostraSotto(g);else location.hash=MENU[g][0][0];}));
function vai(){
 const h=location.hash.slice(1)||'home';
 let html;const m=h.match(/^art-(\d+)$/);
 html=m?articolo(m[1]):h.startsWith('dibattito-')?dibattitoTema(h.slice(10)):h.startsWith('parola-')?parola(h.slice(7)):/^caso-\d+$/.test(h)?caso(+h.slice(5)):h.startsWith('paese-')?paese(h):(ROTTE[h]||nonTrovato)();
 V.innerHTML=html;
 const pag=m?'le-regole':h.startsWith('dibattito-')?'dibattito':h.startsWith('dati-')?'dati':h.startsWith('parola-')?'glossario':h.startsWith('caso-')?'esperienze':h.startsWith('paese-')?'nel-mondo':h;
 const g=Object.keys(MENU).find(k=>MENU[k].some(x=>x[0]===pag))||null;
 GRUPPO_PAG=g;PAG=pag;mostraSotto(g);
 document.querySelectorAll('nav.menu a').forEach(a=>a.dataset.r===pag?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
 window.scrollTo(0,0);
}
addEventListener('hashchange',vai);vai();

const T=document.getElementById('tema');
function scuro(){const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
const T2=document.getElementById('tema2');
function etichettaTema(){T.textContent=T2.textContent=scuro()?'Tema chiaro':'Tema scuro'}
const cambiaTema=()=>{document.documentElement.dataset.theme=scuro()?'light':'dark';etichettaTema();try{localStorage.setItem('tema',document.documentElement.dataset.theme)}catch(e){}};T.addEventListener('click',cambiaTema);T2.addEventListener('click',cambiaTema);
try{const s=localStorage.getItem('tema');if(s)document.documentElement.dataset.theme=s}catch(e){}
etichettaTema();
